name: Finalize validated skill migration

on:
  push:
    branches: [chatgpt-dev]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-dev
          fetch-depth: 0
      - name: Apply validated migration
        run: |
          python3 .github/scripts/fix-skill-migration.py
          python3 .github/scripts/skill-achievement-migration.py
          python3 .github/scripts/skill-test-migration.py
          node --check js/character/team-model.js
          node --check js/skills/mastery-core.js
          node --check js/character/team-runtime.js
          node --check js/ui/team-builds.js
          git diff --check
      - name: Commit final files
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/one-time-skill-achievement-unlocks.yml .github/workflows/finalize-skill-achievement-migration.yml .github/scripts/skill-achievement-migration.py .github/scripts/fix-skill-migration.py .github/scripts/skill-test-migration.py
          rm -f .github/migration-error.txt .github/validation-error.txt
          git add -A js .github tests/team-model.test.cjs tests/team-runtime.test.cjs tests/team-builds.browser.test.cjs tests/team-save-compatibility.test.cjs tests/team-save-compatibility.browser.test.cjs
          git commit -m "feat: gate player skills by achievements without skill points"
          git push origin HEAD:chatgpt-dev
