name: Skill gem regression

on:
  push:
    branches: [chatgpt-dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gems:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test gem effects, alchemy and save migration
        run: node --test --test-concurrency=1 tests/skill-gems.test.cjs tests/equipment-skill-system.test.cjs tests/skill-equipment-tutorial.test.cjs tests/skill-system-model.test.cjs
