name: One-time basicElement migration

on:
  push:
    branches: [chatgpt-dev]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message == 'chore: run basicElement migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-dev
          fetch-depth: 0
      - name: Migrate weapon element source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          core = Path('js/core/core-game.js')
          text = core.read_text(encoding='utf-8')
          replacements = {
              "{name:'炎晶杖',atk:1.15,element:'fire'}": "{name:'炎晶杖',fixedEffects:[{key:'gearAtkPct',value:15},{key:'basicElement',value:'fire'}]}",
              "{name:'霜紋杖',atk:1,element:'ice',exclusive:{attackPct:3}}": "{name:'霜紋杖',fixedEffects:[{key:'attackPct',value:3},{key:'basicElement',value:'ice'}]}",
              "{name:'疾風法器',atk:.95,element:'wind',exclusive:{attackPct:2}}": "{name:'疾風法器',fixedEffects:[{key:'gearAtkPct',value:-5},{key:'attackPct',value:2},{key:'basicElement',value:'wind'}]}",
              "{name:'風羽短弓',atk:.95,element:'wind',evasion:4}": "{name:'風羽短弓',fixedEffects:[{key:'gearAtkPct',value:-5},{key:'evasion',value:4},{key:'basicElement',value:'wind'}]}",
              "{name:'晨光權杖',atk:1.1,element:'light'}": "{name:'晨光權杖',fixedEffects:[{key:'gearAtkPct',value:10},{key:'basicElement',value:'light'}]}",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one ITEM_FORMS form, got {count}: {old}')
              text = text.replace(old, new)

          old = "function weaponElement(h){return activeSupply(h,'imbue')?.element||itemForm(equipment(h).find(g=>g.slot===0)||{})?.element||'physical';}"
          new = "function weaponElement(h){const form=itemForm(equipment(h).find(g=>g.slot===0)||{}),basicElement=form?.fixedEffects?.find(e=>e?.key==='basicElement')?.value;return activeSupply(h,'imbue')?.element||basicElement||'physical';}"
          if text.count(old) != 1:
              raise SystemExit('weaponElement legacy source not found exactly once')
          text = text.replace(old, new)

          old = "gearDesc=function(g){const form=itemForm(g);return expansionGearDesc(g)+(form?' / '+[form.element?ELEMENTS[form.element]+'屬性':'',...['critDamage','pierce','lifesteal','evasion','elementBonus'].filter(k=>form[k]).map(k=>({critDamage:'暴傷',pierce:'穿透',lifesteal:'吸血',evasion:'閃避',elementBonus:'屬傷'}[k])+' +'+form[k]+'%')].filter(Boolean).join('、'):'');};"
          new = "gearDesc=function(g){const form=itemForm(g),basicElement=form?.fixedEffects?.find(e=>e?.key==='basicElement')?.value;return expansionGearDesc(g)+(form?' / '+[basicElement?ELEMENTS[basicElement]+'屬性':'',...['critDamage','pierce','lifesteal','evasion','elementBonus'].filter(k=>form[k]).map(k=>({critDamage:'暴傷',pierce:'穿透',lifesteal:'吸血',evasion:'閃避',elementBonus:'屬傷'}[k])+' +'+form[k]+'%')].filter(Boolean).join('、'):'');};"
          if text.count(old) != 1:
              raise SystemExit('legacy gearDesc element source not found exactly once')
          text = text.replace(old, new)

          old = "uiHelp('裝備規則','背包與資源共用。每件裝備依可穿戴職業設定判定；每名角色可裝備 1 件副手與 2 件飾品。')"
          new = "uiHelp('裝備規則','背包與資源共用。每件裝備依可穿戴職業設定判定；每名角色可裝備 1 件副手與 2 件飾品。武器自身攻擊屬性的唯一來源為固定屬性 basicElement（平衡器顯示「此武器攻擊屬性」）；不再使用 ITEM_FORMS.element。')"
          if text.count(old) != 1:
              raise SystemExit('equipment rule help text not found exactly once')
          text = text.replace(old, new)

          marker = "equipmentExclusive:{gearAtkPct:'只增加該件裝備的基礎攻擊 %'"
          replacement = "equipmentExclusive:{basicElement:'武器攻擊屬性的唯一固定來源；設定於 equipmentForms[].fixedEffects，舊 element 僅在匯入時轉換',gearAtkPct:'只增加該件裝備的基礎攻擊 %'"
          if text.count(marker) != 1:
              raise SystemExit('equipmentExclusive reference marker not found exactly once')
          text = text.replace(marker, replacement)

          start = text.index('const ITEM_FORMS=[')
          end = text.index('const EQUIP_POSITION_NAMES=', start)
          item_forms_segment = text[start:end]
          if "element:" in item_forms_segment:
              raise SystemExit('ITEM_FORMS still contains element fields')
          for name, element in [('炎晶杖','fire'),('霜紋杖','ice'),('疾風法器','wind'),('風羽短弓','wind'),('晨光權杖','light')]:
              pos = item_forms_segment.find("name:'"+name+"'")
              if pos < 0 or "key:'basicElement',value:'"+element+"'" not in item_forms_segment[pos:pos+260]:
                  raise SystemExit(f'{name} basicElement migration missing')
          core.write_text(text, encoding='utf-8')

          stat = Path('js/equipment/equipment-stat-source.js')
          text = stat.read_text(encoding='utf-8')
          old = " const src=Array.isArray(form.fixedEffects)&&form.fixedEffects.length?form.fixedEffects:legacy;\n form.fixedEffects=src.map(normalizeFixedEquipmentEffect).filter(Boolean).slice(0,5);"
          new = " const src=Array.isArray(form.fixedEffects)&&form.fixedEffects.length?[...form.fixedEffects]:legacy;\n // Legacy import only: migrate element into basicElement, then remove element below. Live equipment never reads element.\n if(EQUIPMENT_EFFECT_ELEMENTS.has(form.element)&&form.element!=='physical'&&!src.some(e=>e?.key==='basicElement'))src.unshift({key:'basicElement',value:form.element});\n form.fixedEffects=src.map(normalizeFixedEquipmentEffect).filter(Boolean).slice(0,5);"
          if text.count(old) != 1:
              raise SystemExit('equipment form normalization anchor not found exactly once')
          text = text.replace(old, new)
          old = "  if(form?.element&&form.element!=='physical')parts.push(`普攻屬性 ${ELEMENTS[form.element]}`);"
          new = "  const basicElement=form?.fixedEffects?.find(e=>e?.key==='basicElement')?.value;\n  if(basicElement&&basicElement!=='physical')parts.push(`此武器攻擊屬性 ${ELEMENTS[basicElement]}`);"
          if text.count(old) != 1:
              raise SystemExit('exclusiveEquipmentText legacy element read not found exactly once')
          text = text.replace(old, new)
          old = "'equipmentForms.fixedEffects 為每件基底裝備的 1～5 條固定屬性；舊 exclusive / element 匯入時會自動轉換。'"
          new = "'equipmentForms.fixedEffects 為每件基底裝備的 1～5 條固定屬性；武器攻擊屬性唯一來源為 basicElement。舊 element 僅在匯入時轉換為 basicElement，隨即移除。'"
          if text.count(old) != 1:
              raise SystemExit('export note anchor not found exactly once')
          text = text.replace(old, new)
          stat.write_text(text, encoding='utf-8')

          identity = Path('js/equipment/equipment-identity.js')
          text = identity.read_text(encoding='utf-8')
          old = "basicElement:'普通攻擊屬性'"
          new = "basicElement:'此武器攻擊屬性'"
          if text.count(old) != 1:
              raise SystemExit('basicElement label not found exactly once')
          text = text.replace(old, new)
          old = "if(key==='basicElement')return '普通攻擊改為'+(ELEMENTS[value]||value)+'屬性';"
          new = "if(key==='basicElement')return '此武器攻擊屬性：'+(ELEMENTS[value]||value)+'（固定屬性 basicElement）';"
          if text.count(old) != 1:
              raise SystemExit('basicElement effect text not found exactly once')
          text = text.replace(old, new)
          identity.write_text(text, encoding='utf-8')
          PY

          node --check js/core/core-game.js
          node --check js/equipment/equipment-stat-source.js
          node --check js/equipment/equipment-identity.js
          git diff --check
          git grep -n "itemForm(.*\.element" -- js/core/core-game.js js/equipment || true

      - name: Commit migration
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-basic-element-migration.yml
          git add js/core/core-game.js js/equipment/equipment-stat-source.js js/equipment/equipment-identity.js
          git commit -m "fix: unify weapon attack elements under basicElement"
          git push origin HEAD:chatgpt-dev
