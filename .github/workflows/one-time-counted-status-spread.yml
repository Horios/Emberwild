name: One-time counted status and damage spread

on:
  push:
    branches:
      - chatgpt-dev
    paths:
      - .github/workflows/one-time-counted-status-spread.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-dev
          fetch-depth: 0
      - name: Rebase onto latest chatgpt-dev
        run: git pull --rebase origin chatgpt-dev
      - name: Apply patch
        run: python3 .github/scripts/patch-counted-status.py
      - name: Run targeted tests
        run: |
          npm install --ignore-scripts
          node --test tests/status-advanced.test.cjs tests/skill-effects.test.cjs tests/team-save-compatibility.test.cjs
      - name: Commit implementation
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-counted-status-spread.yml .github/scripts/patch-counted-status.py
          git add js/core/core-game.js js/skills/status-maker.js js/combat/skill-effect-runtime.js tests/status-advanced.test.cjs package.json
          git commit -m "feat: add counted status targeting and damage spread"
          git pull --rebase origin chatgpt-dev
          git push origin HEAD:chatgpt-dev
