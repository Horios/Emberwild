name: One-time player skill unlock migration

on:
  push:
    branches: [chatgpt-dev]

permissions:
  contents: write

jobs:
  migrate:
    if: "${{ github.event.head_commit.message != 'chore: capture migration error' && github.event.head_commit.message != 'chore: capture validation error' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-dev
          fetch-depth: 0
      - name: Apply migration
        shell: bash
        run: |
          set +e
          { python3 .github/scripts/fix-skill-migration.py && python3 .github/scripts/skill-achievement-migration.py && python3 .github/scripts/skill-test-migration.py; } > /tmp/migration.log 2>&1
          status=$?
          cat /tmp/migration.log
          if [ $status -ne 0 ]; then
            cp /tmp/migration.log .github/migration-error.txt
            git config user.name "ChatGPT"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/migration-error.txt
            git commit -m "chore: capture migration error"
            git push origin HEAD:chatgpt-dev
            exit $status
          fi
      - name: Validate
        shell: bash
        run: |
          set +e
          {
            node --check js/character/team-model.js &&
            node --check js/skills/mastery-core.js &&
            node --check js/character/team-runtime.js &&
            node --check js/ui/team-builds.js &&
            node --check js/core/core-game.js &&
            node --check js/character/companion-unlocks.js &&
            node --check tests/team-builds.browser.test.cjs &&
            git diff --check &&
            npm ci &&
            npx playwright install --with-deps chromium &&
            node --test tests/team-model.test.cjs tests/team-save-compatibility.test.cjs tests/team-save-compatibility.browser.test.cjs tests/team-runtime.test.cjs tests/skill-board.test.cjs &&
            node --test --test-name-pattern='Chromium: (create blank plans|worn equipment|preview copies)' tests/team-builds.browser.test.cjs
          } > /tmp/validation.log 2>&1
          status=$?
          cat /tmp/validation.log
          if [ $status -ne 0 ]; then
            cp /tmp/validation.log .github/validation-error.txt
            git config user.name "ChatGPT"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/validation-error.txt
            git commit -m "chore: capture validation error"
            git push origin HEAD:chatgpt-dev
            exit $status
          fi
      - name: Commit migration
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-skill-achievement-unlocks.yml .github/scripts/skill-achievement-migration.py .github/scripts/fix-skill-migration.py .github/scripts/skill-test-migration.py
          rm -f .github/migration-error.txt .github/validation-error.txt
          git add -A js .github tests/team-model.test.cjs tests/team-runtime.test.cjs tests/team-builds.browser.test.cjs tests/team-save-compatibility.test.cjs tests/team-save-compatibility.browser.test.cjs
          git commit -m "feat: gate player skills by achievements without skill points"
          git push origin HEAD:chatgpt-dev
