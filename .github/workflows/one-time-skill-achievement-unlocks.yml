name: One-time player skill unlock migration

on:
  push:
    branches: [chatgpt-dev]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message != 'chore: capture migration error'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-dev
          fetch-depth: 0
      - name: Apply migration
        shell: bash
        run: |
          set +e
          { python3 .github/scripts/fix-skill-migration.py && python3 .github/scripts/skill-achievement-migration.py; } > /tmp/migration.log 2>&1
          status=$?
          cat /tmp/migration.log
          if [ $status -ne 0 ]; then
            cp /tmp/migration.log .github/migration-error.txt
            git config user.name "ChatGPT"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/migration-error.txt
            git commit -m "chore: capture migration error"
            git push origin HEAD:chatgpt-dev
            exit $status
          fi
      - name: Validate
        run: |
          node --check js/character/team-model.js
          node --check js/skills/mastery-core.js
          node --check js/character/team-runtime.js
          node --check js/ui/team-builds.js
          node --check js/core/core-game.js
          node --check js/character/companion-unlocks.js
          git diff --check
          npm ci
          npm run test:teams
          node --test tests/achievements.test.cjs tests/skill-board.test.cjs
      - name: Commit migration
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-skill-achievement-unlocks.yml .github/scripts/skill-achievement-migration.py .github/scripts/fix-skill-migration.py
          rm -f .github/migration-error.txt
          git add -A js .github tests/team-model.test.cjs tests/team-runtime.test.cjs
          git commit -m "feat: gate player skills by achievements without skill points"
          git push origin HEAD:chatgpt-dev
