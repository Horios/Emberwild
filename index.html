<script id="combat-contribution-meter-system">
/* Persistent active-party contribution meter: damage, healing and shield absorption. */
(()=>{
  const BASE_KEY='emberwild-combat-contribution-v1';
  let cacheKey='',cache=null,selectedMetric='damage';

  function storageKey(){
    const root=party?.members?.[0];
    const id=Number.isFinite(Number(root?.created))?String(root.created):'default';
    return BASE_KEY+':'+id;
  }
  function activeSignature(){
    if(!party?.active)return '';
    return [...party.active].filter(Number.isInteger).sort((a,b)=>a-b).join(',');
  }
  function blankRow(){return {damage:0,healing:0,mitigation:0};}
  function blankState(signature=activeSignature()){
    const out={teamSignature:signature,byJob:{}};
    for(let job=0;job<CLASSES.length;job++)out.byJob[job]=blankRow();
    return out;
  }
  function normalize(raw){
    const signature=typeof raw?.teamSignature==='string'?raw.teamSignature:'';
    const out=blankState(signature),src=raw&&typeof raw==='object'&&raw.byJob&&typeof raw.byJob==='object'?raw.byJob:{};
    for(let job=0;job<CLASSES.length;job++){
      const row=src[job]||src[String(job)]||{},clean=blankRow();
      for(const key of ['damage','healing','mitigation']){
        const n=Number(row[key]);
        clean[key]=Number.isFinite(n)&&n>0?Math.min(1e15,n):0;
      }
      out.byJob[job]=clean;
    }
    return out;
  }
  function writeCache(){
    if(!party||!cache)return;
    try{localStorage.setItem(storageKey(),JSON.stringify(cache));}catch{}
  }
  function ensure(){
    const key=storageKey(),signature=activeSignature();
    if(!cache||cacheKey!==key){
      cacheKey=key;
      try{cache=normalize(JSON.parse(localStorage.getItem(key)||'null'));}catch{cache=blankState(signature);}
    }
    if(cache.teamSignature!==signature){
      cache=blankState(signature);
      writeCache();
    }
    return cache;
  }
  function persist(){
    if(!party)return;
    ensure();
    writeCache();
  }
  globalThis.recordCombatContribution=function(hero,key,amount){
    if(!party||!['damage','healing','mitigation'].includes(key))return;
    const job=typeof hero==='number'?hero:hero?.job,n=Number(amount);
    if(!Number.isInteger(job)||!party.active.includes(job)||!Number.isFinite(n)||n<=0)return;
    const stats=ensure(),row=stats.byJob[job]||(stats.byJob[job]=blankRow());
    row[key]=Math.min(1e15,(Number(row[key])||0)+n);
  };
  globalThis.resetCombatContribution=function(){
    if(!party)return;
    cache=blankState(activeSignature());cacheKey=storageKey();writeCache();save();render();
  };
  globalThis.setCombatContributionMetric=function(metric){
    if(!['damage','healing','mitigation'].includes(metric))return;
    selectedMetric=metric;
    render();
  };
  globalThis.recordRegenContribution=function(target,healed){
    const total=Number(healed);
    if(!party||!target||!party.active.includes(target.job)||!Number.isFinite(total)||total<=0)return;
    const rows=effects.filter(fx=>fx.target===heroKey(target)&&fx.kind==='regen'&&fx.until>partyClock&&Number(fx.value)>0);
    const weight=rows.reduce((sum,fx)=>sum+Number(fx.value),0);
    if(weight<=0)return;
    for(const fx of rows){
      const caster=party.members.find(h=>h.job===fx.source);
      if(caster&&party.active.includes(caster.job))recordCombatContribution(caster,'healing',total*Number(fx.value)/weight);
    }
  };
  globalThis.combatContributionPanel=function(){
    if(!party)return '';
    const stats=ensure(),fmt=n=>Math.round(Number(n)||0).toLocaleString('zh-TW');
    const labels={damage:'傷害',healing:'治療',mitigation:'減傷'};
    const active=party.active.map(job=>party.members.find(h=>h.job===job)).filter(Boolean);
    const values=active.map(h=>({h,value:Number(stats.byJob[h.job]?.[selectedMetric])||0}));
    const max=Math.max(0,...values.map(x=>x.value));
    const bars=values.map(({h,value})=>{
      const width=max>0?Math.max(value>0?2:0,Math.min(100,value/max*100)):0;
      return '<div class="combat-contribution-row">'+
        '<span class="combat-contribution-name" title="'+esc(characterName(h))+'">'+esc(characterName(h))+'</span>'+
        '<div class="combat-contribution-track" aria-label="'+esc(characterName(h))+' '+labels[selectedMetric]+' '+fmt(value)+'"><div class="combat-contribution-fill" style="width:'+width+'%"></div></div>'+
        '<span class="combat-contribution-value">'+fmt(value)+'</span></div>';
    }).join('');
    const tabs=['damage','healing','mitigation'].map(key=>'<button class="'+(selectedMetric===key?'active':'')+'" onclick="setCombatContributionMetric(\''+key+'\')">'+labels[key]+'</button>').join('');
    return '<div class="combat-contribution-meter"><div class="combat-contribution-head"><b>隊伍戰鬥統計</b><button onclick="resetCombatContribution()" title="將目前隊伍的累積統計歸零">重置</button></div>'+
      '<div class="combat-contribution-tabs">'+tabs+'</div>'+
      '<div class="combat-contribution-bars">'+bars+'</div>'+
      '<p class="small combat-contribution-note">僅統計目前出戰成員；更換出戰隊伍會自動重置。減傷只計護盾實際抵擋的傷害。</p></div>';
  };

  if(typeof save==='function'){
    const baseSave=save;
    save=function(show=false){persist();return baseSave(show);};
  }
  if(typeof newGame==='function'){
    const baseNewGame=newGame;
    newGame=function(){cache=null;cacheKey='';selectedMetric='damage';return baseNewGame();};
  }
})();
</script>

<script id="expedition-ui-tidy-patch">
/* Update 27: compact expedition controls + lower-density battle journal. */
(function installExpeditionUiTidy(){
  const style=document.createElement('style');
  style.textContent=`

  .expedition-control-card .icon-help{width:28px!important;min-width:28px!important;padding:0!important;border-radius:999px;font-weight:700}
  .expedition-control-card .boss-compact{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
  .expedition-control-card .boss-head{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:5px}

  .expedition-control-card .boss-meta{display:flex;gap:5px 8px;flex-wrap:wrap;font-size:11px;color:var(--muted);line-height:1.4}
  .expedition-control-card .boss-actions{display:flex;gap:6px;align-items:center;margin-top:7px}
  .expedition-control-card .boss-actions button{flex:1}
  .expedition-control-card details{margin-top:7px}
  .expedition-control-card details>summary{cursor:pointer;color:var(--muted);font-size:11px}
  .expedition-control-card .supply-list{display:grid;gap:5px;margin-top:6px}
  .expedition-control-card .supply-row{border:1px solid rgba(255,255,255,.08);padding:6px;border-radius:7px;display:grid;gap:5px}
  .expedition-control-card .supply-row-head{display:flex;justify-content:space-between;gap:6px;align-items:center}
  .expedition-control-card .supply-actions{display:flex;gap:4px;flex-wrap:wrap}
  .expedition-control-card .supply-actions button{height:27px;font-size:11px;padding:2px 5px}
  .expedition-control-card .supply-actions label{display:flex;align-items:center;gap:3px;font-size:10px;color:var(--muted)}
  .party-combat>.actions>.icon-help{width:28px!important;height:28px!important;min-width:28px!important;padding:0!important;border-radius:999px;font-size:11px;flex:0 0 28px!important}
  /* Remove the superseded standalone panels that used to repeat the same controls. */
  .difficulty-panel,.pace-controls,.boss-meter-panel,.expedition-tools{display:none!important}

  /* Journal: show the useful live log first, move secondary data behind one disclosure. */
  #app>.layout{grid-template-columns:150px minmax(0,1fr) clamp(235px,20vw,310px)!important}
  .global-battle-journal{grid-template-rows:auto minmax(0,1fr) auto!important;gap:5px!important;padding:7px!important}
  .global-journal-head{max-height:none!important;overflow:visible!important}
  .global-journal-head .journal-title-row{display:flex;align-items:center;justify-content:space-between;gap:6px}
  .global-journal-head h2{font-size:14px!important}
  .global-journal-head .journal-summary{font-size:11px;color:var(--muted);margin:3px 0 5px;white-space:normal;line-height:1.35}
  .global-journal-head .journal-actions{display:flex;gap:5px}
  .global-journal-head .journal-actions button{height:28px;min-height:28px;width:auto!important;padding:3px 7px;font-size:11px}
  .global-battle-journal #liveLog{min-height:0!important;overflow:hidden!important}
  .battle-log-stream{--battle-log-visible-rows:8!important;--battle-log-row-height:21px!important}
  .global-battle-journal .journal-loot-compact{border-top:1px solid var(--line);padding-top:5px;margin:0;min-height:0}
  .global-battle-journal .journal-loot-compact>summary{height:auto!important;cursor:pointer;font-size:11px;color:var(--muted)}
  .global-battle-journal .journal-loot-list{max-height:145px;overflow:auto;margin-top:5px}
  .global-battle-journal .journal-loot-row{font-size:11px;padding:2px 0}
  @media(max-width:1100px){
    #app>.layout{grid-template-columns:116px minmax(0,1fr) 245px!important}
    .text-battle-layout{grid-template-columns:minmax(0,1fr)!important;grid-template-rows:auto auto!important}
    .battle-map-column.expedition-control-card{grid-column:1;grid-row:2;max-height:none}
  }
  `;
  document.head.appendChild(style);

  const safeEsc=s=>typeof esc==='function'?esc(String(s)):String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const isFinal=mi=>typeof globalThis.isFinalMap==='function'?globalThis.isFinalMap(mi):GAMEPLAY_SETTINGS?.maps?.catalog?.[mi]?.mapType==='final';
  const mapCfg=mi=>typeof globalThis.worldMapConfig==='function'?globalThis.worldMapConfig(mi):GAMEPLAY_SETTINGS?.maps?.catalog?.[mi];
  const progressEntry=mi=>typeof globalThis.bossProgressEntry==='function'?globalThis.bossProgressEntry(mi):(party?.bossProgress?.[mapCfg(mi)?.id]||{progress:0,charges:0});
  const bossRows=mi=>typeof globalThis.configuredBossStageRows==='function'?globalThis.configuredBossStageRows(mi):[];
  const finalRows=mi=>typeof globalThis.configuredFinalStageRows==='function'?globalThis.configuredFinalStageRows(mi):[];
  const fmt=n=>Math.round((Number(n)||0)*100)/100;
  function tooltip(label,text){return `<button type="button" class="icon-help" title="${safeEsc(text)}" aria-label="${safeEsc(label+'：'+text)}">?</button>`;}

  function compactSupply(){
    const pc=Math.round(GS('quests.potion.buyCost',75)),pq=Math.round(GS('quests.potion.buyQuantity',5)),th=Math.round(GS('combat.autoPotionThreshold',.35)*10000)/100;
    return `<details><summary>隊伍補給</summary><div class="supply-list">${party.members.map(h=>`<div class="supply-row"><div class="supply-row-head"><b>${safeEsc(characterName(h))}</b><span class="small">藥水 ${h.potions}</span></div><div class="supply-actions"><button onclick="heroMenuAction(${h.job},()=>potion())" ${h.potions<1?'disabled':''}>喝藥</button><button onclick="heroMenuAction(${h.job},()=>buyPotion())" ${h.gold<pc?'disabled':''}>+${pq}／${pc}金</button><label title="生命低於 ${th}% 時自動使用治療藥水"><input type="checkbox" ${h.autoPotion?'checked':''} onchange="heroMenuAction(${h.job},()=>{state.autoPotion=this.checked;save()})">自動</label></div></div>`).join('')}</div></details>`;
  }

  function bossBlock(mi){
    if(isFinal(mi)){
      const rows=finalRows(mi),total=rows.reduce((n,x)=>n+(x.count||0),0)||1;
      return `<div class="boss-compact"><div class="boss-head"><b>終局關卡</b><span class="tag">${total} 隻</span></div><div class="boss-meta"><span>固定編成</span><span>${party?.bossChallenge?.active?'挑戰中':'直接由探索進入'}</span></div></div>`;
    }
    const cfg=mapCfg(mi),bm=GAMEPLAY_SETTINGS.monsters.bossMeter,entry=progressEntry(mi),enabled=cfg?.bossEnabled!==false,active=party?.bossChallenge?.active&&party.bossChallenge.mapIndex===mi,total=enabled?bossRows(mi).reduce((n,x)=>n+(x.count||0),0):0,pct=entry.charges>=bm.maxCharges?100:Math.max(0,Math.min(100,(Number(entry.progress)||0)/bm.progressPerCharge*100));
    return `<div class="boss-compact"><div class="boss-head"><b>${active?'BOSS 關卡':'BOSS 進度'}</b><span class="tag">${entry.charges}/${bm.maxCharges} 次</span></div><div class="boss-meter"><span style="width:${pct}%"></span></div><div class="boss-meta"><span>${fmt(entry.progress)}/${bm.progressPerCharge}%</span><span>普通 +${bm.normalProgress}%</span><span>菁英 ×${bm.eliteMultiplier}</span><span>${total} 隻／場</span></div><div class="boss-actions">${active?`<button class="danger" onclick="leaveBossChallenge()" title="離開會放棄目前已消耗的一次，剩餘次數保留。">離開關卡</button>`:`<button class="primary" onclick="startBossChallenge()" ${!enabled||entry.charges<1?'disabled':''} title="${enabled?'使用 1 次累積挑戰進入本地圖 BOSS 關卡。':'此地圖 BOSS 挑戰已停用。'}">挑戰 BOSS</button>`}${tooltip('BOSS 規則','普通與菁英怪擊殺會累積進度；進度滿後增加一次挑戰，次數用完會自動返回一般探索。')}</div></div>`;
  }

  function expeditionControlCard(){
    const mi=party.map,mode=party.difficulty||0;
    return `<section class="panel battle-map-column expedition-control-card"><div class="control-head"><div><span class="eyebrow">EXPEDITION CONTROL</span><h2>探索控制</h2></div>${tooltip('探索控制','地圖、難度與倍速共用此面板。切換地圖或難度會結束目前遭遇。介面中的「回合」是指該角色每次輪到自己行動一次；技能與治療藥水等冷卻只在該角色行動時遞減 1，不受戰鬥倍速影響。自動喝水在角色回合開始時判定，且不會取消原本的攻擊。')}</div><div class="control-grid"><label class="control-row"><span>地圖</span><select aria-label="探索地圖" onchange="chooseMap(Number(this.value))">${MAPS.map((m,i)=>`<option value="${i}" ${i===mi?'selected':''} ${canVisit(i)?'':'disabled'}>${safeEsc(m.name)} · LV${m.min}${isFinal(i)?' 終局':'–'+m.max}</option>`).join('')}</select><button onclick="showRegionBestiary()" title="查看目前區域怪物、BOSS 關卡與掉落">圖鑑</button></label><label class="control-row"><span>難度</span><select aria-label="探索難度" onchange="changeDifficulty(this.value)">${MODES.map((d,i)=>`<option value="${i}" ${i===mode?'selected':''}>${safeEsc(d.name)}</option>`).join('')}</select>${tooltip('難度','切換難度會結束目前遭遇；不會恢復生命。詳細倍率可在冒險指南查看。')}</label><div class="control-row"><span>倍速</span><button onclick="toggleBattleRate()" title="點擊循環切換可用戰鬥倍速">${battleRate}×</button>${tooltip('戰鬥節奏','倍速只影響等待時間，不改變回合制冷卻與行動順序。')}</div></div>${bossBlock(mi)}${compactSupply()}${combatContributionPanel()}</section>`;
  }

  if(typeof battleView==='function'){
    const compactBattleViewBase=battleView;
    battleView=function(){
      let html=compactBattleViewBase();
      if(!party)return html;
      /* Replace the existing right-side map list with the unified control card. */
      html=html.replace(/<section class="panel battle-map-column">[\s\S]*?<\/section>/,expeditionControlCard());
      /* In case an older wrapper failed to create that column, inject before the battle grid closes. */
      if(!html.includes('expedition-control-card')){
        const marker='</div><section class="panel battle-buffs">';
        if(html.includes(marker))html=html.replace(marker,expeditionControlCard()+marker);
        else html+=expeditionControlCard();
      }
      /* Keep combat rules available without occupying a separate row. */
      html=html.replace(/<p class="small combat-rule">[\s\S]*?<\/p>/,'');
      html=html.replace(/(<button class="primary" onclick="toggleBattle\(\)">[\s\S]*?<\/button>)/,`$1${tooltip('戰鬥規則','• 冷卻：技能與治療藥水等只在對應角色完成自己的行動時遞減 1，不受戰鬥倍速影響。\n• 自動攻擊：集中攻擊敵方隊列中第一名仍存活的敵人，擊倒後再依序切換下一名。\n• 遭遇結束：全隊生命回滿並清空護盾。\n• 技能冷卻：每次新遭遇開始時重置。')}`);
      return html;
    };
  }

  if(typeof sharedBattleJournal==='function'){
    sharedBattleJournal=function(){
      if(!party)return '';
      const paused=$('modal').open,alive=living().length,total=heroes().length,enemies=foes.filter(e=>e.hp>0).length,allEnemies=foes.length,lootKinds=expeditionLoot.items.size;

<script id="turn-duration-system">
/* Update 30: combat status durations use battle turns instead of seconds. */
(function installTurnDurationSystem(){
  const TIME_UNITS={supportDuration:'battleRounds',itemDuration:'battleRounds'};
  const SUPPLY_KEYS=['imbue','ward','elementTonic'];
  const roundReferenceMs=cfg=>Math.max(1,Number(cfg?.balanceSettings?.combat?.pacing?.roundMinimumMs ?? (typeof GS==='function'?GS('combat.pacing.roundMinimumMs',6000):6000))||6000);
  const clone=v=>JSON.parse(JSON.stringify(v));
  function turnsFromLegacySeconds(seconds,cfg){return Math.max(1,Math.ceil(Math.max(0,Number(seconds)||0)/(roundReferenceMs(cfg)/1000)));}
  function normalizeTurnConfig(input){
    const out=clone(input||{}),legacyItems=out?.timeUnits?.itemDuration!=='battleRounds';
    if(Array.isArray(out.supportSkills))for(const list of out.supportSkills||[])for(const sk of list||[]){
      if(Number.isFinite(sk.duration))sk.duration=Math.max(0,Math.round(sk.duration));
      if(Number.isFinite(sk.cooldown))sk.cooldown=Math.max(0,Math.round(sk.cooldown));
    }
    if(Array.isArray(out.items))for(const item of out.items){
      if(Number.isFinite(item.duration))item.duration=legacyItems&&item.duration>0?turnsFromLegacySeconds(item.duration,out):Math.max(0,Math.round(item.duration));
    }
    out.timeUnits={...(out.timeUnits||{}),...TIME_UNITS};
    return out;
  }
  function migrateSupplyBuff(buff){
    if(!buff||typeof buff!=='object')return null;
    if(Number.isFinite(buff.remainingTurns)){
      const left=Math.max(0,Math.ceil(buff.remainingTurns));if(left<=0)return null;
      return {...buff,remainingTurns:left,totalTurns:Math.max(left,Math.ceil(Number(buff.totalTurns)||left)),until:0};
    }
    if(Number.isFinite(buff.until)&&buff.until>Date.now()){
      const left=Math.max(1,Math.ceil((buff.until-Date.now())/roundReferenceMs()));
      return {element:buff.element,remainingTurns:left,totalTurns:left,until:0};
    }
    return null;
  }
  function migrateHeroSupplyTurns(h){if(!h)return;for(const key of SUPPLY_KEYS)h[key]=migrateSupplyBuff(h[key]);}
  function migratePartySupplyTurns(){if(party?.members)for(const h of party.members)migrateHeroSupplyTurns(h);else if(state)migrateHeroSupplyTurns(state);}
  function decrementSupplyTurns(){
    if(!party)return;
    for(const h of heroes())for(const key of SUPPLY_KEYS){const b=activeSupply(h,key);if(!b)continue;b.remainingTurns=Math.max(0,Math.ceil(b.remainingTurns)-1);b.until=0;if(b.remainingTurns<=0)h[key]=null;}
  }

  EFFECT_NAMES.regen='每回合回復生命';
  activeSupply=function(h,key){const b=h?.[key];return b&&Number.isFinite(b.remainingTurns)&&b.remainingTurns>0?b:null;};
  useSupply=function(id){const item=SHOP.find(x=>x.id===id);if(!item||(state.consumables[id]||0)<1)return;state.consumables[id]--;const turns=Math.max(1,Math.round(Number(item.duration)||1));state[item.type]={element:item.element,remainingTurns:turns,totalTurns:turns,until:0};save();render();toast('已使用'+item.name);};
  supplyStatus=function(h){return SUPPLY_KEYS.map(key=>{const b=activeSupply(h,key);return b?ELEMENTS[b.element]+{imbue:'附魔',ward:'抗性',elementTonic:'增幅'}[key]+' '+Math.ceil(b.remainingTurns)+' 回合':'';}).filter(Boolean).join(' ／ ');};
  supplyDetail=function(item){const effect=item.type==='imbue'?`普通攻擊轉為${ELEMENTS[item.element]}屬性`:item.type==='ward'?`${ELEMENTS[item.element]}屬性傷害減少 ${Math.round(GS('combat.supply.wardResistance',.25)*10000)/100}%`:item.type==='elementTonic'?`${ELEMENTS[item.element]}屬性傷害增加 ${Math.round(GS('combat.supply.elementTonicDamage',.2)*10000)/100}%`:'依道具效果生效';return `${effect} · ${item.duration?`持續 ${Math.round(item.duration)} 戰鬥回合`:'立即生效'} · 單價 ${item.cost} 金幣`;};

  castSupport=function(h,index){const sk=SUPPORT[h.job][index];let targets=sk.target==='allies'?living().map(heroKey):sk.target==='weakest'?[heroKey([...living()].sort((a,b)=>a.hp/solo.stats(a).hp-b.hp/solo.stats(b).hp)[0])]:sk.target==='enemies'?foes.filter(e=>e.hp>0).map(e=>e.id):[foes.find(enemyAvailableForSingleTarget)?.id];for(const target of targets.filter(Boolean)){effects=effects.filter(e=>!(e.source===h.job&&e.skill===index&&e.target===target));effects.push({source:h.job,skill:index,target,kind:sk.kind,value:supportAmount(h.job,index),until:partyClock+Math.max(0,Math.round(sk.duration)),name:sk.name});if(sk.kind==='regen'){const ally=party.members.find(a=>heroKey(a)===target);ally.hp=Math.min(solo.stats(ally).hp,ally.hp+solo.stats(ally).hp*supportAmount(h.job,index));}}note(characterName(h)+'施放 '+sk.name+' · '+Math.round(sk.duration)+' 回合');};
  supportSkillDetail=function(job,i,h=state){const sk=SUPPORT[job]?.[i];if(!sk)return '';const level=Math.max(1,h?.supportLevels?.[i]||1),value=+((sk.value+Math.max(0,level-1)*(Number.isFinite(sk.effectPerLevel)?sk.effectPerLevel:GS('skills.support.effectPerExtraLevel',.2)))*100).toFixed(1),cd=supportSkillCooldown(h,i);return `${actionTurnElementLabel(sk.element)} · 目標 ${TARGET_NAMES[sk.target]} · ${EFFECT_NAMES[sk.kind]} ${value}% · 持續 ${Math.round(sk.duration)} 戰鬥回合 · 冷卻 ${cd} 回合 · 需求 LV${sk.level}${i===2?'／二轉':''}`;};

  battleBuffRows=function(){
    const rows=[],row=(who,name,detail,time,clock)=>`<tr><td>${esc(who)}</td><td>${esc(name)}</td><td>${esc(detail)}</td><td class="buff-time">${esc(time)}</td><td>${esc(clock)}</td></tr>`,names={attack:'攻擊提升',power:'技能威力提升',guard:'傷害減免',fracture:'防禦降低',weaken:'攻擊降低',vulnerable:'承受傷害增加',critical:'暴擊率提升',regen:'每回合恢復最大生命'};
    for(const e of effects.filter(e=>e.until>partyClock)){
      const h=party.members.find(h=>heroKey(h)===e.target),foe=foes.find(f=>f.id===e.target);if(!h&&!foe)continue;const sk=SUPPORT[e.source]?.[e.skill],total=Math.max(0,Math.round(sk?.duration??0));
      rows.push(row(h?characterName(h):foe.name,e.name,(names[e.kind]||e.kind)+' '+Number((e.value*100).toFixed(1))+'%',Math.max(0,Math.ceil(e.until-partyClock))+' / '+(total||'—')+' 回合','戰鬥回合'));
    }
    for(const h of party.members){
      const who=characterName(h)+(party.active.includes(h.job)?'':'（候補）');
      for(const key of SUPPLY_KEYS){const b=activeSupply(h,key);if(!b)continue;const labels={imbue:['附魔藥水','普攻改為'+ELEMENTS[b.element]+'屬性'],ward:['抗性藥水',ELEMENTS[b.element]+'傷害減免 '+Math.round(GS('combat.supply.wardResistance',.25)*10000)/100+'%'],elementTonic:['增幅藥水',ELEMENTS[b.element]+'傷害增加 '+Math.round(GS('combat.supply.elementTonicDamage',.2)*10000)/100+'%']};rows.push(row(who,ELEMENTS[b.element]+labels[key][0],labels[key][1],Math.ceil(b.remainingTurns)+' / '+Math.ceil(b.totalTurns||b.remainingTurns)+' 回合','出戰回合'));}
      if(h.shield>0)rows.push(row(who,'護盾','可抵擋所有來源傷害 · 剩餘 '+Math.round(h.shield),'無回合期限','耗盡或戰鬥結束'));
    }
    return rows.join('')||'<tr><td colspan="5" class="no-buffs">目前沒有生效中的 BUFF、DEBUFF 或消耗品效果。</td></tr>';
  };
  showBattleEffects=function(){if(!party)return;const modal=$('modal');modal.innerHTML=`<h2>生效效果與持續回合</h2><p class="small">BUFF／DEBUFF 依戰鬥回合計時；消耗品只在該角色出戰的戰鬥回合扣減。</p><div class="effects-modal-scroll"><table class="effects-modal-table"><thead><tr><th>對象</th><th>效果</th><th>能力變化</th><th>剩餘／總回合</th><th>計時方式</th></tr></thead><tbody id="battle-effect-modal-rows">${battleBuffRows()}</tbody></table></div><button onclick="closeModal()">關閉</button>`;modal.showModal();};

  const pacedRoundTurnDurationBase=pacedRound;
  pacedRound=function*(){const hadCombat=!!party&&foes.some(e=>e.hp>0);yield* pacedRoundTurnDurationBase();if(hadCombat&&party)decrementSupplyTurns();};

  if(typeof battleView==='function'){
    const turnDurationBattleViewBase=battleView;
    battleView=function(){return turnDurationBattleViewBase().replace(/第 (\d+) 秒/g,'第 $1 回合');};
  }
  if(typeof shopView==='function'){
    const turnDurationShopBase=shopView;
    shopView=function(){return turnDurationShopBase().replace(/消耗品按現實時間計時，暫停或關閉遊戲仍會到期。/g,'消耗品效果以戰鬥回合計時；只有角色出戰的戰鬥回合會扣減，暫停或關閉遊戲不會消耗回合。').replace(/持續 (\d+) 秒/g,'持續 $1 回合');};
  }
  if(typeof guideView==='function'){
    const turnDurationGuideBase=guideView;
    guideView=function(){return `<section class="panel"><h2>BUFF／DEBUFF 回合制</h2><p>輔助技能的 BUFF／DEBUFF 持續時間統一使用「戰鬥回合」；回復效果每戰鬥回合觸發一次。消耗品效果同樣使用回合數，只有該角色實際出戰的戰鬥回合會扣減。暫停、關閉頁面與候補狀態都不會消耗消耗品回合。</p><p>技能冷卻仍使用施放者自己的行動回合；護盾沒有回合期限，只在耗盡或戰鬥結束時消失。</p></section>`+turnDurationGuideBase().replace(/消耗品按現實時間計時，暫停或關閉遊戲仍會到期。/g,'消耗品效果按戰鬥回合計時。');};
  }

  if(typeof exportableBalance==='function'){
    const turnDurationExportBase=exportableBalance;
    exportableBalance=function(){const out=turnDurationExportBase();out.timeUnits={...(out.timeUnits||{}),...TIME_UNITS};out.notes=[...(out.notes||[]),'supportSkills[].duration 單位為戰鬥回合；其數值原本實際就是依 partyClock 回合推進，因此舊數值直接保留。','items[].duration 單位為角色出戰的戰鬥回合；舊版現實秒會依 1× 每回合最短時間換算為回合後匯入。'];return out;};
  }
  if(typeof validateBalanceConfig==='function'){
    const turnDurationValidateBase=validateBalanceConfig;
    validateBalanceConfig=function(input){const copy=normalizeTurnConfig(input),out=turnDurationValidateBase(copy);for(const [job,list] of (out.supportSkills||[]).entries())for(const [i,sk] of (list||[]).entries()){if(!Number.isInteger(sk.duration)||sk.duration<0)throw Error(`輔助技能持續回合無效：${job}-${i}`);if(!Number.isInteger(sk.cooldown)||sk.cooldown<0)throw Error(`輔助技能冷卻回合無效：${job}-${i}`);}for(const item of out.items||[])if(!Number.isInteger(item.duration)||item.duration<0)throw Error('道具持續回合無效：'+(item.id||'未知'));out.timeUnits={...(out.timeUnits||{}),...TIME_UNITS};return out;};
  }
  if(typeof balanceReference==='function'){
    const turnDurationReferenceBase=balanceReference;
    balanceReference=function(){const r=turnDurationReferenceBase();r.units??={};r.units.duration='BUFF／DEBUFF 為戰鬥回合；消耗品為角色出戰回合';r.units.cooldown='技能冷卻為施放者自身行動回合';return r;};
  }
  if(typeof applyBalanceConfig==='function'){
    const turnDurationApplyBase=applyBalanceConfig;
    applyBalanceConfig=function(input,{persist=true}={}){const copy=normalizeTurnConfig(input),result=turnDurationApplyBase(copy,{persist:false});if(persist)localStorage.setItem(BALANCE_KEY,JSON.stringify(exportableBalance()));if(state)render();return result;};
  }

  /* Migrate an already loaded old balance/save once. Support duration numbers are
     preserved because the old runtime already advanced them by partyClock rounds. */
  try{
    const raw=localStorage.getItem(BALANCE_KEY);let legacyBalance=null;
    if(raw){try{legacyBalance=JSON.parse(raw);}catch{}}

    }

    if(party)save();
  }catch(e){console.warn('回合制 BUFF／消耗品遷移失敗',e);}
  if(state)render();
})();
</script>

<script id="healing-potion-system">
/* Update 31: configurable automatic healing potions. Healing potions are buy-only;
   the selected potion is consumed automatically at the start of that hero's own
   basic-action turn when HP is at/below the configured threshold. */
(function installHealingPotionSystem(){
  const HEAL_POTION_TYPE='healPotion';
  const HEAL_POTION_DEFAULTS=[
    {id:'heal_small',type:HEAL_POTION_TYPE,cost:8,sellPrice:2,duration:0,cooldown:2,healFraction:.25,name:'簡易治療藥水',description:'少量恢復生命，價格低廉，適合日常探索。'},
    {id:'heal_standard',type:HEAL_POTION_TYPE,cost:15,sellPrice:4,duration:0,cooldown:3,healFraction:.45,name:'治療藥水',description:'標準遠征治療藥水，在恢復量與成本之間取得平衡。'},
    {id:'heal_greater',type:HEAL_POTION_TYPE,cost:28,sellPrice:7,duration:0,cooldown:4,healFraction:.70,name:'強效治療藥水',description:'一次恢復較多生命，適合高壓戰鬥，但價格與冷卻較高。'},
    {id:'heal_supreme',type:HEAL_POTION_TYPE,cost:50,sellPrice:12,duration:0,cooldown:5,healFraction:1.00,name:'特級治療藥水',description:'可將生命大幅拉回安全線，主要用於危急狀況。'}
  ];
  const clone=v=>JSON.parse(JSON.stringify(v));
  const isHealPotion=item=>item?.type===HEAL_POTION_TYPE;
  const healPotionItems=()=>SHOP.filter(isHealPotion);
  const pct=v=>Math.round(Number(v)*10000)/100;
  const validId=id=>typeof id==='string'&&/^[A-Za-z0-9_-]{1,100}$/.test(id);

  function addDefaultHealPotionsTo(items){
    const out=Array.isArray(items)?items:[];
    if(!out.some(isHealPotion))out.push(...HEAL_POTION_DEFAULTS.map(clone));
    return out;
  }
  addDefaultHealPotionsTo(SHOP);

  if(typeof normalizeDescriptionBalance==='function'){
    const baseNormalize=normalizeDescriptionBalance;
    normalizeDescriptionBalance=function(input){const out=baseNormalize(input);addDefaultHealPotionsTo(out.items);return out;};
  }
  if(typeof validateDescriptionItems==='function'){
    const baseValidate=validateDescriptionItems;
    validateDescriptionItems=function(items){
      if(!Array.isArray(items))throw Error('道具資料無效');
      const fixed=items.filter(x=>!isHealPotion(x));
      baseValidate(fixed);
      const heals=items.filter(isHealPotion),ids=new Set(fixed.map(x=>x.id));
      if(!heals.length)throw Error('至少需要 1 種治療藥水');
      for(const item of heals){
        if(!item||!validId(item.id)||ids.has(item.id)||typeof item.name!=='string'||!item.name.trim()||typeof item.description!=='string')throw Error('治療藥水基本資料無效：'+(item?.id||'未知'));
        ids.add(item.id);
        if(item.element!==undefined&&item.element!==null&&item.element!=='')throw Error('治療藥水不可設定元素：'+item.id);
        if(!Number.isFinite(item.cost)||item.cost<0||!Number.isFinite(item.healFraction)||item.healFraction<=0||item.healFraction>1||!Number.isInteger(item.cooldown)||item.cooldown<0||item.cooldown>99||!Number.isInteger(item.duration??0)||(item.duration??0)!==0)throw Error('治療藥水數值無效：'+item.id);
        if(item.sellPrice!==undefined&&(!Number.isFinite(item.sellPrice)||item.sellPrice<0))throw Error('治療藥水賣價無效：'+item.id);
      }
      return items;
    };
  }
  if(typeof balanceReference==='function'){
    const baseReference=balanceReference;
    balanceReference=function(){const r=baseReference();r.itemTypes={...(r.itemTypes||{}),healPotion:'治療藥水；healFraction=最大生命恢復比例，cooldown=使用後等待的回合數；只能由自動喝藥機制使用。'};return r;};
  }
  if(typeof exportableBalance==='function'){
    const baseExport=exportableBalance;
    exportableBalance=function(){const out=baseExport();out.notes=[...(out.notes||[]),'items 中 type=healPotion 為治療藥水；healFraction 使用 0~1 比例，cooldown 使用回合。治療藥水沒有手動使用按鈕，只會依角色自動喝藥設定觸發。'];return out;};
  }

  function defaultHealPotionId(){return healPotionItems().find(x=>x.id==='heal_standard')?.id||healPotionItems()[0]?.id||'';}
  function healingInventory(){
    if(party?.members?.length){const owner=party.members[0];if(!owner.healingPotions||Array.isArray(owner.healingPotions)||typeof owner.healingPotions!=='object')owner.healingPotions={};return owner.healingPotions;}
    if(state){if(!state.healingPotions||Array.isArray(state.healingPotions)||typeof state.healingPotions!=='object')state.healingPotions={};return state.healingPotions;}
    return {};
  }
  function normalizeHeroHealingSettings(h){
    if(!h)return;
    if(typeof h.autoPotion!=='boolean')h.autoPotion=true;
    if(!Number.isFinite(h.autoPotionThresholdPct))h.autoPotionThresholdPct=Math.round((typeof GS==='function'?GS('combat.autoPotionThreshold',.35):.35)*100);
    h.autoPotionThresholdPct=Math.max(1,Math.min(99,Math.round(h.autoPotionThresholdPct)));
    if(typeof h.autoPotionId!=='string'||!healPotionItems().some(x=>x.id===h.autoPotionId))h.autoPotionId=defaultHealPotionId();
    if(!Number.isInteger(h.healPotionCooldownRemaining)||h.healPotionCooldownRemaining<0)h.healPotionCooldownRemaining=0;
  }
  const baseEnsureSharedItems=typeof ensureSharedItems==='function'?ensureSharedItems:null;
  function ensureHealingPotionState(){
    if(!party?.members?.length){if(state)normalizeHeroHealingSettings(state);return;}
    const owner=party.members[0],inv=healingInventory();
    for(let i=1;i<party.members.length;i++){
      const src=party.members[i].healingPotions;
      if(src&&typeof src==='object'&&!Array.isArray(src)){for(const [id,n] of Object.entries(src))if(Number.isInteger(n)&&n>0)inv[id]=(inv[id]||0)+n;delete party.members[i].healingPotions;}
    }
    if(party.sharedItems&&Number.isInteger(party.sharedItems.potions)&&party.sharedItems.potions>0){inv[defaultHealPotionId()]=(inv[defaultHealPotionId()]||0)+party.sharedItems.potions;party.sharedItems.potions=0;}
    for(const [id,n] of Object.entries(inv))if(!validId(id)||!Number.isInteger(n)||n<0||!healPotionItems().some(x=>x.id===id))delete inv[id];
    for(const h of party.members)normalizeHeroHealingSettings(h);
    owner.healingPotions=inv;
  }
  if(baseEnsureSharedItems){ensureSharedItems=function(){const out=baseEnsureSharedItems();ensureHealingPotionState();return out;};}

  function selectedHealPotion(h){normalizeHeroHealingSettings(h);return healPotionItems().find(x=>x.id===h.autoPotionId)||healPotionItems()[0]||null;}
  function healPotionCount(id){return Math.max(0,Math.floor(Number(healingInventory()[id])||0));}
  function setHealPotionCount(id,n){healingInventory()[id]=Math.max(0,Math.floor(Number(n)||0));}
  function useAutoHealingPotion(h){
    normalizeHeroHealingSettings(h);
    if(h.healPotionCooldownRemaining>0){h.healPotionCooldownRemaining--;return false;}
    if(!h.autoPotion||h.hp<=0)return false;
    const item=selectedHealPotion(h);if(!item||healPotionCount(item.id)<1)return false;
    const v=battleStats(h),threshold=Math.max(1,Math.min(99,h.autoPotionThresholdPct))/100;
    if(h.hp/v.hp>threshold||h.hp>=v.hp)return false;
    setHealPotionCount(item.id,healPotionCount(item.id)-1);
    const before=h.hp,amount=Math.max(1,Math.round(v.hp*item.healFraction));h.hp=Math.min(v.hp,h.hp+amount);
    const actual=Math.max(0,Math.round(h.hp-before));if(actual>0)recordCombatContribution(h,'healing',actual);h.healPotionCooldownRemaining=Math.max(0,Math.round(item.cooldown));
    note(`${characterName(h)}自動使用${item.name} · 恢復 ${actual} 生命（最大生命 ${pct(item.healFraction)}%）· 冷卻 ${item.cooldown} 回合`);
    return true;
  }
  globalThis.useAutoHealingPotion=useAutoHealingPotion;
  globalThis.setHeroAutoPotion=function(job,on){const h=party?.members.find(x=>x.job===job);if(!h)return;h.autoPotion=!!on;save();render();refreshHealingSettingsModal();};
  globalThis.setHeroAutoPotionThreshold=function(job,value){const h=party?.members.find(x=>x.job===job);if(!h)return;const n=Number(value);h.autoPotionThresholdPct=Number.isFinite(n)?Math.max(1,Math.min(99,Math.round(n))):35;save();render();refreshHealingSettingsModal();};
  globalThis.setHeroAutoPotionItem=function(job,id){const h=party?.members.find(x=>x.job===job);if(!h||!healPotionItems().some(x=>x.id===id))return;h.autoPotionId=id;save();render();refreshHealingSettingsModal();};
  globalThis.buyHealingPotion=function(id){const item=healPotionItems().find(x=>x.id===id);if(!item)return;if(state.gold<item.cost)return toast('金幣不足');state.gold-=item.cost;setHealPotionCount(id,healPotionCount(id)+1);save();render();};

  if(typeof tickHeroCooldowns==='function'){
    const baseTickHeroCooldowns=tickHeroCooldowns;
    tickHeroCooldowns=function(h){useAutoHealingPotion(h);return baseTickHeroCooldowns(h);};
  }
  if(typeof resetEncounter==='function'){
    const baseReset=resetEncounter;
    resetEncounter=function(){const out=baseReset();if(party)for(const h of party.members){normalizeHeroHealingSettings(h);h.healPotionCooldownRemaining=0;}return out;};
  }
  if(typeof spawnGroup==='function'){
    const baseSpawn=spawnGroup;
    spawnGroup=function(){const out=baseSpawn();if(party)for(const h of heroes()){normalizeHeroHealingSettings(h);h.healPotionCooldownRemaining=0;}return out;};
  }

  if(typeof supplyDetail==='function'){
    const baseSupplyDetail=supplyDetail;
    supplyDetail=function(item){if(isHealPotion(item))return `恢復最大生命 ${pct(item.healFraction)}% · 自動使用冷卻 ${Math.round(item.cooldown)} 回合 · 單價 ${Math.round(item.cost)} 金幣`;return baseSupplyDetail(item);};
  }
  if(typeof useSupply==='function'){
    const baseUseSupply=useSupply;
    useSupply=function(id){const item=SHOP.find(x=>x.id===id);if(isHealPotion(item))return toast('治療藥水僅由自動喝藥設定使用');return baseUseSupply(id);};
  }

  function healingSettingsRows(){
    const items=healPotionItems();
    return party.members.map(h=>{
      normalizeHeroHealingSettings(h);
      const item=selectedHealPotion(h);
      return `<div class="heal-auto-row"><b>${esc(characterName(h))}</b><label><input type="checkbox" ${h.autoPotion?'checked':''} onchange="setHeroAutoPotion(${h.job},this.checked)">自動喝藥</label><label>HP ≤ <input type="number" min="1" max="99" step="1" value="${h.autoPotionThresholdPct}" onchange="setHeroAutoPotionThreshold(${h.job},this.value)">%</label><label>使用 <select onchange="setHeroAutoPotionItem(${h.job},this.value)">${items.map(x=>`<option value="${esc(x.id)}" ${x.id===h.autoPotionId?'selected':''}>${esc(x.name)} ×${healPotionCount(x.id)}</option>`).join('')}</select></label><span class="heal-auto-detail">${item?`${esc(item.name)}：恢復最大生命 ${pct(item.healFraction)}% · 冷卻 ${item.cooldown} 回合 · <span class="heal-stock">共用庫存 ${healPotionCount(item.id)}</span>`:'沒有可用治療藥水'}${h.healPotionCooldownRemaining>0?`<br><span class="heal-auto-cd">目前冷卻剩餘 ${h.healPotionCooldownRemaining} 回合</span>`:''}</span></div>`;
    }).join('');
  }

  globalThis.openHealingSettings=function(refresh=false){
    if(!party)return;
    ensureHealingPotionState();
    const modal=$('modal');
    modal.dataset.view='healing-settings';
    modal.innerHTML=`<h2>自動喝水設定</h2><p class="small">設定各角色的 HP 門檻與使用藥水。介面中的「回合」定義可由探索控制右上角的「？」查看。</p><div class="heal-settings-modal">${healingSettingsRows()}</div><div class="actions"><button class="primary" onclick="closeModal()">完成</button></div>`;
    if(!modal.open)modal.showModal();
  };

  function refreshHealingSettingsModal(){
    const modal=$('modal');
    if(modal?.open&&modal.dataset.view==='healing-settings')openHealingSettings(true);
  }

  function healingControlPanel(){
    if(!party)return '';
    ensureHealingPotionState();
    let enabled=0;
    const chips=party.members.map(h=>{
      normalizeHeroHealingSettings(h);
      const item=selectedHealPotion(h);
      if(h.autoPotion)enabled++;
      const text=h.autoPotion?`${esc(characterName(h))} ≤${h.autoPotionThresholdPct}% · ${item?esc(item.name):'無藥水'}`:`${esc(characterName(h))} 關閉`;
      return `<span class="heal-auto-chip ${h.autoPotion?'':'off'}" title="${text}">${text}</span>`;
    }).join('');
    return `<section class="panel heal-auto-panel" aria-label="自動喝水設定摘要"><div class="heal-auto-title"><h2>自動喝水</h2><span class="heal-auto-state">${enabled}/${party.members.length} 啟用</span><div class="heal-auto-summary">${chips}</div><button class="heal-auto-settings-button" onclick="openHealingSettings()">設定</button></div></section>`;
  }

  if(typeof battleView==='function'){
    const baseBattleView=battleView;
    battleView=function(){
      let html=baseBattleView();
      html=html.replace(/<details><summary>隊伍補給<\/summary>[\s\S]*?<\/details>/g,'');
      html=html.replace(/<label class="auto-potion">[\s\S]*?<\/label>/g,'');
      html=html.replace(/<button[^>]*onclick="[^"]*(?:buyPotion|\bpotion\()[^"]*"[^>]*>[\s\S]*?<\/button>/g,'');
      const panel=healingControlPanel(),marker='<div class="text-battle-layout">';
      return html.includes(marker)?html.replace(marker,panel+marker):panel+html;
    };
  }
  if(typeof shopView==='function'){
    shopView=function(){
      ensureHealingPotionState();if(typeof ensureMarket==='function')ensureMarket();const h=pageHero('shop'),inv=healingInventory();
      const healCards=healPotionItems().map(item=>`<article class="card heal-shop-card"><h3>${esc(item.name)}</h3><p class="item-flavor"><b>說明：</b>${esc(item.description||item.desc||'')}</p><p class="heal-spec"><b>詳細：</b>恢復最大生命 ${pct(item.healFraction)}% · 冷卻 ${item.cooldown} 回合</p><div class="row"><span>共用 ${healPotionCount(item.id)} 瓶</span><span>${item.cost} 金幣／瓶</span></div><div class="actions">${ownerControls(`<button onclick="buyHealingPotion('${item.id}')" ${h.gold<item.cost?'disabled':''}>購買 1 瓶</button>`,h.job)}</div><p class="heal-no-manual">治療藥水沒有手動使用按鈕；由戰鬥頁的角色自動治療設定觸發。</p></article>`).join('');
      const supplyCards=SHOP.filter(x=>!isHealPotion(x)).map(item=>`<article class="card"><h3>${esc(item.name)}</h3><p class="item-flavor"><b>說明：</b>${esc(item.description||item.desc||'')}</p><p class="item-detail small"><b>詳細：</b>${esc(supplyDetail(item))}</p><div class="row"><span>共用 ${h.consumables[item.id]||0} 瓶</span><span>${item.cost} 金幣</span></div><div class="actions">${ownerControls(`<button onclick="buySupply('${item.id}')" ${h.gold<item.cost?'disabled':''}>購買</button><button onclick="useSupply('${item.id}')" ${!h.consumables[item.id]?'disabled':''}>對${esc(characterName(h))}使用</button>`,h.job)}</div></article>`).join('');
      const market=typeof marketCards==='function'?marketCards():'';
      const marketHead=party?.market?`<div class="actions market-refresh"><span>素材商品 · 第 ${party.market.serial} 批</span><button onclick="refreshMarket()">刷新商店 · ${MARKET_REFRESH_COST} 金幣</button></div>`:'';
      return `<div class="actions"><button onclick="showTestCodes()">兌換碼</button></div>`+heading('SUPPLIES / 全隊共用','商店')+pageSelector('shop')+`<section class="panel shared-shop-info"><b>道具設定角色：${esc(characterName(h))} · ${h.gold} 金幣</b>${uiHelp('補給說明','治療藥水購買後進入全隊共用庫存，只能在角色回合開始時依自動治療設定使用；沒有手動喝藥。元素附魔、抗性與增幅藥水仍可手動使用，效果以角色出戰回合計時。')}<p class="supply-countdown" data-job="${h.job}">${supplyStatus(h)||'目前無持續型消耗品效果'}</p></section>${marketHead}<div class="shared-shop-grid">${healCards}${market}${supplyCards}</div>`;
    };
  }

  if(typeof guideView==='function'){
    const baseGuide=guideView;
    guideView=function(){return `<section class="panel"><h2>自動治療藥水</h2><p>每名角色可設定自動喝藥開關、HP 百分比門檻與指定治療藥水。判定只發生在該角色回合開始時；使用治療藥水不會取消該回合原本的攻擊。治療藥水使用後依品項進入回合冷卻，冷卻期間不會再喝。治療藥水不提供手動使用按鈕。</p></section>`+baseGuide();};
  }

  if(typeof save==='function'){
    const baseSave=save;
    save=function(show=false){ensureHealingPotionState();return baseSave(show);};
  }

  // Recover a balance file containing healing potions even if an earlier boot pass
  // rejected its extended item list before this module was installed.
  try{
    ensureHealingPotionState();
    const raw=localStorage.getItem(BALANCE_KEY);
    if(raw){const cfg=JSON.parse(raw);applyBalanceConfig(cfg,{persist:false});}
    ensureHealingPotionState();
    if(state)save();
  }catch(e){console.warn('治療藥水設定載入失敗，使用內建預設值',e);addDefaultHealPotionsTo(SHOP);ensureHealingPotionState();}
  // Expose the healing inventory helpers for later shop / inventory UI modules.
  globalThis.ensureHealingPotionState=ensureHealingPotionState;
  globalThis.healPotionItems=healPotionItems;
  globalThis.isHealPotion=isHealPotion;
  globalThis.healPotionCount=healPotionCount;
  globalThis.setHealPotionCount=setHealPotionCount;
  globalThis.healingInventory=healingInventory;
  if(state)render();
})();
</script>


<link id="shop-inventory-overhaul-style" rel="stylesheet" href="css/shop-inventory.css">
<script id="shop-inventory-overhaul-system">
/* Update 32: shop catalog configuration, escalating daily refresh cost, and inventory-only manual item use. */
(function installShopInventoryOverhaul(){
  const clone=v=>JSON.parse(JSON.stringify(v));
  const pctText=v=>Math.round((Number(v)||0)*10000)/100;
  const DEFAULT_SHOP_SETTINGS={
    randomOffers:{
      offerCount:6,
      refreshBaseCost:100,
      refreshCostStep:50,
      entries:[
        {id:'ore',enabled:true,type:'ore',key:'',name:'鍛鐵',description:'裝備強化常用素材。',quantityMin:8,quantityMax:20,unitPrice:12,weight:1,quantityScalesWithTier:true,priceScalesWithTier:false},
        {id:'dust',enabled:true,type:'dust',key:'',name:'粉塵',description:'裝備洗鍊與寶石相關用途的基礎素材。',quantityMin:3,quantityMax:8,unitPrice:25,weight:1,quantityScalesWithTier:false,priceScalesWithTier:false},
        {id:'gem',enabled:true,type:'gem',key:'random',name:'隨機技能寶石',description:'隨機出現一種技能寶石。',quantityMin:1,quantityMax:2,unitPrice:180,weight:.7,quantityScalesWithTier:false,priceScalesWithTier:false},
        {id:'region_material',enabled:true,type:'material',key:'region',name:'地區素材',description:'從目前探索區域的怪物素材中隨機挑選。',quantityMin:3,quantityMax:6,unitPrice:60,weight:1.3,quantityScalesWithTier:false,priceScalesWithTier:true}
      ]
    }
  };
  const SHOP_RULE_TYPES=new Set(['ore','dust','gem','material']);
  function normalizeRule(src,i){
    const type=SHOP_RULE_TYPES.has(src?.type)?src.type:'material';
    return {
      id:typeof src?.id==='string'&&src.id.trim()?src.id.trim():'rule_'+i,
      enabled:src?.enabled!==false,
      type,
      key:typeof src?.key==='string'?src.key:(type==='gem'?'random':type==='material'?'region':''),
      name:typeof src?.name==='string'?src.name:'',
      description:typeof src?.description==='string'?src.description:'',
      quantityMin:Number.isFinite(src?.quantityMin)?Math.max(1,Math.floor(src.quantityMin)):1,
      quantityMax:Number.isFinite(src?.quantityMax)?Math.max(1,Math.floor(src.quantityMax)):1,
      unitPrice:Number.isFinite(src?.unitPrice)?Math.max(0,Math.round(src.unitPrice)):1,
      weight:Number.isFinite(src?.weight)&&src.weight>0?src.weight:1,
      quantityScalesWithTier:!!src?.quantityScalesWithTier,
      priceScalesWithTier:!!src?.priceScalesWithTier
    };
  }
  function normalizeShopSettings(src){
    const raw=src?.randomOffers||{},fallback=DEFAULT_SHOP_SETTINGS.randomOffers;
    const entries=Array.isArray(raw.entries)&&raw.entries.length?raw.entries.map(normalizeRule):fallback.entries.map((x,i)=>normalizeRule(x,i));
    for(const r of entries)if(r.quantityMax<r.quantityMin)r.quantityMax=r.quantityMin;
    return {randomOffers:{
      offerCount:Number.isFinite(raw.offerCount)?Math.max(1,Math.min(24,Math.floor(raw.offerCount))):fallback.offerCount,
      refreshBaseCost:Number.isFinite(raw.refreshBaseCost)?Math.max(0,Math.round(raw.refreshBaseCost)):fallback.refreshBaseCost,
      refreshCostStep:Number.isFinite(raw.refreshCostStep)?Math.max(0,Math.round(raw.refreshCostStep)):fallback.refreshCostStep,
      entries
    }};
  }
  function validateShopSettings(x){
    const s=normalizeShopSettings(x),ids=new Set();
    for(const r of s.randomOffers.entries){
      if(!/^[A-Za-z0-9_-]{1,100}$/.test(r.id)||ids.has(r.id))throw Error('商店隨機商品規則 ID 無效或重複：'+r.id);ids.add(r.id);
      if(!SHOP_RULE_TYPES.has(r.type)||r.quantityMin<1||r.quantityMax<r.quantityMin||r.unitPrice<0||r.weight<=0)throw Error('商店隨機商品規則數值無效：'+r.id);
      if(r.type==='gem'&&!['random','0','1','2'].includes(String(r.key)))throw Error('隨機技能寶石 key 僅可為 random / 0 / 1 / 2：'+r.id);
      if(r.type==='material'&&typeof r.key!=='string')throw Error('隨機素材 key 無效：'+r.id);
    }
    return s;
  }
  let SHOP_SETTINGS=normalizeShopSettings();

  function syncItemShopFlags(items){

  }

    const baseValidate=validateBalanceConfig;

      const out=baseApply(copy,{persist:false});SHOP_SETTINGS=clone(copy.shopSettings);globalThis.__EMBERWILD_SHOP_SETTINGS=SHOP_SETTINGS;syncItemShopFlags(copy.items);

    };
  }
  if(typeof exportableBalance==='function'){
    const baseExport=exportableBalance;
    exportableBalance=function(){const out=baseExport();out.shopSettings=clone(SHOP_SETTINGS);if(Array.isArray(out.items)){const byId=new Map(SHOP.map(x=>[x.id,x]));for(const item of out.items)item.shopEnabled=byId.get(item.id)?.shopEnabled!==false;}out.notes=[...(out.notes||[]),'shopSettings.randomOffers 控制商店頂端隨機商品、刷新起始價格與每次刷新加價。刷新次數依玩家本機日期於每日 0 點重置。','items[].shopEnabled 控制固定消耗品是否在商店上架；description 為商店與背包顯示說明。'];return out;};
  }
  try{const raw=localStorage.getItem(BALANCE_KEY);if(raw){const parsed=JSON.parse(raw);SHOP_SETTINGS=normalizeShopSettings(parsed.shopSettings);globalThis.__EMBERWILD_SHOP_SETTINGS=SHOP_SETTINGS;syncItemShopFlags(parsed.items);}}catch(e){console.warn('商店設定載入失敗，使用內建預設值',e);}

  function localDayKey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
  function syncMarketDay(){if(!party?.market)return false;const today=localDayKey();if(party.market.dayKey!==today){party.market.dayKey=today;party.market.refreshCount=0;return true;}if(!Number.isInteger(party.market.refreshCount)||party.market.refreshCount<0)party.market.refreshCount=0;return false;}
  function currentRefreshCost(){syncMarketDay();const s=SHOP_SETTINGS.randomOffers;return Math.max(0,Math.round(s.refreshBaseCost+s.refreshCostStep*(party?.market?.refreshCount||0)));}
  globalThis.currentRefreshCost=currentRefreshCost;
  function regionMaterialPool(){
    const mi=party?.map??0,cat=GAMEPLAY_SETTINGS?.monsters?.catalog||[];let pool=cat.filter(x=>x?.mapIndex===mi&&x?.enabled!==false&&typeof x?.material==='string'&&x.material.trim()).map(x=>x.material.trim());
    if(!pool.length)pool=(MAPS?.[mi]?.mobs||[]).map(x=>x?.[2]).filter(Boolean);return [...new Set(pool.length?pool:['鍛鐵'])];
  }
  function weightedRule(){const rows=SHOP_SETTINGS.randomOffers.entries.filter(x=>x.enabled!==false&&x.weight>0);if(!rows.length)return null;const total=rows.reduce((n,x)=>n+x.weight,0);let roll=Math.random()*total;for(const r of rows){roll-=r.weight;if(roll<=0)return r;}return rows[rows.length-1];}
  function offerFromRule(rule,serial,i,tier){
    let key=rule.key||'';if(rule.type==='gem'&&key==='random')key=String(rand(3));if(rule.type==='material'&&(!key||key==='region')){const pool=regionMaterialPool();key=pool[rand(pool.length)];}
    let min=rule.quantityMin,max=rule.quantityMax;if(rule.quantityScalesWithTier){min*=tier;max*=tier;}const qty=Math.max(1,Math.floor(min+Math.random()*(max-min+1)));const unit=rule.unitPrice*(rule.priceScalesWithTier?tier:1);return {id:serial+'-'+i,kind:rule.type,key:String(key),qty,price:Math.max(1,Math.round(qty*unit)),sold:false,ruleId:rule.id};
  }
  generateMarket=function(){
    const oldSerial=Number.isSafeInteger(party?.market?.serial)?party.market.serial:0,serial=oldSerial+1,tier=regionTier((typeof worldIsFinalMap==='function'&&worldIsFinalMap(party.map))?Math.max(0,party.map-1):party.map),count=SHOP_SETTINGS.randomOffers.offerCount,offers=[];
    for(let i=0;i<count;i++){const rule=weightedRule();if(!rule)break;offers.push(offerFromRule(rule,serial,i,Math.max(1,tier)));}
    return {serial,offers,dayKey:localDayKey(),refreshCount:party?.market?.refreshCount||0};
  };
  ensureMarket=function(){if(!party.market){party.market=generateMarket();save();return;}if(syncMarketDay())save();};
  refreshMarket=function(){
    ensureMarket();syncMarketDay();const cost=currentRefreshCost();if(state.gold<cost)return toast('刷新需要 '+cost+' 金幣');const old=clone(party.market),gold=state.gold,count=party.market.refreshCount||0;state.gold-=cost;const next=generateMarket();next.refreshCount=count+1;next.dayKey=localDayKey();party.market=next;if(!save()){party.market=old;state.gold=gold;return;}render();toast(`素材商品已刷新；下次刷新 ${currentRefreshCost()} 金幣`);
  };
  function marketRule(o){return SHOP_SETTINGS.randomOffers.entries.find(x=>x.id===o?.ruleId)||SHOP_SETTINGS.randomOffers.entries.find(x=>x.type===o?.kind&&(o.kind!=='material'||x.key==='region'||x.key===o.key))||null;}
  const rawOfferName=o=>o.kind==='ore'?'鍛鐵':o.kind==='dust'?'粉塵':o.kind==='gem'?(GEMS[Number(o.key)]?.name||'技能寶石'):o.key;
  marketOfferName=function(o){const raw=rawOfferName(o),r=marketRule(o);if(!r?.name)return raw;if((o.kind==='material'&&r.key==='region')||(o.kind==='gem'&&r.key==='random'))return `${r.name} · ${raw}`;return r.name;};
  function marketOfferDescription(o){return marketRule(o)?.description||'本批隨機商品。';}
  marketCards=function(){if(!party.market?.offers?.length)return `<div class="shop-empty">目前沒有啟用的隨機商品規則。</div>`;return party.market.offers.map(o=>`<article class="card shop-product-card random-shop-card"><h3 title="${esc(marketOfferName(o))}">${esc(marketOfferName(o))} ×${o.qty}</h3><p class="shop-card-description" title="${esc(marketOfferDescription(o))}">${esc(marketOfferDescription(o))}</p><div class="shop-card-spacer"></div><div class="row"><span>數量 ${o.qty}</span><span>${o.price} 金幣</span></div><div class="actions"><button onclick="buyMarketOffer('${o.id}')" ${o.sold||state.gold<o.price?'disabled':''}>${o.sold?'已售完':'購買'}</button></div></article>`).join('');};
  const validatePartyBase=typeof validateParty==='function'?validateParty:null;
  if(validatePartyBase)validateParty=function(input){const p=validatePartyBase(input);if(p.market){const raw=input?.market||{};p.market.dayKey=typeof raw.dayKey==='string'?raw.dayKey:localDayKey();p.market.refreshCount=Number.isInteger(raw.refreshCount)&&raw.refreshCount>=0?raw.refreshCount:0;for(const [i,o] of p.market.offers.entries())if(typeof raw.offers?.[i]?.ruleId==='string')o.ruleId=raw.offers[i].ruleId;}return p;};

  function itemVisibleInShop(item){return item?.shopEnabled!==false;}
  function fixedShopCard(item){
    const heal=typeof isHealPotion==='function'&&isHealPotion(item),count=heal?healPotionCount(item.id):(state.consumables[item.id]||0),detail=heal?`恢復最大生命 ${pctText(item.healFraction)}% · 冷卻 ${item.cooldown} 回合`:supplyDetail(item),buy=heal?`buyHealingPotion('${item.id}')`:`buySupply('${item.id}')`;
    return `<article class="card shop-product-card fixed-shop-card"><h3 title="${esc(item.name)}">${esc(item.name)}</h3><p class="shop-card-description" title="${esc(item.description||item.desc||'')}">${esc(item.description||item.desc||'')}</p><p class="shop-card-detail" title="${esc(detail)}">${esc(detail)}</p><div class="shop-card-spacer"></div><div class="row"><span>共用 ${count} ${heal?'瓶':'個'}</span><span>${item.cost} 金幣</span></div><div class="actions"><button onclick="${buy}" ${state.gold<item.cost?'disabled':''}>購買</button></div></article>`;
  }
  shopView=function(){
    ensureHealingPotionState();ensureMarket();syncMarketDay();const fixed=SHOP.filter(itemVisibleInShop).map(fixedShopCard).join(''),cost=currentRefreshCost(),rc=party.market?.refreshCount||0;
    return `<div class="actions"><button onclick="showTestCodes()">兌換碼</button></div>`+heading('SUPPLIES / 全隊共用','商店')+
      `<div class="shop-catalog-scroll"><section class="shop-section shop-random-section"><div class="shop-section-head"><h2>隨機商品</h2><div class="shop-refresh-meta"><span>第 ${party.market.serial} 批</span><span>今日已刷新 <b>${rc}</b> 次</span><span>每日 0 點重置刷新價格</span></div><div class="actions"><button onclick="refreshMarket()" ${state.gold<cost?'disabled':''}>刷新 · ${cost} 金幣</button></div></div><div class="shop-product-grid">${marketCards()}</div></section>`+
      `<section class="shop-section shop-fixed-section"><div class="shop-section-head"><h2>固定商品</h2><span class="small">購買後進入帳號共用背包；手動使用請到「背包 → 道具」。</span></div><div class="shop-product-grid">${fixed||'<div class="shop-empty">目前沒有上架固定商品。</div>'}</div></section></div>`;
  };

  function inventoryItemCount(item){return (typeof isHealPotion==='function'&&isHealPotion(item))?healPotionCount(item.id):(state.consumables[item.id]||0);}
  function setInventoryItemCount(item,n){n=Math.max(0,Math.floor(Number(n)||0));if(typeof isHealPotion==='function'&&isHealPotion(item))setHealPotionCount(item.id,n);else state.consumables[item.id]=n;}
  globalThis.useInventoryItem=function(id,job){const item=SHOP.find(x=>x.id===id),h=party?.members.find(x=>x.job===job);if(!item||!h)return;if(typeof isHealPotion==='function'&&isHealPotion(item)){openHealingSettings();return;}if(inventoryItemCount(item)<1)return toast('道具數量不足');pageHeroSelection.set('equipment',job);withHero(h,()=>useSupply(id));render();};
  globalThis.sellInventoryItem=function(id,qty){const item=SHOP.find(x=>x.id===id);if(!item)return;const have=inventoryItemCount(item),n=Math.max(0,Math.min(have,Math.floor(Number(qty)||0)));if(n<1)return toast('請輸入要販售的數量');const price=itemSellPrice(id),gold=state.gold;setInventoryItemCount(item,have-n);state.gold+=price*n;if(!save()){setInventoryItemCount(item,have);state.gold=gold;return;}render();toast(`已販售 ${item.name} ×${n}，獲得 ${price*n} 金幣`);};
  globalThis.sellInventoryItemFromButton=function(btn,id,all=false){const item=SHOP.find(x=>x.id===id);if(!item)return;const row=btn.closest('[data-inventory-item]'),input=row?.querySelector('input[data-sell-qty]'),qty=all?inventoryItemCount(item):input?.value;sellInventoryItem(id,qty);};
  accountItemsView=function(){
    ensureHealingPotionState();const target=pageHero('equipment')||party.members[0],rows=SHOP;
    return heading('ITEMS / 帳號共用','道具庫存')+`<section class="panel"><div class="inventory-item-controls"><label>使用角色 <select onchange="selectPageHero('equipment',Number(this.value))">${party.members.map(h=>`<option value="${h.job}" ${h===target?'selected':''}>${esc(characterName(h))} LV${h.lv}</option>`).join('')}</select></label><span class="small">治療藥水仍只由自動喝水使用；其他消耗道具的手動使用統一在此操作。</span></div><div class="inventory-supply-status">${esc(characterName(target))}目前效果：${esc(supplyStatus(target)||'無')}</div><div class="account-item-list">${rows.map(item=>{const n=inventoryItemCount(item),heal=typeof isHealPotion==='function'&&isHealPotion(item),detail=heal?`恢復最大生命 ${pctText(item.healFraction)}% · 冷卻 ${item.cooldown} 回合`:supplyDetail(item);return `<div class="account-item-row" data-inventory-item="${esc(item.id)}"><div class="account-item-main"><b>${esc(item.name)}</b><span class="small">${heal?'自動治療藥水':'可手動使用消耗品'}</span></div><div class="account-item-desc">${esc(item.description||item.desc||'')}<span class="detail">${esc(detail)}</span></div><div class="account-item-count">× ${n.toLocaleString()}<br><span class="small">賣 ${itemSellPrice(item.id)}</span></div><div class="account-item-actions">${heal?`<button onclick="openHealingSettings()">自動設定</button>`:`<button onclick="useInventoryItem('${item.id}',${target.job})" ${n<1?'disabled':''}>對${esc(characterName(target))}使用</button>`}<input data-sell-qty type="number" min="1" max="${n}" value="1" ${n<1?'disabled':''}><button onclick="sellInventoryItemFromButton(this,'${item.id}',false)" ${n<1?'disabled':''}>賣出</button><button onclick="sellInventoryItemFromButton(this,'${item.id}',true)" ${n<1?'disabled':''}>全部</button></div></div>`;}).join('')}</div></section>`;
  };
  globalThis.accountItemsView=accountItemsView;
  const shopInventoryEquipmentBase=equipmentView;
  equipmentView=function(){if(inventoryCategory==='items')return inventoryTabs()+accountItemsView();return shopInventoryEquipmentBase();};
  if(state)render();

<script id="pending-gear-bottom-compact-system">
/* Move pending equipment settlement below the equipment inventory. Collapsed
   mode intentionally keeps only one quality-count summary line visible. */

function pendingGearQualityCounts(){
  const names=(typeof AFFIX_RANK!=='undefined'&&Array.isArray(AFFIX_RANK))?AFFIX_RANK:['普通','精良','稀有','傳說'];
