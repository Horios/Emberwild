<script id="pending-gear-loot-system">
/* Battle equipment drops stay outside the inventory until the player settles them. */
let pendingGearLoot=[];
let collectingBattleGear=false;

const pendingLootBaseAddGear=addGear;
addGear=function(g){
  if(!collectingBattleGear)return pendingLootBaseAddGear(g);
  g.rar=0;
  pendingGearLoot.push(g);
  const q=typeof gearQualityRank==='function'?gearQualityRank(g):0;
  note(`獲得 ${AFFIX_RANK[q]} ${equipmentDisplayName(g)}${g.boss!==undefined?'（BOSS 專屬）':''}（待結算）`);
  if(typeof addExpeditionLoot==='function')addExpeditionLoot(equipmentDisplayName(g),1,q);
};

const pendingLootBaseRewardGroupKill=rewardGroupKill;
rewardGroupKill=function(e){
  if(e?.rewarded)return;
  collectingBattleGear=true;
  try{return pendingLootBaseRewardGroupKill(e);}
  finally{collectingBattleGear=false;}
};

function pendingGearLootView(){
  const n=pendingGearLoot.length;
  return `<section class="panel pending-gear-loot"><div class="pending-gear-head"><div><b>待結算裝備 ${n} 件</b><span class="small">　戰鬥掉落先存放於此，不會改變背包中的裝備順序。</span></div><button class="primary" onclick="claimPendingGearLoot()" ${n?'':'disabled'}>結算並領取</button></div>${n?`<div class="pending-gear-list">${pendingGearLoot.map(g=>`<span class="pending-gear-chip">${equipmentNameHTML(g)}${g.boss!==undefined?' · BOSS':''}</span>`).join('')}</div>`:'<p class="small">目前沒有待結算裝備。</p>'}</section>`;
}

function claimPendingGearLoot(){
  ensureSharedGear();
  if(!pendingGearLoot.length)return toast('目前沒有待結算裝備');
  const free=Math.max(0,RULES.bagCapacity-state.bag.length);
  if(free<=0)return toast('背包已滿，請先整理裝備');
  const claimed=pendingGearLoot.splice(0,free);
  state.bag.push(...claimed);
  save();render();
  toast(pendingGearLoot.length?`已領取 ${claimed.length} 件；背包已滿，尚有 ${pendingGearLoot.length} 件待結算`:`已領取 ${claimed.length} 件裝備`);
}

const pendingLootBaseEquipmentView=equipmentView;
equipmentView=function(){return pendingGearLootView()+pendingLootBaseEquipmentView();};

const pendingLootBasePackParty=packParty;
packParty=function(){const data=pendingLootBasePackParty();return {...data,pendingGearLoot:pendingGearLoot.map(g=>JSON.parse(JSON.stringify(g)))};};

const pendingLootBaseLoadParty=loadParty;
loadParty=function(data){
  const queued=Array.isArray(data?.pendingGearLoot)?data.pendingGearLoot.map(g=>JSON.parse(JSON.stringify(g))):[];
  pendingLootBaseLoadParty(data);
  pendingGearLoot=queued;
};
</script>

<script id="equipment-stat-source-cleanup">
/* Final equipment source cleanup:
   - Base stats never change because of an equipment name/form.
   - Fixed form effects are explicit exclusive stats and are shown as immutable.
   - Boss equipment never inherits a hidden normal-form effect.
   - Equipment max-MP / MP-regen effects and affixes are removed; legacy ones migrate to small attack bonuses.
*/
const EQUIPMENT_FIXED_EFFECT_KEYS=new Set(['flatAttack','flatHp','flatDefense','gearAtkPct','gearHpPct','gearDefPct','attackPct','crit','critDamage','pierce','defenseIgnore','lifesteal','evasion','elementBonus','bossDamagePct','speed','allCooldownReduction','dropRateBonus','basicAdvanceNextRound','basicElement','elementDamagePct','elementResistPct','raceDamagePct','skillEffectPct','skillCooldownReduction']);
const EQUIPMENT_EFFECT_ELEMENTS=new Set(['physical','fire','ice','wind','light','shadow']);
const EQUIPMENT_EFFECT_RACES=new Set(['beast','plant','undead','construct','demon','spirit']);
function normalizeFixedEquipmentEffect(raw){
 if(!raw||typeof raw!=='object'||Array.isArray(raw)||!EQUIPMENT_FIXED_EFFECT_KEYS.has(raw.key))return null;
 const out={key:raw.key};
 if(raw.key==='basicElement')out.value=EQUIPMENT_EFFECT_ELEMENTS.has(raw.value)?raw.value:'physical';else out.value=Number.isFinite(Number(raw.value))?Number(raw.value):0;
 if(['elementDamagePct','elementResistPct'].includes(raw.key))out.element=EQUIPMENT_EFFECT_ELEMENTS.has(raw.element)&&raw.element!=='physical'?raw.element:'fire';
 if(raw.key==='raceDamagePct')out.race=EQUIPMENT_EFFECT_RACES.has(raw.race)?raw.race:'beast';
 if(['skillEffectPct','skillCooldownReduction'].includes(raw.key))out.skill=Math.max(0,Number.isInteger(Number(raw.skill))?Number(raw.skill):0);
 return out;
}
function normalizeEquipmentFormObject(source){
 if(!source||typeof source!=='object'||Array.isArray(source))return source;
 const form=source,legacy=[];
 if(!Array.isArray(form.fixedEffects)||!form.fixedEffects.length){
  const ex=(form.exclusive&&typeof form.exclusive==='object'&&!Array.isArray(form.exclusive))?{...form.exclusive}:{},pct=value=>Number(((Number(value)-1)*100).toFixed(2));
  if(Number.isFinite(form.atk)&&form.atk!==1)ex.gearAtkPct=(ex.gearAtkPct||0)+pct(form.atk);
  if(Number.isFinite(form.hp)&&form.hp!==1)ex.gearHpPct=(ex.gearHpPct||0)+pct(form.hp);
  if(Number.isFinite(form.def)&&form.def!==1)ex.gearDefPct=(ex.gearDefPct||0)+pct(form.def);
  for(const key of ['crit','critDamage','pierce','lifesteal','evasion','elementBonus','defenseIgnore'])if(Number.isFinite(form[key])&&form[key]!==0)ex[key]=(ex[key]||0)+form[key];
  let manaAttack=0;if(Number.isFinite(form.mp)&&form.mp>0)manaAttack+=Math.max(1,Math.round(form.mp/15));if(Number.isFinite(form.mpRegen)&&form.mpRegen>0)manaAttack+=Math.max(1,Math.round(form.mpRegen));if(manaAttack)ex.attackPct=(ex.attackPct||0)+manaAttack;
  for(const [key,value] of Object.entries(ex))legacy.push({key,value});
  if(EQUIPMENT_EFFECT_ELEMENTS.has(form.element)&&form.element!=='physical')legacy.push({key:'basicElement',value:form.element});
 }
 const src=Array.isArray(form.fixedEffects)&&form.fixedEffects.length?form.fixedEffects:legacy;
 form.fixedEffects=src.map(normalizeFixedEquipmentEffect).filter(Boolean).slice(0,5);
 if(!form.fixedEffects.length)form.fixedEffects=[{key:'flatAttack',value:0}];
 for(const key of ['atk','hp','def','mp','mpRegen','crit','critDamage','pierce','lifesteal','evasion','elementBonus','defenseIgnore','element','exclusive'])delete form[key];
 return form;
}
function normalizeAllEquipmentForms(){
  for(const jobs of ITEM_FORMS)for(const forms of jobs)for(const form of forms)normalizeEquipmentFormObject(form);
}
normalizeAllEquipmentForms();
delete EXTRA_AFFIX_NAMES[10];
delete EXTRA_AFFIX_NAMES[11];

// A boss item has its own identity. Its hidden random normal form must not grant effects.
itemForm=function(g){const group=equipmentFormGroup(g);return g&&g.boss===undefined&&Number.isInteger(g.form)?ITEM_FORMS[group]?.[g.slot]?.[g.form]||null:null;};

// Generic job-based armor profiles were another hidden equipment stat source. Remove them.
armorProfile=function(){return null;};

function convertLegacyManaAffix(a,g){
  if(!a||![10,11].includes(a.type))return a;
  const rank=Math.max(0,Math.min(3,Number(a.rank)||0)),tier=Math.max(1,Number(g?.tier)||1);
  const factor=a.type===10?(1+.35*rank):(.7+.3*rank);
  return {type:0,rank,value:Math.max(1,Math.round(tier*factor))};
}
function migrateEquipmentManaAffixes(list){
  if(!Array.isArray(list))return;
  for(const g of list){
    if(!g||!Array.isArray(g.affix))continue;
    g.affix=g.affix.map(a=>convertLegacyManaAffix(a,g));
  }
}
function migrateCurrentEquipmentMana(){
  if(state?.bag)migrateEquipmentManaAffixes(state.bag);
  if(Array.isArray(pendingGearLoot))migrateEquipmentManaAffixes(pendingGearLoot);
  if(typeof inlineAffixDrafts!=='undefined')for(const [key,list] of inlineAffixDrafts){
    const id=String(key).replace(/^shared:/,''),g=state?.bag?.find(x=>x.id===id);
    inlineAffixDrafts.set(key,list.map(a=>convertLegacyManaAffix(a,g)));
  }
}

// New rolls cannot produce max-MP or MP-regen affixes.
rollAffixes=function(g){
  return oldAffixRoll(g).map(a=>{
    const cfg=GAME_BALANCE.affixes,key=balanceQualityKey(a.rank);
    if(Math.random()>cfg.extendedPoolChance)return a;
    const attackPct=Number(cfg.extendedValues.attackPercent[key])||0;
    const specialTypes=[6,7,8,9,12,13,14,...(a.rank>=2&&attackPct>0?[15]:[])];
    const type=specialTypes[rand(specialTypes.length)];
    const value=type===15?attackPct:type===6?cfg.extendedValues.critDamage[key]:type===7?cfg.extendedValues.pierce[key]:type===8?cfg.extendedValues.lifesteal[key]:type===9?cfg.extendedValues.evasion[key]:type===12?cfg.extendedValues.elementDamage[key]:type===13?cfg.extendedValues.raceDamage[key]:cfg.extendedValues.resist[key];
    const result={type,rank:a.rank,value};
    if(type===12||type===14)result.element=['fire','ice','wind','light','shadow'][rand(5)];
    if(type===13)result.race=Object.keys(RACES)[rand(6)];
    return result;
  });
};

const equipmentCleanupAffixLabel=affixLabel;
affixLabel=function(a,g){
  if(a?.type===10||a?.type===11){const migrated=convertLegacyManaAffix(a,g);return `攻擊 +${migrated.value}`;}
  return equipmentCleanupAffixLabel(a,g);
};

function exclusiveEquipmentStats(g){
  const form=itemForm(g),ex=form?.exclusive||{};
  return {form,ex};
}
function exclusiveEquipmentText(g){
  const {form,ex}=exclusiveEquipmentStats(g),parts=[];
  if(form?.element&&form.element!=='physical')parts.push(`普攻屬性 ${ELEMENTS[form.element]}`);
  const addPct=(key,label)=>{const n=Number(ex[key]);if(Number.isFinite(n)&&n!==0)parts.push(`${label} ${n>0?'+':''}${n}%`);};
  addPct('gearAtkPct','此裝備基礎攻擊');
  addPct('gearHpPct','此裝備基礎生命');
  addPct('gearDefPct','此裝備基礎防禦');
  addPct('attackPct','攻擊力');
  addPct('crit','暴擊率');
  addPct('critDamage','暴擊傷害');
  addPct('pierce','防禦穿透');
  addPct('lifesteal','生命竊取');
  addPct('evasion','閃避率');
  addPct('elementBonus','全屬性增傷');
  return parts;
}

// Rebuild final stats from explicit sources only: character, base gear, affixes, then declared exclusive effects.
stats=function(h=state){
  const v=oldStats(h);
  Object.assign(v,{critDamage:1.5,pierce:0,lifesteal:0,evasion:0,elementBonus:0,elementDamage:{},raceDamage:{},resist:{}});
  let totalAttackPct=0;
  for(const g of equipment(h)){
    const base=gearBaseStats(g),{ex}=exclusiveEquipmentStats(g);
    if(ex.gearAtkPct)v.atk+=base.atk*ex.gearAtkPct/100;
    if(ex.gearHpPct)v.hp+=base.hp*ex.gearHpPct/100;
    if(ex.gearDefPct)v.def+=base.def*ex.gearDefPct/100;
    totalAttackPct+=Number(ex.attackPct)||0;
    if(ex.crit)v.crit+=(Number(ex.crit)||0)/100;
    for(const k of ['critDamage','pierce','lifesteal','evasion','elementBonus'])v[k]+=(Number(ex[k])||0)/100;
    for(const a0 of g.affix){
      const a=convertLegacyManaAffix(a0,g);
      if(a.type>=6&&a.type<=9)v[{6:'critDamage',7:'pierce',8:'lifesteal',9:'evasion'}[a.type]]+=a.value/100;
      else if(a.type===12)v.elementDamage[a.element]=(v.elementDamage[a.element]||0)+a.value/100;
      else if(a.type===13)v.raceDamage[a.race]=(v.raceDamage[a.race]||0)+a.value/100;
      else if(a.type===14)v.resist[a.element]=(v.resist[a.element]||0)+a.value/100;
      else if(a.type===15)totalAttackPct+=a.value;
    }
  }
  if(totalAttackPct)v.atk*=1+totalAttackPct/100;
  v.crit=Math.min(GAME_BALANCE.combat.statCaps.crit,v.crit);v.pierce=Math.min(GAME_BALANCE.combat.statCaps.pierce,v.pierce);v.evasion=Math.min(GAME_BALANCE.combat.statCaps.evasion,v.evasion);v.lifesteal=Math.min(GAME_BALANCE.combat.statCaps.lifesteal,v.lifesteal);
  v.speed=Math.round([102,108,116,96][h.job]+h.lv*.5+Math.min(5,(v.evasion||0)*10+(v.crit||0)*5));
  for(const k of ['hp','atk','def'])v[k]=Math.round(v[k]);
  return v;
};
solo.stats=stats;

// Base-stat text stays pure. Immutable extras are always separated and labeled.
gearDesc=function(g){
  const v=gearBaseStats(g),base=['atk','hp','def'].filter(k=>v[k]).map(k=>`${{atk:'攻擊',hp:'生命',def:'防禦'}[k]} +${Math.round(v[k])}`).join(' / ');
  const extras=exclusiveEquipmentText(g);
  return base+(extras.length?` / 專屬額外屬性（不可變更）：${extras.join('、')}`:'');
};

// Equipment comparison deliberately contains no MP / MP-regen rows.
equipmentComparison=function(h,g,position=null){
  const afterHero={...h,equipped:[...h.equipped]};while(afterHero.equipped.length<5)afterHero.equipped.push(null);const positions=gearEquipPositions(g);let target=Number.isInteger(position)&&positions.includes(position)?position:positions.find(p=>!afterHero.equipped[p]);if(target===undefined)target=positions[0];afterHero.equipped[target]=g.id;
  const before=stats(h),after=stats(afterHero),rows=[];
  const labels={hp:'生命上限',atk:'攻擊力',def:'防禦力',crit:'暴擊率',critDamage:'暴擊傷害',pierce:'防禦穿透',lifesteal:'生命竊取',evasion:'閃避率',elementBonus:'全屬性增傷',speed:'速度'};
  const percent=new Set(['crit','critDamage','pierce','lifesteal','evasion','elementBonus']);
  function add(label,a,b,isPercent=false,lowerBetter=false){const factor=isPercent?100:1;a=Number(((a||0)*factor).toFixed(2));b=Number(((b||0)*factor).toFixed(2));if(a===b)return;const d=Number((b-a).toFixed(2));rows.push({label,before:a,after:b,delta:d,percent:isPercent,good:lowerBetter?d<0:d>0});}
  for(const [key,label] of Object.entries(labels))add(label,before[key],after[key],percent.has(key));
  for(const key of ['elementDamage','raceDamage','resist'])for(const type of new Set([...Object.keys(before[key]||{}),...Object.keys(after[key]||{})]))add((key==='raceDamage'?RACES[type]:ELEMENTS[type])+' '+({elementDamage:'傷害',raceDamage:'種族增傷',resist:'抗性'}[key]),before[key]?.[type],after[key]?.[type],true);
  for(let i=0;i<CLASSES[h.job].skills.length;i++){const skill=CLASSES[h.job].skills[i];if(!h.skills[i])continue;add(skill[0]+' 威力倍率',skillPower(i,h),skillPower(i,afterHero));if(skill[1]==='active')add(skill[0]+' 冷卻',skillCooldown(i,h),skillCooldown(i,afterHero),false,true);else add(skill[0]+' 觸發率',procChance(i,h),procChance(i,afterHero),true);}
  return rows;
};

// Test JSON accepts fixedEffects (1–5 rows) and transparently migrates legacy exclusive / mana / form fields.
validateBalanceConfig=function(input){
  const data=validateBalanceConfigCore(input),elements=new Set(Object.keys(ELEMENTS));
  data.equipmentForms.forEach((jobs,job)=>jobs.forEach((forms,slot)=>forms.forEach((form,i)=>{normalizeEquipmentFormObject(form);for(const key of Object.keys(form))if(!['id','name','wearableJobs','fixedEffects'].includes(key))throw Error(`未知裝備欄位：${key}`);if(!Array.isArray(form.fixedEffects)||form.fixedEffects.length<1||form.fixedEffects.length>5)throw Error(`裝備固定屬性必須為 1～5 條：${job}-${slot}-${i}`);const wearJobs=Array.isArray(form.wearableJobs)?form.wearableJobs.filter(j=>Number.isInteger(j)&&j>=0&&j<data.classes.length):(job<data.classes.length?[job]:data.classes.map((_,j)=>j)),skillCount=wearJobs.reduce((max,j)=>Math.max(max,(data.classes[j]?.skills||[]).length),0);for(const [j,fx] of form.fixedEffects.entries()){if(!fx||!EQUIPMENT_FIXED_EFFECT_KEYS.has(fx.key))throw Error(`裝備固定屬性無效：${job}-${slot}-${i}-${j}`);if(fx.key==='basicElement'){if(!EQUIPMENT_EFFECT_ELEMENTS.has(fx.value))throw Error('裝備普通攻擊屬性無效');}else if(!Number.isFinite(fx.value))throw Error(`裝備固定屬性數值無效：${job}-${slot}-${i}-${j}`);if(['elementDamagePct','elementResistPct'].includes(fx.key)&&(!EQUIPMENT_EFFECT_ELEMENTS.has(fx.element)||fx.element==='physical'))throw Error('裝備固定屬性的元素目標無效');if(fx.key==='raceDamagePct'&&!EQUIPMENT_EFFECT_RACES.has(fx.race))throw Error('裝備固定屬性的種族目標無效');if(['skillEffectPct','skillCooldownReduction'].includes(fx.key)&&(!Number.isInteger(fx.skill)||fx.skill<0||fx.skill>=skillCount))throw Error('裝備固定屬性的技能目標無效');}})));

};

const equipmentCleanupApplyBalanceConfig=applyBalanceConfig;

const equipmentCleanupLoadParty=loadParty;

if(state){for(const h of party?.members||[state])withHero(h,clampVitals);save();render();}

// Update 12 final runtime hooks. These are deliberately last so every later compatibility layer uses the JSON settings.
need=function(l){return Math.round((GS('progression.xpCurve.base',45)+l*GS('progression.xpCurve.linear',18)+l*l*GS('progression.xpCurve.quadratic',2))*(GS('progression.xpCurve.multiplierBase',2.2)+l*GS('progression.xpCurve.multiplierPerLevel',.16)));};

etherDropChance=function(e){const c=GAMEPLAY_SETTINGS.rewards.ether;if(e.kind==='elite')return Math.min(c.eliteCap,c.eliteBase+c.elitePerTier*(regionTier(e.region??party.map)-1));if(e.kind==='boss'||e.kind==='final')return c.bossRepeat;return 0;};
awardEther=function(e){if(!party)return;let n=0;const c=GAMEPLAY_SETTINGS.rewards.ether,boss=e.kind==='boss'||e.kind==='final',key=(e.region??party.map)+':'+(e.difficulty||0);party.etherBossClaims??=[];if(boss&&!party.etherBossClaims.includes(key)){const min=Math.round(c.firstBossMin),max=Math.max(min,Math.round(c.firstBossMax));n=min+rand(max-min+1);party.etherBossClaims.push(key);}else if(Math.random()<etherDropChance(e))n=1;if(n){state.materials['以太鍛鐵']=(state.materials['以太鍛鐵']||0)+n;note('獲得以太鍛鐵 ×'+n);}};

victory=function(){let e=enemy;if(!e)return;lastDefeatedEnemy={...e};let mode=e.difficulty||0,d=MODES[mode],mi=e.region??state.map,tier=regionTier(mi),kindIndex=e.kind==='normal'?0:e.kind==='elite'?1:2,r=GAMEPLAY_SETTINGS.rewards,mult=[r.kindMultiplier.normal,r.kindMultiplier.elite,r.kindMultiplier.boss][kindIndex],firstClear=e.kind==='final'&&!state.won;state.totalKills++;state.kills[e.mat]=(state.kills[e.mat]||0)+1;if(!state.discovered.includes(e.mat))state.discovered.push(e.mat);let gold=Math.round((r.gold.base+e.lv*r.gold.perLevel)*mult*d.xp),xp=Math.round((r.xp.base+e.lv*r.xp.perLevel)*mult*d.xp);state.gold+=gold;state.ore+=Math.ceil(tier*(kindIndex===0?r.ore.normalKindMultiplier:r.ore.eliteBossKindMultiplier)*d.ore);if(Math.random()<(GAMEPLAY_SETTINGS.difficulty.materialChance[mode]??0)||kindIndex>0){let mat=e.kind==='boss'?bossMaterial(mi,mode):e.mat;state.materials[mat]=(state.materials[mat]||0)+1;note('獲得 '+mat+' ×1');}if(Math.random()<d.equip[kindIndex]){let g=gear(tier,rand(4),Math.random()<r.equipmentQuality.rareChance?2:Math.random()<r.equipmentQuality.fineConditionalChance?1:0);modeAffixes(g,mode);addGear(g);}if(Math.random()<d.rare){let g=gear(tier,rand(4),3);modeAffixes(g,mode);addGear(g);}if(e.kind==='boss'&&mi!==6&&Math.random()<d.boss)addGear(bossGear(mi,state.job,mode));if(Math.random()<d.gem[kindIndex]){let i=rand(3);state.gems[i]++;note('獲得 '+GEMS[i].name);}awardEther(e);if(Math.random()<r.potionDropChance)state.potions++;if(Math.random()<radiantDropChance(e.kind)){state.materials['光輝碎塊']=(state.materials['光輝碎塊']||0)+1;note('獲得極稀有道具：光輝碎塊 ×1');}if(e.kind==='final'){state.won=true;state.modeClears[mode]++;state.materials['日蝕王冠']=1;running=false;}awardXP(xp);state.hp=Math.min(stats().hp,state.hp+stats().hp*r.postVictoryHeal);state.shield=0;note(`擊敗 ${e.name}（${d.name}）· +${xp} EXP、${gold} 金幣`);enemy=null;if(e.kind==='final'){$('modal').innerHTML=`<h1>${firstClear?'等級界限已突破':'再次戰勝噬日者'}</h1><p>${d.name}模式通關。${firstClear?'等級上限提升。':'可繼續探索或挑戰更高難度。'}</p><button class="primary" onclick="closeModal()">繼續旅程</button>`;$('modal').showModal();}save();};solo.victory=victory;
rewardGroupKill=function(e){if(e.rewarded)return;e.rewarded=true;const members=heroes(),receiver=members[rand(members.length)],isFinal=e.kind==='final',r=GAMEPLAY_SETTINGS.rewards,mult=e.kind==='normal'?r.kindMultiplier.normal:e.kind==='elite'?r.kindMultiplier.elite:r.kindMultiplier.boss,xp=Math.round((r.xp.base+e.lv*r.xp.perLevel)*mult*MODES[e.difficulty].xp),hp=receiver.hp,shield=receiver.shield;const oldAward=awardXP;awardXP=()=>{};enemy=e;partyBusy=true;try{withHero(receiver,()=>solo.victory());}finally{awardXP=oldAward;partyBusy=false;receiver.hp=hp;receiver.shield=shield;}if(isFinal){party.cleared=true;closeModal();running=true;}for(const h of members){if(h!==receiver){if(isFinal)h.modeClears[e.difficulty]++;h.totalKills++;h.kills[e.mat]=(h.kills[e.mat]||0)+1;if(!h.discovered.includes(e.mat))h.discovered.push(e.mat);}if(party.cleared&&h.lv>=GS('progression.levelCaps.beforeClear',30))h.won=true;const wasDead=h.hp<=0;withHero(h,()=>awardXP(Math.max(1,Math.round(xp/members.length))));if(wasDead)h.hp=0;if(party.cleared&&h.lv>=GS('progression.levelCaps.beforeClear',30))h.won=true;}enemy=foes.find(x=>x.hp>0)||null;};

<script id="battle-statistics-system">
/* Persistent per-map battle statistics. One battle = one completed group encounter. */
const BATTLE_STATS_LIMIT=300;
const BATTLE_STATS_STORAGE_KEY='emberwild-battle-statistics-v1';
let activeBattleStat=null;
let statsRewardingKill=false;

function normalizeBattleStatistics(raw){
  const out={maps:{}};
  const maps=raw&&typeof raw==='object'&&raw.maps&&typeof raw.maps==='object'?raw.maps:{};
  for(let mi=0;mi<MAPS.length;mi++){
    const src=Array.isArray(maps[mi])?maps[mi]:Array.isArray(maps[String(mi)])?maps[String(mi)]:[];
    const rows=[];
    for(const r of src.slice(-BATTLE_STATS_LIMIT)){
      if(!r||typeof r!=='object')continue;
      const deaths=Array.isArray(r.deaths)?r.deaths.slice(0,8).flatMap(d=>{
        if(!d||!Number.isInteger(d.job)||d.job<0||d.job>=CLASSES.length)return [];
        return [{job:d.job,name:String(d.name||CLASSES[d.job].name).slice(0,60),cause:String(d.cause||'未知').slice(0,160)}];
      }):[];
      const drops={};
      if(r.drops&&typeof r.drops==='object'&&!Array.isArray(r.drops))for(const [name,n] of Object.entries(r.drops).slice(0,600)){
        const v=Math.max(0,Math.min(1e9,Math.floor(Number(n)||0)));if(v)drops[String(name).slice(0,120)]=v;
      }
      rows.push({time:Number.isFinite(r.time)?Math.max(0,Math.floor(r.time)):0,difficulty:[0,1,2].includes(r.difficulty)?r.difficulty:0,result:r.result==='wipe'?'wipe':'victory',xp:Math.max(0,Math.min(1e12,Math.floor(Number(r.xp)||0))),drops,deaths});
    }
    if(rows.length)out.maps[mi]=rows;
  }
  return out;
}
function ensureBattleStatistics(){
  if(!party)return {maps:{}};
  party.battleStatistics=normalizeBattleStatistics(party.battleStatistics);
  return party.battleStatistics;
}
function currentMapBattleRecords(){
  const stats=ensureBattleStatistics();
  return stats.maps[party.map]||(stats.maps[party.map]=[]);
}
function beginBattleStatistics(){
  if(!party)return;
  activeBattleStat={map:party.map,difficulty:party.difficulty||0,time:Date.now(),xp:0,drops:{},deaths:[],pendingOutcome:null};
}
function addBattleStatDrop(name,count=1){
  if(!activeBattleStat||activeBattleStat.map!==party?.map)return;
  const n=Math.floor(Number(count)||0);if(n<=0||!name||name==='金幣')return;
  activeBattleStat.drops[name]=(activeBattleStat.drops[name]||0)+n;
}
function recordBattleDeath(h,e,cause){
  if(!activeBattleStat||!h||!e)return;
  activeBattleStat.deaths.push({job:h.job,name:characterName(h),cause:`${e.name}－${cause}`});
  if(!living().length)activeBattleStat.pendingOutcome='wipe';
}
function finalizeBattleStatistics(result){
  if(!activeBattleStat||!party)return;
  const rec={time:activeBattleStat.time,difficulty:activeBattleStat.difficulty,result:result==='wipe'?'wipe':'victory',xp:Math.max(0,Math.floor(activeBattleStat.xp||0)),drops:{...activeBattleStat.drops},deaths:activeBattleStat.deaths.map(x=>({...x}))};
  const map=activeBattleStat.map,stats=ensureBattleStatistics(),rows=stats.maps[map]||(stats.maps[map]=[]);
  rows.push(rec);if(rows.length>BATTLE_STATS_LIMIT)rows.splice(0,rows.length-BATTLE_STATS_LIMIT);
  activeBattleStat=null;
  save();
  if(tab==='statistics')render();
}
function battleDeathMoveName(e){
  if(e?.kind!=='final')return '普通攻擊';
  const fb=GAMEPLAY_SETTINGS.combat.finalBoss,turn=e.turn||0;
  if(turn>fb.enrageAfterTurn)return '狂暴攻擊';
  if(turn%Math.max(1,Math.round(fb.specialEveryTurns))===0)return '日蝕打擊';
  return '普通攻擊';
}
function battleStatLootSnapshot(){
  const h=party?.members?.[0];
  if(!h)return null;
  return {ore:h.ore,dust:h.dust,potions:h.potions,gems:[...h.gems],materials:{...h.materials}};
}
function collectBattleStatLootDiff(before,after){
  if(!before||!after)return;
  addBattleStatDrop('鍛鐵',after.ore-before.ore);addBattleStatDrop('寶石粉塵',after.dust-before.dust);addBattleStatDrop('治療藥水',after.potions-before.potions);
  after.gems.forEach((n,i)=>addBattleStatDrop(GEMS[i].name,n-before.gems[i]));
  for(const [name,n] of Object.entries(after.materials))addBattleStatDrop(name,n-(before.materials[name]||0));
}

const battleStatsCreatePartyBase=createParty;
createParty=function(hero){const p=battleStatsCreatePartyBase(hero);p.battleStatistics={maps:{}};return p;};
const battleStatsValidatePartyBase=validateParty;
validateParty=function(data){const p=battleStatsValidatePartyBase(data);p.battleStatistics=normalizeBattleStatistics(data?.battleStatistics);return p;};
const battleStatsPackPartyBase=packParty;
packParty=function(){const out=battleStatsPackPartyBase();if(party)out.battleStatistics=normalizeBattleStatistics(party.battleStatistics);return out;};
const battleStatsSaveBase=save;
save=function(show=false){if(!saveReady)return;if(party){try{localStorage.setItem(BATTLE_STATS_STORAGE_KEY,JSON.stringify(normalizeBattleStatistics(party.battleStatistics)));}catch{}}return battleStatsSaveBase(show);};
const battleStatsNewGameBase=newGame;
newGame=function(){try{localStorage.removeItem(BATTLE_STATS_STORAGE_KEY);}catch{}activeBattleStat=null;return battleStatsNewGameBase();};
const battleStatsResetEncounterBase=resetEncounter;
resetEncounter=function(){activeBattleStat=null;return battleStatsResetEncounterBase();};
const battleStatsSpawnGroupBase=spawnGroup;
spawnGroup=function(){const r=battleStatsSpawnGroupBase();beginBattleStatistics();return r;};
const battleStatsAwardXPBase=awardXP;
awardXP=function(amount){if(statsRewardingKill&&activeBattleStat)activeBattleStat.xp+=Math.max(0,Math.floor(Number(amount)||0));return battleStatsAwardXPBase(amount);};
const battleStatsAddGearBase=addGear;
addGear=function(g){if(statsRewardingKill&&activeBattleStat)addBattleStatDrop(equipmentDisplayName(g),1);return battleStatsAddGearBase(g);};
const battleStatsRewardGroupKillBase=rewardGroupKill;
rewardGroupKill=function(e){if(e?.rewarded)return;const before=battleStatLootSnapshot();statsRewardingKill=true;try{return battleStatsRewardGroupKillBase(e);}finally{statsRewardingKill=false;collectBattleStatLootDiff(before,battleStatLootSnapshot());}};
const battleStatsEnemyBasicBase=performEnemyBasic;
performEnemyBasic=function(e){const before=new Map(heroes().map(h=>[h.job,h.hp]));const r=battleStatsEnemyBasicBase(e);for(const h of heroes())if((before.get(h.job)||0)>0&&h.hp<=0)recordBattleDeath(h,e,battleDeathMoveName(e));return r;};
const battleStatsPacedRoundBase=pacedRound;
pacedRound=function*(){yield* battleStatsPacedRoundBase();if(!activeBattleStat)return;if(activeBattleStat.pendingOutcome==='wipe')finalizeBattleStatistics('wipe');else if(foes.length&&foes.every(e=>e.hp<=0))finalizeBattleStatistics('victory');};

function aggregateCurrentMapStatistics(){
  const records=currentMapBattleRecords(),drops=new Map(),memberData=new Map();let xp=0,wipes=0,deaths=0;
  for(const h of party.members)memberData.set(h.job,{count:0,recent:[]});
  for(const r of records){xp+=r.xp||0;if(r.result==='wipe')wipes++;for(const [name,n] of Object.entries(r.drops||{}))drops.set(name,(drops.get(name)||0)+n);deaths+=(r.deaths||[]).length;for(const d of r.deaths||[]){if(!memberData.has(d.job))memberData.set(d.job,{count:0,recent:[]});memberData.get(d.job).count++;}}
  for(let i=records.length-1;i>=0;i--)for(let j=(records[i].deaths||[]).length-1;j>=0;j--){const d=records[i].deaths[j],m=memberData.get(d.job);if(m&&m.recent.length<5)m.recent.push(d.cause);}
  return {records,xp,wipes,deaths,drops:[...drops.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'zh-Hant')),memberData};
}
function statisticsView(){
  const a=aggregateCurrentMapStatistics(),m=MAPS[party.map];
  const difficultyCounts=[0,1,2].map(i=>a.records.filter(r=>r.difficulty===i).length);
  return heading('STATISTICS / 戰鬥統計',m.name,`<span class="tag">最近 ${a.records.length} / ${BATTLE_STATS_LIMIT} 場</span>`)+
  `<section class="statistics-summary">
    <article class="card"><span class="statistics-number">${a.records.length.toLocaleString()}</span><span class="statistics-label">已完成戰鬥</span></article>
    <article class="card"><span class="statistics-number">${a.xp.toLocaleString()}</span><span class="statistics-label">總獲得經驗</span></article>
    <article class="card"><span class="statistics-number">${a.wipes.toLocaleString()}</span><span class="statistics-label">總全滅次數</span></article>
    <article class="card"><span class="statistics-number">${a.deaths.toLocaleString()}</span><span class="statistics-label">總死亡次數</span></article>
  </section><p class="small">統計只計算在此地圖完成的群怪遭遇；中途換圖、換隊員或切換難度不計場次。模式場次：${MODES.map((d,i)=>`${d.name} ${difficultyCounts[i]}`).join(' ／ ')}</p>
  <div class="statistics-layout"><section class="panel"><h2>掉落道具</h2><div class="statistics-loot-list">${a.drops.length?a.drops.map(([name,n])=>`<div class="statistics-loot-row"><span>${esc(name)}</span><b>×${n.toLocaleString()}</b></div>`).join(''):'<p class="statistics-empty">最近的戰鬥尚無掉落紀錄。</p>'}</div></section>
  <section class="panel"><h2>隊員死亡統計</h2><div class="statistics-members">${party.members.map(h=>{const d=a.memberData.get(h.job)||{count:0,recent:[]};return `<article class="statistics-member"><h3><span>${esc(characterName(h))}</span><span class="tag">死亡 ${d.count}</span></h3>${d.recent.length?`<ol class="statistics-deaths">${d.recent.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:'<p class="statistics-empty">最近 300 場內沒有死亡紀錄。</p>'}</article>`;}).join('')}</div><p class="small">每名隊員最多顯示最近 5 次直接致死來源，格式為「怪物名稱－招式名稱」。</p></section></div>`;
}
function ensureStatisticsNavButton(){
  const nav=document.querySelector('#app nav');if(!nav)return;
  let btn=nav.querySelector('[data-statistics-tab]');
  if(!btn){btn=document.createElement('button');btn.dataset.statisticsTab='1';btn.textContent='統計';btn.onclick=()=>setTab('statistics');nav.appendChild(btn);}
  if(tab==='statistics'){nav.querySelectorAll('button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');}else btn.classList.remove('active');
}
const battleStatisticsRenderBase=render;
render=function(){
  if(state&&party&&tab==='statistics'){
    tab='battle';battleStatisticsRenderBase();tab='statistics';
    const main=document.querySelector('#app .layout>main');if(main)main.innerHTML=statisticsView();
    ensureStatisticsNavButton();return;
  }
  battleStatisticsRenderBase();ensureStatisticsNavButton();
};
if(state&&party){
  try{const raw=localStorage.getItem(BATTLE_STATS_STORAGE_KEY);if(raw)party.battleStatistics=normalizeBattleStatistics(JSON.parse(raw));}catch{party.battleStatistics={maps:{}};}
  ensureBattleStatistics();save();render();
}
</script>

<script id="action-turn-cooldown-enemy-skills">
GAME_BALANCE_DEFAULTS.affixes.extendedValues.allCooldownReduction ??= {normal:0,fine:0,rare:1,legendary:2};
GAME_BALANCE=normalizeRuntimeBalance(GAME_BALANCE);
GAMEPLAY_SETTINGS_DEFAULTS.monsters.skillSystem ??= {assignChance:{normal:.30,elite:.65,boss:1,final:1}};
GAMEPLAY_SETTINGS_DEFAULTS.monsters.skills ??= [
  {id:'heavy_strike',name:'沉重打擊',enabled:true,weight:1,minLevel:1,kind:'all',race:'all',power:1.35,cooldownMin:2,cooldownMax:4,element:'inherit',target:'random'},
  {id:'feral_rush',name:'狂野突進',enabled:true,weight:.8,minLevel:8,kind:'elite',race:'all',power:1.55,cooldownMin:3,cooldownMax:5,element:'inherit',target:'weakest'},
  {id:'boss_crush',name:'首領重壓',enabled:true,weight:1,minLevel:1,kind:'boss',race:'all',power:1.7,cooldownMin:3,cooldownMax:5,element:'inherit',target:'random'}
];
mergeGameplayShape=function mergeGameplayShapeActionTurns(def,src,path=''){
  if(Array.isArray(def)){
    if(path==='monsters.skills'){
      if(!Array.isArray(src))return cloneGameplaySettings(def);
      if(!def.length)return cloneGameplaySettings(src);
      const template=def[0];
      return src.map((v,i)=>mergeGameplayShapeActionTurns(def[i]===undefined?template:def[i],v,path+'.'+i));
    }
    return def.map((v,i)=>mergeGameplayShapeActionTurns(v,Array.isArray(src)?src[i]:undefined,path?path+'.'+i:String(i)));
  }
  if(def&&typeof def==='object'){const out={};for(const k of Object.keys(def)){const next=path?path+'.'+k:k;out[k]=mergeGameplayShapeActionTurns(def[k],src&&typeof src==='object'?src[k]:undefined,next);}return out;}
  if(typeof def==='number')return typeof src==='number'&&Number.isFinite(src)?src:def;
  return typeof src===typeof def?src:def;
};
const actionTurnValidateGameplayBase=validateGameplaySettings;
validateGameplaySettings=function(cfg){
  cfg=actionTurnValidateGameplayBase(cfg);
  const allowedKind=new Set(['all','normal','elite','boss','final']),allowedRace=new Set(['all',...Object.keys(RACES)]),allowedElement=new Set(['inherit',...Object.keys(ELEMENTS)]),allowedTarget=new Set(['random','weakest']);
  const chances=cfg.monsters.skillSystem?.assignChance||{};
  for(const k of ['normal','elite','boss','final'])if(!Number.isFinite(chances[k])||chances[k]<0||chances[k]>1)throw Error('敵人技能配置機率需介於 0~1：'+k);
  if(!Array.isArray(cfg.monsters.skills))throw Error('敵人技能必須是陣列');
  const ids=new Set();
  for(const [i,sk] of cfg.monsters.skills.entries()){
    if(!sk||typeof sk.id!=='string'||!sk.id.trim()||ids.has(sk.id))throw Error('敵人技能 ID 無效或重複：'+i);ids.add(sk.id);
    if(typeof sk.name!=='string'||!sk.name.trim()||typeof sk.enabled!=='boolean'||!Number.isFinite(sk.weight)||sk.weight<=0||!Number.isFinite(sk.minLevel)||sk.minLevel<1||!Number.isFinite(sk.power)||sk.power<0||!Number.isFinite(sk.cooldownMin)||!Number.isFinite(sk.cooldownMax)||sk.cooldownMin<0||sk.cooldownMax<sk.cooldownMin||!allowedKind.has(sk.kind)||!allowedRace.has(sk.race)||!allowedElement.has(sk.element)||!allowedTarget.has(sk.target))throw Error('敵人技能資料無效：'+(sk.id||i));
    sk.minLevel=Math.max(1,Math.floor(sk.minLevel));sk.cooldownMin=Math.max(0,Math.floor(sk.cooldownMin));sk.cooldownMax=Math.max(sk.cooldownMin,Math.floor(sk.cooldownMax));
  }
  return cfg;
};
normalizeGameplaySettings=function(input){return validateGameplaySettings(mergeGameplayShape(GAMEPLAY_SETTINGS_DEFAULTS,input||{}));};
GAMEPLAY_SETTINGS=normalizeGameplaySettings(GAMEPLAY_SETTINGS);globalThis.__EMBERWILD_GAMEPLAY_SETTINGS=GAMEPLAY_SETTINGS;applyGameplaySettingsSideEffects();
const actionTurnBalanceReferenceBase=balanceReference;
balanceReference=function(){const r=actionTurnBalanceReferenceBase();r.affixTypes['16']='全主動／輔助技能冷卻減少（回合）';r.balancePaths['balance.affixes.extendedValues.allCooldownReduction']='新全技能冷卻詞條；只影響有冷卻的主動與輔助技能，單位為角色回合';r.units.cooldown='回合；只有該角色實際輪到行動時才推進';return r;};
EXTRA_AFFIX_NAMES[16]='全技能冷卻';
rollAffixes=function(g){return oldAffixRoll(g).map(a=>{const cfg=GAME_BALANCE.affixes,key=balanceQualityKey(a.rank);if(Math.random()>cfg.extendedPoolChance)return a;const attackPct=Number(cfg.extendedValues.attackPercent[key])||0,allCd=Number(cfg.extendedValues.allCooldownReduction?.[key])||0;const specialTypes=[6,7,8,9,12,13,14,...(a.rank>=2&&attackPct>0?[15]:[]),...(allCd>0?[16]:[])],type=specialTypes[rand(specialTypes.length)];const value=type===16?allCd:type===15?attackPct:type===6?cfg.extendedValues.critDamage[key]:type===7?cfg.extendedValues.pierce[key]:type===8?cfg.extendedValues.lifesteal[key]:type===9?cfg.extendedValues.evasion[key]:type===12?cfg.extendedValues.elementDamage[key]:type===13?cfg.extendedValues.raceDamage[key]:cfg.extendedValues.resist[key];const result={type,rank:a.rank,value};if(type===12||type===14)result.element=['fire','ice','wind','light','shadow'][rand(5)];if(type===13)result.race=Object.keys(RACES)[rand(6)];return result;});};
const actionTurnAffixLabelBase=affixLabel;
affixLabel=function(a,g){
  if(a?.type===16)return `全主動／輔助技能冷卻 −${a.value} 回合`;
  if(a?.type===5){const sk=CLASSES[g?.job??state.job]?.skills?.[a.skill??0];if(sk?.[1]==='active')return `${sk[0]} 冷卻 −${a.value} 回合`;}

};
/* Keep the unified equipment filter model; affix type 16 needs no separate filter override. */
filteredGear=function(){return state.bag.filter(g=>(filters.slot==='all'||g.slot===Number(filters.slot))&&(filters.job==='all'||gearWearableJobs(g).includes(Number(filters.job)))&&(filters.boss==='all'||(filters.boss==='boss')===(g.boss!==undefined))&&(filters.effectRank==='all'||gearQualityRank(g)===Number(filters.effectRank))).sort((a,b)=>Number(!!gearWearer(b.id))-Number(!!gearWearer(a.id))||b.tier-a.tier||gearQualityRank(b)-gearQualityRank(a));};
function allSkillCooldownReduction(h=state){return equipment(h).filter(g=>g.job===h.job||g.slot===1).flatMap(g=>g.affix||[]).filter(a=>a.type===16).reduce((n,a)=>n+(Number(a.value)||0),0);}

function performEnemySkill(e,sk){e.turn=(e.turn||0)+1;const h=enemySkillTarget(sk);if(!h)return;const beforeHp=h.hp,v=battleStats(h),c=GAMEPLAY_SETTINGS.combat,fb=c.finalBoss;const levelMulti=e.kind==='final'?(e.turn>fb.enrageAfterTurn?fb.enrageMultiplier:1):1+Math.max(0,e.lv-h.lv)*c.levelGapDamagePerLevel;let hit=Math.max(1,Math.round(e.atk*(Number.isFinite(sk.power)?sk.power:1)*(1-Math.min(c.caps.weaken,effectTotal(e.id,'weaken')))*levelMulti-v.def*c.defenseEffectiveness));hit=Math.max(1,Math.round(hit*(1-Math.min(c.caps.guard,effectTotal(heroKey(h),'guard')))));if(Math.random()<v.evasion){note(characterName(h)+'閃避了'+combatEnemyName(e)+'的「'+sk.name+'」');return;}const element=sk.element==='inherit'?e.element:sk.element,ward=activeSupply(h,'ward'),resist=Math.min(c.caps.resistance,(v.resist[element]||0)+(ward&&ward.element===element?c.supply.wardResistance:0));hit=Math.max(1,Math.round(hit*(1-resist)));const absorb=Math.min(h.shield,hit);h.shield-=absorb;if(absorb>0)recordCombatContribution(h,'mitigation',absorb);const hpDamage=Math.max(0,hit-absorb);h.hp=Math.max(0,h.hp-hpDamage);if(absorb>0&&hpDamage===0)note(combatEnemyName(e)+'・'+sk.name+' → '+characterName(h)+' 的護盾 '+absorb+' 傷害（剩餘 '+Math.round(h.shield)+'）');else note(combatEnemyName(e)+'・'+sk.name+' → '+characterName(h)+' '+hpDamage+' 傷害'+(absorb?`（護盾吸收 ${absorb}，剩餘 ${Math.round(h.shield)}）`:''));if(beforeHp>0&&h.hp<=0&&typeof recordBattleDeath==='function')recordBattleDeath(h,e,sk.name);}

      if(text==='噬日者已倒下！LV30 成員解鎖 LV60，其他成員達 LV30 時解鎖。'){
        const before=Math.floor(GS('progression.levelCaps.beforeClear',30)),after=Math.floor(GS('progression.levelCaps.afterClear',60));
        text=`噬日者已倒下！LV${before} 成員解鎖 LV${after}，其他成員達 LV${before} 時解鎖。`;
      }
      return auditedNoteBase(text);
    };
  }

  // Preserve late pending-loot data through validateParty() so manual JSON
  // import does not silently discard it. The actual gear objects are validated
  // after the party state is available by reusing the final validateSave().
  if(typeof validateParty==='function'){
    const auditedValidatePartyBase=validateParty;
    validateParty=function(data){
      const out=auditedValidatePartyBase(data);
      if(data?.pendingGearLoot!==undefined){
        if(!Array.isArray(data.pendingGearLoot))throw Error('待結算裝備資料無效');
        out.pendingGearLoot=validatePendingGearArray(data.pendingGearLoot,out);
      }
      return out;
    };
  }
  function validatePendingGearArray(raw,validatedParty=null){
    if(raw===undefined)return [];
    if(!Array.isArray(raw))throw Error('待結算裝備資料無效');
    const members=validatedParty?.members||[state],hero=validatedParty?members.find(h=>h.job===validatedParty.selected):state;
    const existing=new Set(members.flatMap(h=>(h?.bag||[]).map(g=>g.id))),seen=new Set(),out=[],template=clonePlain(hero);
    for(const item of raw){
      if(!item||typeof item.id!=='string'||existing.has(item.id)||seen.has(item.id))throw Error('待結算裝備 ID 無效');
      seen.add(item.id);
      const probe={...template,map:0,bag:[clonePlain(item)],equipped:[null,null,null,null,null]};
      const valid=validateSave(probe);
      if(!valid?.bag?.[0])throw Error('待結算裝備資料無效');
      out.push(valid.bag[0]);
    }
    return out;
  }
  if(typeof loadParty==='function'){
    const auditedLoadPartyBase=loadParty;
    loadParty=function(data){
      const validated=validateParty(data),queued=validated.pendingGearLoot;
      const copy=clonePlain(data);copy.pendingGearLoot=[];
      const out=auditedLoadPartyBase(copy);
      pendingGearLoot=queued||[];
      return out;
    };
  }
})();



// Update 20: continued audit fixes.
// The party-page renderer wraps advance() in heroMenuAction(), so the older
// button-state patch no longer matched the final markup. Keep the displayed
// requirement and clickability aligned with the actual advance() guard.
(function installContinuedAuditFixes(){
  if(typeof characterView==='function'){
    const continuedAuditCharacterViewBase=characterView;
    characterView=function(){
      let html=continuedAuditCharacterViewBase();
      const h=typeof pageHero==='function'?pageHero('character'):state;
      const a=GAMEPLAY_SETTINGS.progression.advance;
      const shouldDisable=!!h&&(h.advanced||h.lv<a.level);
      html=html.replace(/<button class="primary" onclick="heroMenuAction\((\d+),\(\)=>\{advance\(\)\}\)"\s*(?:disabled)?\s*>/,function(full,job){
        return `<button class="primary" onclick="heroMenuAction(${job},()=>{advance()})"${shouldDisable?' disabled':''}>`;
      });
      return html;

})();

// The first save-load pass runs before late gameplay modules are installed. Run
// one final hydration unconditionally so fields introduced by late modules are
// not silently discarded even when the early/core load succeeded.
try{
  const raw=globalThis.__EMBERWILD_BOOT_SAVE_RAW??localStorage.getItem(KEY);
  if(raw){
    const parsed=JSON.parse(raw),fallbackStats=party?.battleStatistics;
    loadParty(parsed);
    if(!parsed.battleStatistics){
      try{
        const statsRaw=typeof BATTLE_STATS_STORAGE_KEY!=='undefined'?localStorage.getItem(BATTLE_STATS_STORAGE_KEY):null;
        if(statsRaw)party.battleStatistics=normalizeBattleStatistics(JSON.parse(statsRaw));
        else if(fallbackStats)party.battleStatistics=normalizeBattleStatistics(fallbackStats);
      }catch(e){if(fallbackStats)party.battleStatistics=normalizeBattleStatistics(fallbackStats);}
    }
    // Early loaders may have normalized the save before late-module fields were
    // restored. Persist the fully hydrated final state so a second immediate
    // reload cannot lose pending loot or other late-module data.
    save();
  }
}catch(e){
  console.warn('最終存檔完整載入失敗',e);
  if(!state){state=null;party=null;toast('存檔未能載入：'+e.message+'；可匯入備份。');}
}
render();

<script id="economy-and-salvage-system">
/* Update 21: sale economy, grouped pending loot and configurable salvage output. */
(function installEconomyAndSalvageSystem(){
  const QUALITY_NAMES=(typeof AFFIX_RANK!=='undefined'?AFFIX_RANK:['普通','精良','稀有','傳說']);
  const DEFAULT_GEAR_SELL=[12,30,75,180];
  const defaultMaterialKeys=()=>{
    const set=new Set(['鍛鐵','粉塵','以太鍛鐵','光輝碎塊','升級卷軸']);
    for(const m of (GAMEPLAY_SETTINGS_DEFAULTS?.monsters?.catalog||[]))if(m?.material)set.add(m.material);
    for(const d of (GAMEPLAY_SETTINGS_DEFAULTS?.drops?.entries||[]))if(d?.type==='material'&&d.key)set.add(d.key);
    return [...set];
  };
  const defaultMaterialPrice=k=>k==='鍛鐵'?2:k==='粉塵'?6:k==='以太鍛鐵'?100:k==='光輝碎塊'?120:k==='升級卷軸'?150:5;
  GAMEPLAY_SETTINGS_DEFAULTS.economy ??={};
  GAMEPLAY_SETTINGS_DEFAULTS.economy.equipmentSellPriceByQuality ??=DEFAULT_GEAR_SELL.slice();
  GAMEPLAY_SETTINGS_DEFAULTS.economy.materialDefaultSellPrice ??=5;
  GAMEPLAY_SETTINGS_DEFAULTS.economy.potionSellPrice ??=10;
  GAMEPLAY_SETTINGS_DEFAULTS.economy.materialPrices ??=defaultMaterialKeys().map(key=>({key,sellPrice:defaultMaterialPrice(key)}));
  GAMEPLAY_SETTINGS_DEFAULTS.equipment.salvage.extraRewards ??=[];

  const economyDynamicArrays=new Set(['monsters.skills','monsters.catalog','drops.entries','economy.materialPrices','equipment.salvage.extraRewards']);
  mergeGameplayShape=function mergeGameplayShapeEconomy(def,src,path=''){
    if(Array.isArray(def)){
      const isSourcesKinds=/^(drops\.entries\.\d+\.(sources|kinds))$/.test(path);
      const dynamic=economyDynamicArrays.has(path)||isSourcesKinds;
      if(dynamic){
        if(!Array.isArray(src))return cloneGameplaySettings(def);
        if(isSourcesKinds||!def.length)return cloneGameplaySettings(src);
        const template=def[0];
        return src.map((v,i)=>mergeGameplayShapeEconomy(def[i]===undefined?template:def[i],v,path+'.'+i));
      }
      return def.map((v,i)=>mergeGameplayShapeEconomy(v,Array.isArray(src)?src[i]:undefined,path?path+'.'+i:String(i)));
    }
    if(def&&typeof def==='object'){
      const out={};
      for(const k of Object.keys(def)){const next=path?path+'.'+k:k;out[k]=mergeGameplayShapeEconomy(def[k],src&&typeof src==='object'?src[k]:undefined,next);}
      return out;
    }
    if(typeof def==='number')return typeof src==='number'&&Number.isFinite(src)?src:def;
    return typeof src===typeof def?src:def;
  };

  const economyValidateGameplayBase=validateGameplaySettings;
  validateGameplaySettings=function(cfg){
    cfg=economyValidateGameplayBase(cfg);
    const e=cfg.economy||{},prices=e.equipmentSellPriceByQuality;
    if(!Array.isArray(prices)||prices.length!==4||prices.some(v=>!Number.isFinite(v)||v<0))throw Error('裝備販售價格必須有普通／精良／稀有／傳說 4 個非負數值');
    if(!Number.isFinite(e.materialDefaultSellPrice)||e.materialDefaultSellPrice<0||!Number.isFinite(e.potionSellPrice)||e.potionSellPrice<0)throw Error('材料／治療藥水販售價格無效');
    if(!Array.isArray(e.materialPrices))throw Error('材料販售價格表無效');
    const materialKeys=new Set();
    for(const [i,row] of e.materialPrices.entries()){
      if(!row||typeof row.key!=='string'||!row.key.trim()||materialKeys.has(row.key)||!Number.isFinite(row.sellPrice)||row.sellPrice<0)throw Error('材料販售價格資料無效：'+i);
      materialKeys.add(row.key);
    }
    const extras=cfg.equipment?.salvage?.extraRewards,types=new Set(['ore','dust','material','potion','item','gem']);
    if(!Array.isArray(extras))throw Error('分解額外產物必須是陣列');
    for(const [i,r] of extras.entries()){
      if(!r||!Number.isInteger(r.quality)||r.quality<0||r.quality>3||!types.has(r.type)||!Number.isInteger(r.quantity)||r.quantity<1||r.quantity>999)throw Error('分解額外產物資料無效：'+i);
      if(r.type==='material'&&(typeof r.key!=='string'||!r.key.trim()))throw Error('分解材料產物需要材料名稱：'+i);
      if(r.type==='item'&&!SHOP.some(x=>x.id===r.key))throw Error('分解產物指定的商店道具不存在：'+i);
      if(r.type==='gem'&&r.key!=='random'&&![0,1,2,'0','1','2'].includes(r.key))throw Error('分解寶石 key 需為 random/0/1/2：'+i);
    }
    return cfg;
  };
  normalizeGameplaySettings=function(input){if(typeof validateMonsterDropDynamicInput==='function')validateMonsterDropDynamicInput({balanceSettings:input});return validateGameplaySettings(mergeGameplayShape(GAMEPLAY_SETTINGS_DEFAULTS,input||{}));};

  const normalizeItemSellPrices=data=>{
    if(Array.isArray(data?.items))for(const item of data.items){if(!Number.isFinite(item.sellPrice)||item.sellPrice<0)item.sellPrice=Math.max(0,Math.round((Number(item.cost)||0)*.25));}
    return data;
  };
  const economyValidateBalanceBase=validateBalanceConfig;
  validateBalanceConfig=function(input){
    const copy=normalizeItemSellPrices(JSON.parse(JSON.stringify(input)));
    const out=economyValidateBalanceBase(copy);
    normalizeItemSellPrices(out);
    for(const item of out.items||[])if(!Number.isFinite(item.sellPrice)||item.sellPrice<0)throw Error('道具賣出價格無效：'+(item.id||'未知'));
    return out;
  };
  const economyApplyBalanceBase=applyBalanceConfig;
  applyBalanceConfig=function(input,{persist=true}={}){
    const copy=normalizeItemSellPrices(JSON.parse(JSON.stringify(input)));
    const out=economyApplyBalanceBase(copy,{persist:false});
    for(const item of SHOP)if(!Number.isFinite(item.sellPrice)||item.sellPrice<0)item.sellPrice=Math.max(0,Math.round((Number(item.cost)||0)*.25));
    if(persist)localStorage.setItem(BALANCE_KEY,JSON.stringify(exportableBalance()));
    if(state)render();
    return out;
  };
  for(const item of SHOP)if(!Number.isFinite(item.sellPrice)||item.sellPrice<0)item.sellPrice=Math.max(0,Math.round((Number(item.cost)||0)*.25));

  // Re-normalize the in-memory settings now that the new economy fields exist.
  try{
    const saved=localStorage.getItem(BALANCE_KEY);
    if(saved){const parsed=JSON.parse(saved);if(parsed?.balanceSettings)GAMEPLAY_SETTINGS=normalizeGameplaySettings(parsed.balanceSettings);if(Array.isArray(parsed?.items)){const byId=new Map(parsed.items.map(x=>[x.id,x]));for(const item of SHOP){const src=byId.get(item.id);if(src&&Number.isFinite(src.sellPrice)&&src.sellPrice>=0)item.sellPrice=src.sellPrice;}}}
    else GAMEPLAY_SETTINGS=normalizeGameplaySettings(GAMEPLAY_SETTINGS);
  }catch(e){console.warn('販售／分解設定載入失敗，使用預設值',e);GAMEPLAY_SETTINGS=normalizeGameplaySettings(GAMEPLAY_SETTINGS);}

  const economyClone=v=>JSON.parse(JSON.stringify(v));
  function economySettings(){return GAMEPLAY_SETTINGS.economy;}
  function equipmentSellPrice(g){const q=Math.max(0,Math.min(3,gearQualityRank(g)));return Math.max(0,Math.round(Number(economySettings().equipmentSellPriceByQuality[q])||0));}
  function materialSellPrice(key){const e=economySettings(),row=(e.materialPrices||[]).find(x=>x.key===key);return Math.max(0,Math.round(Number(row?.sellPrice??e.materialDefaultSellPrice)||0));}
  function itemSellPrice(id){if(id==='__potion__')return Math.max(0,Math.round(Number(economySettings().potionSellPrice)||0));const item=SHOP.find(x=>x.id===id);return Math.max(0,Math.round(Number(item?.sellPrice)||0));}
  globalThis.equipmentSellPrice=equipmentSellPrice;globalThis.materialSellPrice=materialSellPrice;globalThis.itemSellPrice=itemSellPrice;

  function materialCount(key){if(key==='鍛鐵')return state.ore;if(key==='粉塵')return state.dust;return state.materials[key]||0;}
  function setMaterialCount(key,value){value=Math.max(0,Math.floor(value));if(key==='鍛鐵')state.ore=value;else if(key==='粉塵')state.dust=value;else state.materials[key]=value;}
  function economyResourceSnapshot(){return {gold:state.gold,ore:state.ore,dust:state.dust,potions:state.potions,materials:economyClone(state.materials),consumables:economyClone(state.consumables),gems:[...state.gems]};}
  function restoreEconomyResources(s){state.gold=s.gold;state.ore=s.ore;state.dust=s.dust;state.potions=s.potions;for(const k of Object.keys(state.materials))delete state.materials[k];Object.assign(state.materials,s.materials);for(const k of Object.keys(state.consumables))delete state.consumables[k];Object.assign(state.consumables,s.consumables);state.gems.splice(0,state.gems.length,...s.gems);}

  function salvageExtraRules(g){const q=gearQualityRank(g);return (GAMEPLAY_SETTINGS.equipment.salvage.extraRewards||[]).filter(r=>r.quality===q);}
  function grantEconomyReward(type,key,quantity){
    const n=Math.max(0,Math.floor(Number(quantity)||0));if(!n)return;
    if(type==='ore')state.ore+=n;
    else if(type==='dust')state.dust+=n;
    else if(type==='potion')state.potions+=n;
    else if(type==='material')state.materials[key]=(state.materials[key]||0)+n;
    else if(type==='item'){if(SHOP.some(x=>x.id===key))state.consumables[key]=(state.consumables[key]||0)+n;}
    else if(type==='gem'){for(let i=0;i<n;i++){const gi=key==='random'?rand(3):Number(key);if(Number.isInteger(gi)&&gi>=0&&gi<3)state.gems[gi]=(state.gems[gi]||0)+1;}}
  }
  function grantSalvageRewards(g,includeEnhance=true){const r=update12SalvageRewards(g,includeEnhance);state.ore+=r.ore;state.dust+=r.dust;for(const x of salvageExtraRules(g))grantEconomyReward(x.type,x.key,x.quantity);return r;}
  globalThis.grantSalvageRewards=grantSalvageRewards;

  salvage=function(id){
    const g=findGear(id);if(!g||g.locked||gearWearer(g.id)||inlineAffixDrafts.has(affixDraftKey(g)))return;
    const bag=state.bag,snap=economyResourceSnapshot();grantSalvageRewards(g,true);state.bag=state.bag.filter(x=>x.id!==id);pruneGearSelections();
    if(!save()){state.bag=bag;restoreEconomyResources(snap);return;}render();toast('已分解 '+equipmentDisplayName(g));
  };
  confirmMassSalvage=function(){
    if(!massSalvageIds)return;const items=massSalvageTargets(massSalvageIds),ids=new Set(items.map(g=>g.id)),bag=state.bag,snap=economyResourceSnapshot();
    for(const g of items)grantSalvageRewards(g,true);state.bag=state.bag.filter(g=>!ids.has(g.id));
    if(!save()){state.bag=bag;restoreEconomyResources(snap);return;}massSalvageIds=null;pruneGearSelections();closeModal();render();toast('已分解 '+items.length+' 件裝備');
  };
  salvageAll=function(){
    const targets=state.bag.filter(g=>gearQualityRank(g)===0&&(g.plus||0)===0&&!g.affix.length&&g.boss===undefined&&!state.equipped.includes(g.id)&&!g.locked),ids=new Set(targets.map(g=>g.id));for(const g of targets)grantSalvageRewards(g,false);state.bag=state.bag.filter(g=>!ids.has(g.id));pruneGearSelections();save();render();toast(`已分解 ${ids.size} 件未養成普通裝備`);
  };
  // Auto-salvage on a full inventory must use the same configurable output.
  const economyAddGearBase=addGear;
  addGear=function(g){
    if(!(typeof collectingBattleGear!=='undefined'&&collectingBattleGear)&&state.bag.length>=RULES.bagCapacity){g.rar=0;grantSalvageRewards(g,false);note('背包已滿，掉落裝備自動分解。');return;}
    return economyAddGearBase(g);
  };

  function canDisposeBagGear(g){return !!g&&!g.locked&&!gearWearer(g.id)&&!inlineAffixDrafts.has(affixDraftKey(g));}
  function sellGear(id){
    const g=findGear(id);if(!canDisposeBagGear(g))return toast('已穿戴、鎖定或待確認洗鍊的裝備不能販售');
    const price=equipmentSellPrice(g),bag=state.bag,gold=state.gold;state.gold+=price;state.bag=state.bag.filter(x=>x.id!==id);pruneGearSelections();
    if(!save()){state.bag=bag;state.gold=gold;return;}render();toast(`已販售 ${equipmentDisplayName(g)}，獲得 ${price} 金幣`);
  }
  function sellAllGearByQuality(q){
    const items=state.bag.filter(g=>gearQualityRank(g)===q&&canDisposeBagGear(g));if(!items.length)return toast('沒有可販售的'+QUALITY_NAMES[q]+'裝備');
    const ids=new Set(items.map(g=>g.id)),total=items.reduce((n,g)=>n+equipmentSellPrice(g),0);if(!confirm(`確定販售 ${items.length} 件${QUALITY_NAMES[q]}裝備，獲得 ${total} 金幣？\n已穿戴、鎖定與待確認洗鍊裝備不會販售。`))return;
    const bag=state.bag,gold=state.gold;state.bag=state.bag.filter(g=>!ids.has(g.id));state.gold+=total;pruneGearSelections();if(!save()){state.bag=bag;state.gold=gold;return;}render();toast(`已販售 ${items.length} 件裝備，獲得 ${total} 金幣`);
  }
  globalThis.sellGear=sellGear;globalThis.sellAllGearByQuality=sellAllGearByQuality;

  const economyInventoryGearDetailBase=inventoryGearDetail;
  inventoryGearDetail=function(g){
    let html=economyInventoryGearDetailBase(g);if(!g)return html;const disabled=!canDisposeBagGear(g)?' disabled':'';
    return html.replace('</div></section>\n    '+(inlineAffixComparison(g)||''),`<button class="sell-gear-button" onclick="sellGear('${g.id}')"${disabled}>販售 ${equipmentSellPrice(g)} 金幣</button></div></section>\n    ${inlineAffixComparison(g)}`);
  };
  const economyBulkSalvageBase=bulkSalvageControls;
  bulkSalvageControls=function(){return economyBulkSalvageBase()+`<div class="actions bulk-sell-actions">${QUALITY_NAMES.map((name,q)=>`<button onclick="sellAllGearByQuality(${q})">販售所有${name}</button>`).join('')}</div>`;};

  function pendingByQuality(q){return pendingGearLoot.filter(g=>gearQualityRank(g)===q);}
  function claimPendingQuality(q){
    const room=Math.max(0,RULES.bagCapacity-state.bag.length),group=pendingByQuality(q);if(!group.length)return toast('沒有'+QUALITY_NAMES[q]+'待領取裝備');if(!room)return toast('裝備背包已滿');
    const take=group.slice(0,room),ids=new Set(take.map(g=>g.id));state.bag.push(...take);pendingGearLoot=pendingGearLoot.filter(g=>!ids.has(g.id));save();render();toast(`已領取 ${take.length} 件${QUALITY_NAMES[q]}裝備${take.length<group.length?'；背包已滿':''}`);
  }
  function disposePendingQuality(q,mode){
    const group=pendingByQuality(q);if(!group.length)return toast('沒有'+QUALITY_NAMES[q]+'待領取裝備');
    const hasBoss=group.some(g=>g.boss!==undefined),verb=mode==='sell'?'販售':'分解',total=mode==='sell'?group.reduce((n,g)=>n+equipmentSellPrice(g),0):0;
    if((q>=2||hasBoss)&&!confirm(`確定${verb} ${group.length} 件${QUALITY_NAMES[q]}待領取裝備${mode==='sell'?`，獲得 ${total} 金幣`:''}？${hasBoss?'\n其中包含 BOSS 專屬裝備。':''}`))return;
    const snap=economyResourceSnapshot(),old=pendingGearLoot;try{if(mode==='sell')state.gold+=total;else for(const g of group)grantSalvageRewards(g,false);const ids=new Set(group.map(g=>g.id));pendingGearLoot=pendingGearLoot.filter(g=>!ids.has(g.id));if(!save())throw Error('儲存失敗');render();toast(`已${verb} ${group.length} 件${QUALITY_NAMES[q]}裝備${mode==='sell'?`，獲得 ${total} 金幣`:''}`);}catch(e){pendingGearLoot=old;restoreEconomyResources(snap);toast('操作失敗：'+e.message);}
  }
  globalThis.claimPendingQuality=claimPendingQuality;globalThis.salvagePendingQuality=q=>disposePendingQuality(q,'salvage');globalThis.sellPendingQuality=q=>disposePendingQuality(q,'sell');

  pendingGearLootView=function(){
    if(!pendingGearLoot.length)return `<section class="panel pending-gear-panel"><div class="row"><b>待結算裝備 0 件</b><span class="small">戰鬥掉落先存放於此，不會改變背包中的裝備順序。</span></div><p class="small">目前沒有待結算裝備。</p></section>`;
    const groups=QUALITY_NAMES.map((name,q)=>{const list=pendingByQuality(q),total=list.reduce((n,g)=>n+equipmentSellPrice(g),0);return `<section class="pending-quality-group effect-quality-${q}"><div class="row"><b>${name} ${list.length} 件</b><span class="small">${list.length?`販售 ${equipmentSellPrice(list[0])}／件`:'—'}</span></div><div class="small">${list.slice(0,3).map(g=>esc(equipmentDisplayName(g))).join('、')}${list.length>3?'…':''}</div><div class="actions"><button onclick="claimPendingQuality(${q})" ${list.length?'':'disabled'}>領取</button><button onclick="salvagePendingQuality(${q})" ${list.length?'':'disabled'}>分解</button><button onclick="sellPendingQuality(${q})" ${list.length?'':'disabled'}>販售${list.length?' '+total+'金':''}</button></div></section>`;}).join('');

    return {name:(kind==='elite'?'菁英・':'')+row.name,icon:'',mat:row.material,lv,hp,maxhp:hp,atk,def,kind,turn:0,monsterId:row.id,maxDrops:row.maxDrops,element:row.element,race:row.race,difficulty:mode,region:mi,bossChallenge:true,stageOrder:order};

  function clearEncounter(){foes=[];enemy=null;effects=[];actorCooldowns={};supportCooldowns={};if(typeof enemySkillCooldowns!=='undefined')enemySkillCooldowns={};round=0;for(const h of heroes())h.shield=0;}

  if(typeof spawnGroup==='function'){const base=spawnGroup;spawnGroup=function(){if(party?.bossChallenge?.active&&!isFinalMapIndex(party.map)&&spawnBossStage())return;return base();};}

    if(mc?.bossEnabled===false)return toast('此地圖的 BOSS 挑戰已停用');if(entry.charges<1)return toast('尚未累積 BOSS 挑戰次數');

  function completeAttempt(){

  function panel(mi){

  }
  if(typeof battleView==='function'){const base=battleView;battleView=function(){let html=base();if(!party||isFinalMapIndex(party.map))return html;const active=party.bossChallenge?.active&&party.bossChallenge.mapIndex===party.map;if(active){const total=configuredBossStageRows(party.map).reduce((n,x)=>n+x.count,0);html=html.replace(/群怪 · [^<]+/,`BOSS 關卡 · ${total} 隻`);}const p=panel(party.map),mark='<div class="text-battle-layout">';return html.includes(mark)?html.replace(mark,p+mark):p+html;};}

  if(typeof showRegionBestiary==='function'){
    const base=showRegionBestiary;
    showRegionBestiary=function(){
      if(!party||isFinalMapIndex(party.map))return base();const mi=party.map,m=MAPS[mi],mc=mapConfig(mi),cat=monsterCatalog(),normals=cat.filter(x=>x.mapIndex===mi&&x.kind==='normal'),stage=configuredBossStageRows(mi);
      const roaming=normals.filter(x=>x.enabled!==false).map(x=>`<p><b>${esc(x.name)}</b> · ${ELEMENTS[x.element]}／${RACES[x.race]}${x.eliteEnabled!==false?' · 可出現菁英':''}<br>專屬掉落：${esc(x.material)}</p>`).join('');
      const stageHtml=stage.map(x=>`<p><b>${esc(x.row.name)}</b> <span class="tag">${x.kind==='boss'?'BOSS':x.kind==='elite'?'菁英隨從':'普通隨從'}${x.count>1?' ×'+x.count:''}</span> · 隊列 ${x.order}<br>專屬掉落：${esc(x.row.material)}</p>`).join('');
      $('modal').innerHTML=`<h2>${esc(m.name)} · 怪物與掉落</h2><h3>一般探索</h3>${roaming||'<p class="small">沒有啟用中的普通怪物。</p>'}<h3>BOSS 關卡 ${mc?.bossEnabled===false?'<span class="tag">已停用</span>':''}</h3>${stageHtml}<button onclick="closeModal()">關閉</button>`;$('modal').showModal();
    };

  if(typeof exportableBalance==='function'){const base=exportableBalance;exportableBalance=function(){const out=base();out.notes=[...(out.notes||[]),'一般地圖不再隨機遭遇 BOSS；普通／菁英擊殺累積 monsters.bossMeter 進度，滿 progressPerCharge 後增加 1 次 BOSS 挑戰。','一般地圖 BOSS 關卡以 bossStageCount / bossStageElite / bossStageOrder 自訂隨從；BOSS 本體固定 1 隻並使用 bossStageOrder。'];return out;};}

  if(typeof guideView==='function'){

  try{

<link id="combat-contribution-meter-style" rel="stylesheet" href="css/combat-contribution.css">
<script id="combat-contribution-meter-system">
/* Persistent active-party contribution meter: damage, healing and shield absorption. */
(()=>{
  const BASE_KEY='emberwild-combat-contribution-v1';
  let cacheKey='',cache=null,selectedMetric='damage';

  function storageKey(){
    const root=party?.members?.[0];
    const id=Number.isFinite(Number(root?.created))?String(root.created):'default';
    return BASE_KEY+':'+id;
  }
  function activeSignature(){
    if(!party?.active)return '';
    return [...party.active].filter(Number.isInteger).sort((a,b)=>a-b).join(',');
  }
  function blankRow(){return {damage:0,healing:0,mitigation:0};}
  function blankState(signature=activeSignature()){
    const out={teamSignature:signature,byJob:{}};
    for(let job=0;job<CLASSES.length;job++)out.byJob[job]=blankRow();
    return out;
  }
  function normalize(raw){
    const signature=typeof raw?.teamSignature==='string'?raw.teamSignature:'';
    const out=blankState(signature),src=raw&&typeof raw==='object'&&raw.byJob&&typeof raw.byJob==='object'?raw.byJob:{};
    for(let job=0;job<CLASSES.length;job++){
      const row=src[job]||src[String(job)]||{},clean=blankRow();
      for(const key of ['damage','healing','mitigation']){
        const n=Number(row[key]);
        clean[key]=Number.isFinite(n)&&n>0?Math.min(1e15,n):0;
      }
      out.byJob[job]=clean;
    }
    return out;
  }
  function writeCache(){
    if(!party||!cache)return;
    try{localStorage.setItem(storageKey(),JSON.stringify(cache));}catch{}
  }
  function ensure(){
    const key=storageKey(),signature=activeSignature();
    if(!cache||cacheKey!==key){
      cacheKey=key;
      try{cache=normalize(JSON.parse(localStorage.getItem(key)||'null'));}catch{cache=blankState(signature);}
    }
    if(cache.teamSignature!==signature){
      cache=blankState(signature);
      writeCache();
    }
    return cache;
  }
  function persist(){
    if(!party)return;
    ensure();
    writeCache();
  }
  globalThis.recordCombatContribution=function(hero,key,amount){
    if(!party||!['damage','healing','mitigation'].includes(key))return;
    const job=typeof hero==='number'?hero:hero?.job,n=Number(amount);
    if(!Number.isInteger(job)||!party.active.includes(job)||!Number.isFinite(n)||n<=0)return;
    const stats=ensure(),row=stats.byJob[job]||(stats.byJob[job]=blankRow());
    row[key]=Math.min(1e15,(Number(row[key])||0)+n);
  };
  globalThis.resetCombatContribution=function(){
    if(!party)return;
    cache=blankState(activeSignature());cacheKey=storageKey();writeCache();save();render();
  };
  globalThis.setCombatContributionMetric=function(metric){
    if(!['damage','healing','mitigation'].includes(metric))return;
    selectedMetric=metric;
    render();
  };
  globalThis.recordRegenContribution=function(target,healed){
    const total=Number(healed);
    if(!party||!target||!party.active.includes(target.job)||!Number.isFinite(total)||total<=0)return;
    const rows=effects.filter(fx=>fx.target===heroKey(target)&&fx.kind==='regen'&&fx.until>partyClock&&Number(fx.value)>0);
    const weight=rows.reduce((sum,fx)=>sum+Number(fx.value),0);
    if(weight<=0)return;
    for(const fx of rows){
      const caster=party.members.find(h=>h.job===fx.source);
      if(caster&&party.active.includes(caster.job))recordCombatContribution(caster,'healing',total*Number(fx.value)/weight);
    }
  };
  globalThis.combatContributionPanel=function(){
    if(!party)return '';
    const stats=ensure(),fmt=n=>Math.round(Number(n)||0).toLocaleString('zh-TW');
    const labels={damage:'傷害',healing:'治療',mitigation:'減傷'};
    const active=party.active.map(job=>party.members.find(h=>h.job===job)).filter(Boolean);
    const values=active.map(h=>({h,value:Number(stats.byJob[h.job]?.[selectedMetric])||0}));
    const max=Math.max(0,...values.map(x=>x.value));
    const bars=values.map(({h,value})=>{
      const width=max>0?Math.max(value>0?2:0,Math.min(100,value/max*100)):0;
      return '<div class="combat-contribution-row">'+
        '<span class="combat-contribution-name" title="'+esc(characterName(h))+'">'+esc(characterName(h))+'</span>'+
        '<div class="combat-contribution-track" aria-label="'+esc(characterName(h))+' '+labels[selectedMetric]+' '+fmt(value)+'"><div class="combat-contribution-fill" style="width:'+width+'%"></div></div>'+
        '<span class="combat-contribution-value">'+fmt(value)+'</span></div>';
    }).join('');
    const tabs=['damage','healing','mitigation'].map(key=>'<button class="'+(selectedMetric===key?'active':'')+'" onclick="setCombatContributionMetric(\''+key+'\')">'+labels[key]+'</button>').join('');
    return '<div class="combat-contribution-meter"><div class="combat-contribution-head"><b>隊伍戰鬥統計</b><button onclick="resetCombatContribution()" title="將目前隊伍的累積統計歸零">重置</button></div>'+
      '<div class="combat-contribution-tabs">'+tabs+'</div>'+
      '<div class="combat-contribution-bars">'+bars+'</div>'+
      '<p class="small combat-contribution-note">僅統計目前出戰成員；更換出戰隊伍會自動重置。減傷只計護盾實際抵擋的傷害。</p></div>';
  };

  if(typeof save==='function'){
    const baseSave=save;
    save=function(show=false){persist();return baseSave(show);};
  }
  if(typeof newGame==='function'){
    const baseNewGame=newGame;
    newGame=function(){cache=null;cacheKey='';selectedMetric='damage';return baseNewGame();};
  }
})();
</script>

  `;

  const safeEsc=s=>typeof esc==='function'?esc(String(s)):String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  function tooltip(label,text){return `<button type="button" class="icon-help" title="${safeEsc(text)}" aria-label="${safeEsc(label+'：'+text)}">?</button>`;}

  function compactSupply(){
    const pc=Math.round(GS('quests.potion.buyCost',75)),pq=Math.round(GS('quests.potion.buyQuantity',5)),th=Math.round(GS('combat.autoPotionThreshold',.35)*10000)/100;
    return `<details><summary>隊伍補給</summary><div class="supply-list">${party.members.map(h=>`<div class="supply-row"><div class="supply-row-head"><b>${safeEsc(characterName(h))}</b><span class="small">藥水 ${h.potions}</span></div><div class="supply-actions"><button onclick="heroMenuAction(${h.job},()=>potion())" ${h.potions<1?'disabled':''}>喝藥</button><button onclick="heroMenuAction(${h.job},()=>buyPotion())" ${h.gold<pc?'disabled':''}>+${pq}／${pc}金</button><label title="生命低於 ${th}% 時自動使用治療藥水"><input type="checkbox" ${h.autoPotion?'checked':''} onchange="heroMenuAction(${h.job},()=>{state.autoPotion=this.checked;save()})">自動</label></div></div>`).join('')}</div></details>`;
  }

  function bossBlock(mi){
    if(isFinal(mi)){
      const rows=finalRows(mi),total=rows.reduce((n,x)=>n+(x.count||0),0)||1;
      return `<div class="boss-compact"><div class="boss-head"><b>終局關卡</b><span class="tag">${total} 隻</span></div><div class="boss-meta"><span>固定編成</span><span>${party?.bossChallenge?.active?'挑戰中':'直接由探索進入'}</span></div></div>`;
    }
    const cfg=mapCfg(mi),bm=GAMEPLAY_SETTINGS.monsters.bossMeter,entry=progressEntry(mi),enabled=cfg?.bossEnabled!==false,active=party?.bossChallenge?.active&&party.bossChallenge.mapIndex===mi,total=enabled?bossRows(mi).reduce((n,x)=>n+(x.count||0),0):0,pct=entry.charges>=bm.maxCharges?100:Math.max(0,Math.min(100,(Number(entry.progress)||0)/bm.progressPerCharge*100));
    return `<div class="boss-compact"><div class="boss-head"><b>${active?'BOSS 關卡':'BOSS 進度'}</b><span class="tag">${entry.charges}/${bm.maxCharges} 次</span></div><div class="boss-meter"><span style="width:${pct}%"></span></div><div class="boss-meta"><span>${fmt(entry.progress)}/${bm.progressPerCharge}%</span><span>普通 +${bm.normalProgress}%</span><span>菁英 ×${bm.eliteMultiplier}</span><span>${total} 隻／場</span></div><div class="boss-actions">${active?`<button class="danger" onclick="leaveBossChallenge()" title="離開會放棄目前已消耗的一次，剩餘次數保留。">離開關卡</button>`:`<button class="primary" onclick="startBossChallenge()" ${!enabled||entry.charges<1?'disabled':''} title="${enabled?'使用 1 次累積挑戰進入本地圖 BOSS 關卡。':'此地圖 BOSS 挑戰已停用。'}">挑戰 BOSS</button>`}${tooltip('BOSS 規則','普通與菁英怪擊殺會累積進度；進度滿後增加一次挑戰，次數用完會自動返回一般探索。')}</div></div>`;
  }

  function expeditionControlCard(){
    const mi=party.map,mode=party.difficulty||0;
    return `<section class="panel battle-map-column expedition-control-card"><div class="control-head"><div><span class="eyebrow">EXPEDITION CONTROL</span><h2>探索控制</h2></div>${tooltip('探索控制','地圖、難度與倍速共用此面板。切換地圖或難度會結束目前遭遇。介面中的「回合」是指該角色每次輪到自己行動一次；技能與治療藥水等冷卻只在該角色行動時遞減 1，不受戰鬥倍速影響。自動喝水在角色回合開始時判定，且不會取消原本的攻擊。')}</div><div class="control-grid"><label class="control-row"><span>地圖</span><select aria-label="探索地圖" onchange="chooseMap(Number(this.value))">${MAPS.map((m,i)=>`<option value="${i}" ${i===mi?'selected':''} ${canVisit(i)?'':'disabled'}>${safeEsc(m.name)} · LV${m.min}${isFinal(i)?' 終局':'–'+m.max}</option>`).join('')}</select><button onclick="showRegionBestiary()" title="查看目前區域怪物、BOSS 關卡與掉落">圖鑑</button></label><label class="control-row"><span>難度</span><select aria-label="探索難度" onchange="changeDifficulty(this.value)">${MODES.map((d,i)=>`<option value="${i}" ${i===mode?'selected':''}>${safeEsc(d.name)}</option>`).join('')}</select>${tooltip('難度','切換難度會結束目前遭遇；不會恢復生命。詳細倍率可在冒險指南查看。')}</label><div class="control-row"><span>倍速</span><button onclick="toggleBattleRate()" title="點擊循環切換可用戰鬥倍速">${battleRate}×</button>${tooltip('戰鬥節奏','倍速只影響等待時間，不改變回合制冷卻與行動順序。')}</div></div>${bossBlock(mi)}${compactSupply()}${combatContributionPanel()}</section>`;
  }

  if(typeof battleView==='function'){
    const compactBattleViewBase=battleView;
    battleView=function(){
      let html=compactBattleViewBase();
      if(!party)return html;
      /* Replace the existing right-side map list with the unified control card. */
      html=html.replace(/<section class="panel battle-map-column">[\s\S]*?<\/section>/,expeditionControlCard());
      /* In case an older wrapper failed to create that column, inject before the battle grid closes. */
      if(!html.includes('expedition-control-card')){
        const marker='</div><section class="panel battle-buffs">';
        if(html.includes(marker))html=html.replace(marker,expeditionControlCard()+marker);
        else html+=expeditionControlCard();
      }
      /* Keep combat rules available without occupying a separate row. */
      html=html.replace(/<p class="small combat-rule">[\s\S]*?<\/p>/,'');
      html=html.replace(/(<button class="primary" onclick="toggleBattle\(\)">[\s\S]*?<\/button>)/,`$1${tooltip('戰鬥規則','• 冷卻：技能與治療藥水等只在對應角色完成自己的行動時遞減 1，不受戰鬥倍速影響。\n• 自動攻擊：集中攻擊敵方隊列中第一名仍存活的敵人，擊倒後再依序切換下一名。\n• 遭遇結束：全隊生命回滿並清空護盾。\n• 技能冷卻：每次新遭遇開始時重置。')}`);
      return html;
    };
  }

  if(typeof sharedBattleJournal==='function'){
    sharedBattleJournal=function(){
      if(!party)return '';
      const paused=$('modal').open,alive=living().length,total=heroes().length,enemies=foes.filter(e=>e.hp>0).length,allEnemies=foes.length,lootKinds=expeditionLoot.items.size;
      return `<section id="globalBattleJournal" class="global-battle-journal" aria-label="全隊共通戰報"><div class="global-journal-head"><div class="journal-title-row"><h2>全隊戰報</h2><span class="tag">${running?(paused?'視窗暫停':'探索中'):'已暫停'} · ${battleRate}×</span></div><div class="journal-summary">${safeEsc(MAPS[party.map].name)} · ${safeEsc(MODES[party.difficulty||0].name)} · 隊員 ${alive}/${total} · 敵人 ${enemies}/${allEnemies}</div><div class="journal-actions"><button onclick="toggleBattle()">${running?'暫停':'開始'}</button>${tab==='battle'?'':`<button onclick="setTab('battle')">戰場</button>`}</div></div><div id="liveLog" role="log" aria-label="即時戰鬥紀錄">${logContent()}</div><div class="journal-resizer" title="拖曳調整戰報與累積戰利品高度" onpointerdown="startJournalResize(event)"></div><details class="journal-loot-compact" ${globalThis.journalLootOpen?'open':''} ontoggle="globalThis.journalLootOpen=this.open"><summary>累積戰利品 · 擊敗 ${expeditionLoot.kills} · ${lootKinds} 種</summary><div id="journalLootList" class="journal-loot-list">${[...expeditionLoot.items].map(([name,item])=>`<div class="journal-loot-row"><span class="loot-rarity-${item.rar??0}">${safeEsc(name)}</span><b>+${(item.count??item).toLocaleString()}</b></div>`).join('')||'<p class="small">尚無戰利品。</p>'}</div></details></section>`;
    };
  }

  if(typeof render==='function'&&typeof party!=='undefined'&&party)render();
})();
</script>

  const rowsHtml=()=>typeof battleBuffRows==='function'?battleBuffRows():'';
  function effectCount(){

    modal.showModal();
  };
  if(typeof battleBuffPanel==='function'){
    battleBuffPanel=function(){
      return `<section class="panel battle-buffs battle-effects-bar"><div class="effects-bar-inner"><b>生效效果</b><span id="battle-effect-summary" class="effects-summary">${effectSummaryText()}</span><button onclick="showBattleEffects()" title="查看目前 BUFF、DEBUFF、護盾與消耗品效果">查看</button></div></section>`;
    };
  }
  refreshBattleBuffTimers=function(){
    if(!party)return;
    const summary=$('battle-effect-summary');if(summary)summary.textContent=effectSummaryText();
    const body=$('battle-effect-modal-rows');if(body)body.innerHTML=rowsHtml();

    if(document.querySelectorAll)for(const el of document.querySelectorAll('.supply-countdown')){const hero=party.members.find(h=>h.job===Number(el.dataset.job));if(hero)el.textContent=supplyStatus(hero);}

  if(typeof battleView==='function'){
