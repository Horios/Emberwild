<script id="battle-statistics-system">
/* Persistent per-map battle statistics. One battle = one completed group encounter. */
const BATTLE_STATS_LIMIT=300;
const BATTLE_STATS_STORAGE_KEY='emberwild-battle-statistics-v1';
let activeBattleStat=null;
let statsRewardingKill=false;

function normalizeBattleStatistics(raw){
  const out={maps:{}};
  const maps=raw&&typeof raw==='object'&&raw.maps&&typeof raw.maps==='object'?raw.maps:{};
  for(let mi=0;mi<MAPS.length;mi++){
    const src=Array.isArray(maps[mi])?maps[mi]:Array.isArray(maps[String(mi)])?maps[String(mi)]:[];
    const rows=[];
    for(const r of src.slice(-BATTLE_STATS_LIMIT)){
      if(!r||typeof r!=='object')continue;
      const deaths=Array.isArray(r.deaths)?r.deaths.slice(0,8).flatMap(d=>{
        if(!d||!Number.isInteger(d.job)||d.job<0||d.job>=CLASSES.length)return [];
        return [{job:d.job,name:String(d.name||CLASSES[d.job].name).slice(0,60),cause:String(d.cause||'未知').slice(0,160)}];
      }):[];
      const drops={};
      if(r.drops&&typeof r.drops==='object'&&!Array.isArray(r.drops))for(const [name,n] of Object.entries(r.drops).slice(0,600)){
        const v=Math.max(0,Math.min(1e9,Math.floor(Number(n)||0)));if(v)drops[String(name).slice(0,120)]=v;
      }
      rows.push({time:Number.isFinite(r.time)?Math.max(0,Math.floor(r.time)):0,difficulty:[0,1,2].includes(r.difficulty)?r.difficulty:0,result:r.result==='wipe'?'wipe':'victory',xp:Math.max(0,Math.min(1e12,Math.floor(Number(r.xp)||0))),drops,deaths});
    }
    if(rows.length)out.maps[mi]=rows;
  }
  return out;
}
function ensureBattleStatistics(){
  if(!party)return {maps:{}};
  party.battleStatistics=normalizeBattleStatistics(party.battleStatistics);
  return party.battleStatistics;
}
function currentMapBattleRecords(){
  const stats=ensureBattleStatistics();
  return stats.maps[party.map]||(stats.maps[party.map]=[]);
}
function beginBattleStatistics(){
  if(!party)return;
  activeBattleStat={map:party.map,difficulty:party.difficulty||0,time:Date.now(),xp:0,drops:{},deaths:[],pendingOutcome:null};
}
function addBattleStatDrop(name,count=1){
  if(!activeBattleStat||activeBattleStat.map!==party?.map)return;
  const n=Math.floor(Number(count)||0);if(n<=0||!name||name==='金幣')return;
  activeBattleStat.drops[name]=(activeBattleStat.drops[name]||0)+n;
}
function recordBattleDeath(h,e,cause){
  if(!activeBattleStat||!h||!e)return;
  activeBattleStat.deaths.push({job:h.job,name:characterName(h),cause:`${e.name}－${cause}`});
  if(!living().length)activeBattleStat.pendingOutcome='wipe';
}
function finalizeBattleStatistics(result){
  if(!activeBattleStat||!party)return;
  const rec={time:activeBattleStat.time,difficulty:activeBattleStat.difficulty,result:result==='wipe'?'wipe':'victory',xp:Math.max(0,Math.floor(activeBattleStat.xp||0)),drops:{...activeBattleStat.drops},deaths:activeBattleStat.deaths.map(x=>({...x}))};
  const map=activeBattleStat.map,stats=ensureBattleStatistics(),rows=stats.maps[map]||(stats.maps[map]=[]);
  rows.push(rec);if(rows.length>BATTLE_STATS_LIMIT)rows.splice(0,rows.length-BATTLE_STATS_LIMIT);
  activeBattleStat=null;
  save();
  if(tab==='statistics')render();
}
function battleDeathMoveName(e){
  if(e?.kind!=='final')return '普通攻擊';
  const fb=GAMEPLAY_SETTINGS.combat.finalBoss,turn=e.turn||0;
  if(turn>fb.enrageAfterTurn)return '狂暴攻擊';
  if(turn%Math.max(1,Math.round(fb.specialEveryTurns))===0)return '日蝕打擊';
  return '普通攻擊';
}
function battleStatLootSnapshot(){
  const h=party?.members?.[0];
  if(!h)return null;
  return {ore:h.ore,dust:h.dust,potions:h.potions,gems:[...h.gems],materials:{...h.materials}};
}
function collectBattleStatLootDiff(before,after){
  if(!before||!after)return;
  addBattleStatDrop('鍛鐵',after.ore-before.ore);addBattleStatDrop('寶石粉塵',after.dust-before.dust);addBattleStatDrop('治療藥水',after.potions-before.potions);
  after.gems.forEach((n,i)=>addBattleStatDrop(GEMS[i].name,n-before.gems[i]));
  for(const [name,n] of Object.entries(after.materials))addBattleStatDrop(name,n-(before.materials[name]||0));
}

const battleStatsCreatePartyBase=createParty;
createParty=function(hero){const p=battleStatsCreatePartyBase(hero);p.battleStatistics={maps:{}};return p;};
const battleStatsValidatePartyBase=validateParty;
validateParty=function(data){const p=battleStatsValidatePartyBase(data);p.battleStatistics=normalizeBattleStatistics(data?.battleStatistics);return p;};
const battleStatsPackPartyBase=packParty;
packParty=function(){const out=battleStatsPackPartyBase();if(party)out.battleStatistics=normalizeBattleStatistics(party.battleStatistics);return out;};
const battleStatsSaveBase=save;
save=function(show=false){if(!saveReady)return;if(party){try{localStorage.setItem(BATTLE_STATS_STORAGE_KEY,JSON.stringify(normalizeBattleStatistics(party.battleStatistics)));}catch{}}return battleStatsSaveBase(show);};
const battleStatsNewGameBase=newGame;
newGame=function(){try{localStorage.removeItem(BATTLE_STATS_STORAGE_KEY);}catch{}activeBattleStat=null;return battleStatsNewGameBase();};
const battleStatsResetEncounterBase=resetEncounter;
resetEncounter=function(){activeBattleStat=null;return battleStatsResetEncounterBase();};
const battleStatsSpawnGroupBase=spawnGroup;
spawnGroup=function(){const r=battleStatsSpawnGroupBase();beginBattleStatistics();return r;};
const battleStatsAwardXPBase=awardXP;
awardXP=function(amount){if(statsRewardingKill&&activeBattleStat)activeBattleStat.xp+=Math.max(0,Math.floor(Number(amount)||0));return battleStatsAwardXPBase(amount);};
const battleStatsAddGearBase=addGear;
addGear=function(g){if(statsRewardingKill&&activeBattleStat)addBattleStatDrop(equipmentDisplayName(g),1);return battleStatsAddGearBase(g);};
const battleStatsRewardGroupKillBase=rewardGroupKill;
rewardGroupKill=function(e){if(e?.rewarded)return;const before=battleStatLootSnapshot();statsRewardingKill=true;try{return battleStatsRewardGroupKillBase(e);}finally{statsRewardingKill=false;collectBattleStatLootDiff(before,battleStatLootSnapshot());}};
const battleStatsEnemyBasicBase=performEnemyBasic;
performEnemyBasic=function(e){const before=new Map(heroes().map(h=>[h.job,h.hp]));const r=battleStatsEnemyBasicBase(e);for(const h of heroes())if((before.get(h.job)||0)>0&&h.hp<=0)recordBattleDeath(h,e,battleDeathMoveName(e));return r;};
const battleStatsPacedRoundBase=pacedRound;
pacedRound=function*(){yield* battleStatsPacedRoundBase();if(!activeBattleStat)return;if(activeBattleStat.pendingOutcome==='wipe')finalizeBattleStatistics('wipe');else if(foes.length&&foes.every(e=>e.hp<=0))finalizeBattleStatistics('victory');};

function aggregateCurrentMapStatistics(){
  const records=currentMapBattleRecords(),drops=new Map(),memberData=new Map();let xp=0,wipes=0,deaths=0;
  for(const h of party.members)memberData.set(h.job,{count:0,recent:[]});
  for(const r of records){xp+=r.xp||0;if(r.result==='wipe')wipes++;for(const [name,n] of Object.entries(r.drops||{}))drops.set(name,(drops.get(name)||0)+n);deaths+=(r.deaths||[]).length;for(const d of r.deaths||[]){if(!memberData.has(d.job))memberData.set(d.job,{count:0,recent:[]});memberData.get(d.job).count++;}}
  for(let i=records.length-1;i>=0;i--)for(let j=(records[i].deaths||[]).length-1;j>=0;j--){const d=records[i].deaths[j],m=memberData.get(d.job);if(m&&m.recent.length<5)m.recent.push(d.cause);}
  return {records,xp,wipes,deaths,drops:[...drops.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'zh-Hant')),memberData};
}
function statisticsView(){
  const a=aggregateCurrentMapStatistics(),m=MAPS[party.map];
  const difficultyCounts=[0,1,2].map(i=>a.records.filter(r=>r.difficulty===i).length);
  return heading('STATISTICS / 戰鬥統計',m.name,`<span class="tag">最近 ${a.records.length} / ${BATTLE_STATS_LIMIT} 場</span>`)+
  `<section class="statistics-summary">
    <article class="card"><span class="statistics-number">${a.records.length.toLocaleString()}</span><span class="statistics-label">已完成戰鬥</span></article>
    <article class="card"><span class="statistics-number">${a.xp.toLocaleString()}</span><span class="statistics-label">總獲得經驗</span></article>
    <article class="card"><span class="statistics-number">${a.wipes.toLocaleString()}</span><span class="statistics-label">總全滅次數</span></article>
    <article class="card"><span class="statistics-number">${a.deaths.toLocaleString()}</span><span class="statistics-label">總死亡次數</span></article>
  </section><p class="small">統計只計算在此地圖完成的群怪遭遇；中途換圖、換隊員或切換難度不計場次。模式場次：${MODES.map((d,i)=>`${d.name} ${difficultyCounts[i]}`).join(' ／ ')}</p>
  <div class="statistics-layout"><section class="panel"><h2>掉落道具</h2><div class="statistics-loot-list">${a.drops.length?a.drops.map(([name,n])=>`<div class="statistics-loot-row"><span>${esc(name)}</span><b>×${n.toLocaleString()}</b></div>`).join(''):'<p class="statistics-empty">最近的戰鬥尚無掉落紀錄。</p>'}</div></section>
  <section class="panel"><h2>隊員死亡統計</h2><div class="statistics-members">${party.members.map(h=>{const d=a.memberData.get(h.job)||{count:0,recent:[]};return `<article class="statistics-member"><h3><span>${esc(characterName(h))}</span><span class="tag">死亡 ${d.count}</span></h3>${d.recent.length?`<ol class="statistics-deaths">${d.recent.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:'<p class="statistics-empty">最近 300 場內沒有死亡紀錄。</p>'}</article>`;}).join('')}</div><p class="small">每名隊員最多顯示最近 5 次直接致死來源，格式為「怪物名稱－招式名稱」。</p></section></div>`;
}
function ensureStatisticsNavButton(){
  const nav=document.querySelector('#app nav');if(!nav)return;
  let btn=nav.querySelector('[data-statistics-tab]');
  if(!btn){btn=document.createElement('button');btn.dataset.statisticsTab='1';btn.textContent='統計';btn.onclick=()=>setTab('statistics');nav.appendChild(btn);}
  if(tab==='statistics'){nav.querySelectorAll('button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');}else btn.classList.remove('active');
}
const battleStatisticsRenderBase=render;
render=function(){
  if(state&&party&&tab==='statistics'){
    tab='battle';battleStatisticsRenderBase();tab='statistics';
    const main=document.querySelector('#app .layout>main');if(main)main.innerHTML=statisticsView();
    ensureStatisticsNavButton();return;
  }
  battleStatisticsRenderBase();ensureStatisticsNavButton();
};
if(state&&party){
  try{const raw=localStorage.getItem(BATTLE_STATS_STORAGE_KEY);if(raw)party.battleStatistics=normalizeBattleStatistics(JSON.parse(raw));}catch{party.battleStatistics={maps:{}};}
  ensureBattleStatistics();save();render();
}
</script>

<script id="action-turn-cooldown-enemy-skills">
GAME_BALANCE_DEFAULTS.affixes.extendedValues.allCooldownReduction ??= {normal:0,fine:0,rare:1,legendary:2};
GAME_BALANCE=normalizeRuntimeBalance(GAME_BALANCE);
GAMEPLAY_SETTINGS_DEFAULTS.monsters.skillSystem ??= {assignChance:{normal:.30,elite:.65,boss:1,final:1}};
GAMEPLAY_SETTINGS_DEFAULTS.monsters.skills ??= [
  {id:'heavy_strike',name:'沉重打擊',enabled:true,weight:1,minLevel:1,kind:'all',race:'all',power:1.35,cooldownMin:2,cooldownMax:4,element:'inherit',target:'random'},
  {id:'feral_rush',name:'狂野突進',enabled:true,weight:.8,minLevel:8,kind:'elite',race:'all',power:1.55,cooldownMin:3,cooldownMax:5,element:'inherit',target:'weakest'},
  {id:'boss_crush',name:'首領重壓',enabled:true,weight:1,minLevel:1,kind:'boss',race:'all',power:1.7,cooldownMin:3,cooldownMax:5,element:'inherit',target:'random'}
];
mergeGameplayShape=function mergeGameplayShapeActionTurns(def,src,path=''){
  if(Array.isArray(def)){
    if(path==='monsters.skills'){
      if(!Array.isArray(src))return cloneGameplaySettings(def);
      if(!def.length)return cloneGameplaySettings(src);
      const template=def[0];
      return src.map((v,i)=>mergeGameplayShapeActionTurns(def[i]===undefined?template:def[i],v,path+'.'+i));
    }
    return def.map((v,i)=>mergeGameplayShapeActionTurns(v,Array.isArray(src)?src[i]:undefined,path?path+'.'+i:String(i)));
  }
  if(def&&typeof def==='object'){const out={};for(const k of Object.keys(def)){const next=path?path+'.'+k:k;out[k]=mergeGameplayShapeActionTurns(def[k],src&&typeof src==='object'?src[k]:undefined,next);}return out;}
  if(typeof def==='number')return typeof src==='number'&&Number.isFinite(src)?src:def;
  return typeof src===typeof def?src:def;
};
const actionTurnValidateGameplayBase=validateGameplaySettings;
validateGameplaySettings=function(cfg){
  cfg=actionTurnValidateGameplayBase(cfg);
  const allowedKind=new Set(['all','normal','elite','boss','final']),allowedRace=new Set(['all',...Object.keys(RACES)]),allowedElement=new Set(['inherit',...Object.keys(ELEMENTS)]),allowedTarget=new Set(['random','weakest']);
  const chances=cfg.monsters.skillSystem?.assignChance||{};
  for(const k of ['normal','elite','boss','final'])if(!Number.isFinite(chances[k])||chances[k]<0||chances[k]>1)throw Error('敵人技能配置機率需介於 0~1：'+k);
  if(!Array.isArray(cfg.monsters.skills))throw Error('敵人技能必須是陣列');
  const ids=new Set();
  for(const [i,sk] of cfg.monsters.skills.entries()){
    if(!sk||typeof sk.id!=='string'||!sk.id.trim()||ids.has(sk.id))throw Error('敵人技能 ID 無效或重複：'+i);ids.add(sk.id);
    if(typeof sk.name!=='string'||!sk.name.trim()||typeof sk.enabled!=='boolean'||!Number.isFinite(sk.weight)||sk.weight<=0||!Number.isFinite(sk.minLevel)||sk.minLevel<1||!Number.isFinite(sk.power)||sk.power<0||!Number.isFinite(sk.cooldownMin)||!Number.isFinite(sk.cooldownMax)||sk.cooldownMin<0||sk.cooldownMax<sk.cooldownMin||!allowedKind.has(sk.kind)||!allowedRace.has(sk.race)||!allowedElement.has(sk.element)||!allowedTarget.has(sk.target))throw Error('敵人技能資料無效：'+(sk.id||i));
    sk.minLevel=Math.max(1,Math.floor(sk.minLevel));sk.cooldownMin=Math.max(0,Math.floor(sk.cooldownMin));sk.cooldownMax=Math.max(sk.cooldownMin,Math.floor(sk.cooldownMax));
  }
  return cfg;

const UI_TEXT_DEFAULTS={"browserTitle":"餘燼荒野 · Emberwild","gameTitle":"餘燼荒野","gameSubtitle":"EMBERWILD / IDLE RPG · 4.0","chapterTitle":"遠征者手札","chapterSubtitle":"純文字遠征手札","homeEyebrow":"EMBERWILD · 選擇你的遠征者","homeTitle":"向荒野出發。","homeDescription":"一場沒有主線束縛的遠征。探索、收集、雕琢你的技能。\nLV{{beforeClearLevel}} 挑戰 {{finalBossLevel}} 級噬日者，通關後解鎖 LV{{afterClearLevel}} 與覺醒地圖。","homeFooter":"自動存檔 · 無離線戰鬥"};
let UI_TEXT=structuredClone(UI_TEXT_DEFAULTS);
function normalizeUIText(input){
  const src=input&&typeof input==='object'&&!Array.isArray(input)?input:{};
  const out={};
  for(const [key,def] of Object.entries(UI_TEXT_DEFAULTS)){
    const value=src[key]===undefined?def:src[key];
    if(typeof value!=='string')throw Error('介面文字 '+key+' 必須是文字');
    if(value.length>4000)throw Error('介面文字 '+key+' 過長（最多 4000 字元）');
    out[key]=value;
  }
  return out;
}
function resolveUIText(value){
  const g=globalThis.__EMBERWILD_GAMEPLAY_SETTINGS||GAMEPLAY_SETTINGS||{};
  const values={
    beforeClearLevel:g.progression?.levelCaps?.beforeClear??30,
    afterClearLevel:g.progression?.levelCaps?.afterClear??60,
    finalBossLevel:g.monsters?.finalBoss?.level??40,
    advanceLevel:g.progression?.advance?.level??15
  };
  return String(value??'').replace(/\{\{\s*(beforeClearLevel|afterClearLevel|finalBossLevel|advanceLevel)\s*\}\}/g,(_,key)=>String(values[key]));
}
function applyUITextDOM(){
  document.title=resolveUIText(UI_TEXT.browserTitle);
  const brandSpan=document.querySelector('header .brand span');
  if(brandSpan){
    let textNode=[...brandSpan.childNodes].find(n=>n.nodeType===Node.TEXT_NODE);
    if(!textNode){textNode=document.createTextNode('');brandSpan.prepend(textNode);}
    textNode.nodeValue=resolveUIText(UI_TEXT.gameTitle);
    const small=brandSpan.querySelector('small');if(small)small.textContent=resolveUIText(UI_TEXT.gameSubtitle);
  }
  const chapter=document.querySelector('header .chapter');
  if(chapter){
    let textNode=[...chapter.childNodes].find(n=>n.nodeType===Node.TEXT_NODE);
    if(!textNode){textNode=document.createTextNode('');chapter.prepend(textNode);}
    textNode.nodeValue=resolveUIText(UI_TEXT.chapterTitle)+' ';
    const b=chapter.querySelector('b');if(b)b.textContent=resolveUIText(UI_TEXT.chapterSubtitle);
  }
  const start=document.querySelector('#app .start');
  if(start){
    const eyebrow=start.querySelector(':scope > .eyebrow');if(eyebrow)eyebrow.textContent=resolveUIText(UI_TEXT.homeEyebrow);
    const h1=start.querySelector(':scope > h1');if(h1)h1.textContent=resolveUIText(UI_TEXT.homeTitle);
    const desc=start.querySelector(':scope > p:not(.small)');if(desc){desc.textContent=resolveUIText(UI_TEXT.homeDescription);desc.style.whiteSpace='pre-line';}
    const footer=[...start.querySelectorAll(':scope > p.small')].at(-1);if(footer)footer.textContent=resolveUIText(UI_TEXT.homeFooter);
  }
}
const uiTextRenderBase=render;
render=function(){const out=uiTextRenderBase();applyUITextDOM();return out;};
const uiTextExportBase=exportableBalance;
exportableBalance=function(){const out=uiTextExportBase();out.uiText=structuredClone(UI_TEXT);return out;};
const uiTextValidateBase=validateBalanceConfig;
validateBalanceConfig=function(input){
  const copy=JSON.parse(JSON.stringify(input));copy.uiText=normalizeUIText(copy.uiText);
  const out=uiTextValidateBase(copy);out.uiText=copy.uiText;return out;
};
const uiTextApplyBase=applyBalanceConfig;
applyBalanceConfig=function(input,{persist=true}={}){
  const copy=JSON.parse(JSON.stringify(input));copy.uiText=normalizeUIText(copy.uiText);
  const nextText=structuredClone(copy.uiText);
  const result=uiTextApplyBase(copy,{persist:false});
  UI_TEXT=nextText;
  if(persist)localStorage.setItem(BALANCE_KEY,JSON.stringify(exportableBalance()));
  render();
  return result;
};
const uiTextResetBase=resetBalanceJSON;
resetBalanceJSON=function(){const out=uiTextResetBase();UI_TEXT=structuredClone(UI_TEXT_DEFAULTS);render();return out;};
try{
  const saved=localStorage.getItem(BALANCE_KEY);
  if(saved){const parsed=JSON.parse(saved);UI_TEXT=normalizeUIText(parsed.uiText);}
}catch(e){console.warn('介面文字載入失敗，改用預設文字',e);UI_TEXT=structuredClone(UI_TEXT_DEFAULTS);}

// Compact master-detail equipment inventory. Keep the existing filters and
// equipment actions, but show a dense selectable list at left and one detailed
// equipment pane at right.
let inventorySelectedGearId=null;
let inventorySortKey='quality';
let inventorySortDirection='desc';
function selectInventoryGear(id){inventorySelectedGearId=id;render();}
function inventorySortValue(g,key){
  if(key==='quality')return gearQualityRank(g);
  if(key==='plus')return Number(g.plus)||0;
  if(key==='job')return g.slot===1?-1:(Number(g.job)||0);
  return 0;
}
function sortedFilteredGear(){
  const items=[...filteredGear()];
  items.sort((a,b)=>{
    let diff=0;
    if(inventorySortKey==='job'){
      diff=inventorySortValue(a,'job')-inventorySortValue(b,'job');
      if(diff!==0)return inventorySortDirection==='asc'?diff:-diff;
      const slotDiff=(Number(a.slot)||0)-(Number(b.slot)||0);
      if(slotDiff!==0)return inventorySortDirection==='asc'?slotDiff:-slotDiff;
    }else{
      diff=inventorySortValue(a,inventorySortKey)-inventorySortValue(b,inventorySortKey);
      if(diff!==0)return inventorySortDirection==='asc'?diff:-diff;
    }
    const qualityDiff=gearQualityRank(b)-gearQualityRank(a);if(qualityDiff)return qualityDiff;
    const plusDiff=(Number(b.plus)||0)-(Number(a.plus)||0);if(plusDiff)return plusDiff;
    const tierDiff=(Number(b.tier)||0)-(Number(a.tier)||0);if(tierDiff)return tierDiff;
    return equipmentDisplayName(a).localeCompare(equipmentDisplayName(b),'zh-Hant');
  });
  return items;
}
function inventorySortControls(){
  const options=[['quality','稀有度'],['plus','強化度'],['job','職業']];
  return '<div class="inventory-sortbar"><label>排序 <select onchange="setInventorySort(this.value)">'+
    options.map(([value,label])=>'<option value="'+value+'" '+(inventorySortKey===value?'selected':'')+'>'+label+'</option>').join('')+
    '</select></label><button type="button" onclick="toggleInventorySortDirection()">'+(inventorySortDirection==='desc'?'高 → 低':'低 → 高')+'</button></div>';
}
globalThis.setInventorySort=function(key){
  if(!['quality','plus','job'].includes(key))return;
  inventorySortKey=key;render();
};
globalThis.toggleInventorySortDirection=function(){
  inventorySortDirection=inventorySortDirection==='desc'?'asc':'desc';render();
};
function inventoryGearListItem(g,selected){

  return `<button type="button" class="inventory-list-item ${selected?'selected':''}" onclick="selectInventoryGear('${g.id}')" title="${esc(equipmentDisplayName(g))}">
    <span class="inventory-list-name">${equipmentNameHTML(g)}</span>
    <span class="inventory-list-meta">${gearWearableJobsText(g)} · ${CLASS_GEAR[g.job][g.slot]} · LV ${gearRequiredLevelByTier(g.tier)}${worn?' · '+esc(characterName(wearer))+'已穿戴':''}${locked?' · 已鎖定':''}</span>
    <span class="inventory-list-quality effect-quality-${gearQualityRank(g)}">${qualityTag(g)}</span>
  </button>`;
}
function inventoryGearDetail(g){
  if(!g)return `<div class="inventory-detail-empty"><b>沒有可顯示的裝備</b><p class="small">調整左側篩選條件後選擇裝備。</p></div>`;
  const wearer=gearWearer(g.id),worn=!!wearer,draft=inlineAffixDrafts.has(affixDraftKey(g)),locked=!!g.locked;
  const wearButtons=eligibleWearers(g).map(h=>`<button class="primary" onclick="previewEquip('${g.id}',${h.job})" ${h.equipped.includes(g.id)?'disabled':''}>${h.equipped.includes(g.id)?esc(characterName(h))+'已穿戴':'給 '+esc(characterName(h))+' 穿戴'}</button>`).join('');
  return `<div class="inventory-detail-pane">
    <div class="inventory-detail-heading">
      <div><div class="eyebrow">EQUIPMENT DETAIL / 裝備詳細</div><h2>${equipmentNameHTML(g)}</h2></div>
      <span class="tag">${qualityTag(g)}${locked?' · 已鎖定':''}</span>
    </div>
    <div class="inventory-detail-meta">${gearWearableJobsText(g)} · ${CLASS_GEAR[g.job][g.slot]} · LV ${gearRequiredLevelByTier(g.tier)}${worn?' · 目前由 '+esc(characterName(wearer))+' 穿戴':''}</div>
    <section class="inventory-detail-section"><h3>裝備能力</h3><p class="inventory-detail-stats equipment-total-summary">${globalThis.equipmentTotalSummaryText(g)}</p>${globalThis.equipmentAttributeDetailsHTML(g)}</section>
    <section class="inventory-detail-section"><h3>操作</h3><div class="actions inventory-detail-actions">${wearButtons||'<span class="small">尚無可穿戴角色</span>'}<button onclick="enhance('${g.id}')" ${g.plus>=RULES.enhanceMax||!canEnhance(g)?'disabled':''}>${g.plus>=RULES.enhanceMax?'已達 +'+RULES.enhanceMax:'強化 +'+(g.plus+1)+'／'+upgradeCostText(g)}</button><button onclick="reroll('${g.id}')" ${(()=>{const c=rerollCostFor(g);return draft||state.gold<c.gold||state.ore<c.ore;})()?'disabled':''}>洗鍊／${rerollCostFor(g).gold} 金幣＋${rerollCostFor(g).ore} 鍛鐵</button><button onclick="toggleGearLock('${g.id}')">${locked?'解除鎖定':'鎖定'}</button><button class="danger" onclick="salvage('${g.id}')" ${worn||draft||locked?'disabled':''}>分解</button></div></section>
    ${inlineAffixComparison(g)}
  </div>`;
}
inlineInventoryView=function(){
  const items=sortedFilteredGear();
  if(items.length && !items.some(g=>g.id===inventorySelectedGearId))inventorySelectedGearId=items[0].id;
  if(!items.length)inventorySelectedGearId=null;
  const selected=items.find(g=>g.id===inventorySelectedGearId)||null;
  return `<section class="panel compact-inventory-panel">${resourceLine()}${gearFilters()}${inventorySortControls()}${bulkSalvageControls()}
    <div class="inventory-master-detail">
      <section class="inventory-master-pane">
        <div class="inventory-master-heading"><b>裝備列表</b><span class="small">顯示 ${items.length} 件</span></div>
        <div class="inline-equipment-list inventory-list-scroll">${items.map(g=>inventoryGearListItem(g,g===selected)).join('')||'<p class="inventory-list-empty">沒有符合篩選的裝備。</p>'}</div>
      </section>
      <section class="inventory-detail-wrap">${inventoryGearDetail(selected)}</section>
    </div>
  </section>`;
};

// Update 18: final gameplay integration fixes.
// Later reward/combat wrappers had replaced the pending-loot wrapper and the
// defeat branch stopped exploration. Keep these behaviors attached to the final
// installed functions so future view-only overrides do not bypass them.
(function installFinalGameplayIntegrationFixes(){
  // Update 12 redefined initial() after the party-system wrapper, which left
  // newly recruited heroes without supportLevels/supportSlots. Re-attach the
  // party initializer to the final character factory.
  if(typeof initial==='function'&&typeof initHero==='function'){
    const finalInitialBase=initial;
    initial=function(job){const h=initHero(finalInitialBase(job));if(typeof syncHeroSkillArrays==='function')syncHeroSkillArrays(h);return h;};
  }

  if(typeof rewardGroupKill==='function'){
    const finalPendingRewardBase=rewardGroupKill;
    rewardGroupKill=function(e){
      if(e?.rewarded)return;
      const previous=collectingBattleGear;
      collectingBattleGear=true;
      try{return finalPendingRewardBase(e);}
      finally{collectingBattleGear=previous;}
    };
  }

  if(typeof pacedRound==='function'){
    const finalAutoRetryPacedRoundBase=pacedRound;
    pacedRound=function*(){
      const startedRunning=!!running;
      yield* finalAutoRetryPacedRoundBase();
      // A wipe is the only normal round outcome that clears foes/enemy after
      // starting in the running state. Final-boss victory keeps the defeated
      // foe list, while a manual pause does not clear the encounter.
      if(startedRunning&&party&&!running&&!foes.length&&!enemy&&living().length){
        running=true;
        note('全隊恢復後，自動重新挑戰目前區域。');
        save();
        if(tab==='battle'||!isEditingControl())render();
        else refreshGlobalJournal();
      }
    };
  }

  if(typeof resetSession==='function'){
    const finalPendingResetSessionBase=resetSession;
    resetSession=function(){
      const result=finalPendingResetSessionBase();
      pendingGearLoot=[];
      collectingBattleGear=false;
      if(typeof inventorySelectedGearId!=='undefined')inventorySelectedGearId=null;
      // resetSession() still came from the legacy filter model. Always restore
      // the current inventory filter schema so a new game/import does not
      // silently hide BOSS equipment.
      filters={slot:'all',job:'all',boss:'all',effectRank:'all'};
      return result;
    };
  }
})();

// Update 19: full functional-audit consistency fixes.
// These patches keep persisted state, configurable rules and player-facing text
// aligned with the final functions installed by all earlier update layers.
(function installFullFunctionalAuditFixes(){
  function clonePlain(value){return JSON.parse(JSON.stringify(value));}
  function clampQualityRank(value){return Math.max(0,Math.min(3,Math.round(Number(value)||0)));}

  // The unified equipment system defines quality by the highest affix rank.
  // Build a single affix at an exact requested rank using the game's own final
  // affix generator, rather than the obsolete g.rar field.
  function guaranteedRankAffix(g,rank){
    rank=clampQualityRank(rank);
    if(rank<=0)return null;
    const q=GAME_BALANCE.affixes.qualityChance,saved={...q};
    try{
      for(const key of balanceQualityKeys())q[key]=0;
      q[balanceQualityKey(rank)]=1;
      return rollAffixes(g)[0]||null;
    }finally{Object.assign(q,saved);}
  }
  globalThis.forceGearQuality=function(g,rank){
    rank=clampQualityRank(rank);g.rar=0;
    if(rank<=0){g.affix=[];return g;}
    const affix=guaranteedRankAffix(g,rank);
    g.affix=affix?[affix]:[];
    return g;
  };

  // Recruiting a hero must not mint account-wide currency/items. The new hero's
  // starter weapon is intentional, while gold/ore/dust/gems/materials/potions
  // and consumables belong to the shared account and are restored after recruit.
  if(typeof recruitHero==='function'){
    const auditedRecruitHeroBase=recruitHero;
    recruitHero=function(job){
      if(!party)return auditedRecruitHeroBase(job);
      ensureAccountResources();ensureSharedItems();ensureSharedGear();ensureAccountQuests();
      const beforeCount=party.members.length,r=party.accountResources,i=party.sharedItems;
      const snapshot={gold:r.gold,ore:r.ore,dust:r.dust,gems:[...r.gems],materials:{...r.materials},potions:i.potions,consumables:{...i.consumables}};
      const out=auditedRecruitHeroBase(job);
      if(party&&party.members.length>beforeCount){
        r.gold=snapshot.gold;r.ore=snapshot.ore;r.dust=snapshot.dust;r.gems.splice(0,r.gems.length,...snapshot.gems);r.materials={...snapshot.materials};
        i.potions=snapshot.potions;i.consumables={...snapshot.consumables};
        save();render();
      }
      return out;
    };
  }

  // Tutorial/board rewards expose a quality in the balance JSON and UI. Make
  // that quality exact under the final affix-based equipment quality model.
  claimTutorial=function(){
    const t=GAMEPLAY_SETTINGS.quests.tutorial;
    if(state.tutorial===0&&state.bag.length>=RULES.bagCapacity)return toast('背包已滿，請先整理再領取新手護甲');
    const ok=[state.totalKills>=t.killRequirement,state.bag.some(g=>g.plus>0),state.skills[0]>=t.skillLevelRequirement][state.tutorial];
    if(!ok)return;
    state.tutorial++;state.gold+=Math.round(t.rewardGold);state.ore+=Math.round(t.rewardOre);
    let armor=null;
    if(state.tutorial===1){
      const tier=Math.max(1,Math.round(t.armorTier)),slot=Math.max(0,Math.min(3,Math.round(t.armorSlot))),quality=clampQualityRank(t.armorQuality);
      armor=forceGearQuality(gear(tier,slot,0,state.job),quality);addGear(armor);
    }
    save();render();
    toast(armor?`獲得 ${AFFIX_RANK[gearQualityRank(armor)]} ${equipmentDisplayName(armor)}、${Math.round(t.rewardGold)} 金幣與 ${Math.round(t.rewardOre)} 鍛鐵`:`獲得 ${Math.round(t.rewardGold)} 金幣與 ${Math.round(t.rewardOre)} 鍛鐵`);
  };

  claimBoard=function(id){
    ensureBoard();const q=state.board.tasks.find(q=>q.id===id),b=GAMEPLAY_SETTINGS.quests.board;
    if(!q||q.done||(state.materials[q.mat]||0)<q.n)return;
    if(q.kind==='gear'&&state.bag.length>=RULES.bagCapacity)return toast('背包已滿，請先整理再領取裝備獎勵');
    state.materials[q.mat]-=q.n;q.done=true;state.gold+=Math.round(regionTier(q.map)*b.goldPerTier);state.ore+=Math.round(regionTier(q.map)*b.orePerTier);
    if(q.kind==='gear'){
      const reward=forceGearQuality(gear(regionTier(q.map),q.slot,0,q.job??rand(4)),q.rar);addGear(reward);
    }else state.gems[q.gem]+=Math.round(b.gemReward);
    state.repeat++;save();render();toast(q.kind==='gear'?'委託完成，裝備已放入背包':'委託完成，獎勵已領取');
  };

  // Configured ordinary equipment drops also describe "fine/rare" quality.
  // Preserve all non-equipment reward behavior and only repair this mapping.
  if(typeof grantConfiguredDrop==='function'){
    const auditedGrantConfiguredDropBase=grantConfiguredDrop;
    grantConfiguredDrop=function(rule,e,rng=Math.random){
      if(rule?.type!=='gear')return auditedGrantConfiguredDropBase(rule,e,rng);
      const qty=randomQuantity(rule,rng),mode=e.difficulty||0,mi=e.region??state.map,tier=regionTier(mi),r=GAMEPLAY_SETTINGS.rewards;
      for(let q=0;q<qty;q++){
        const first=rng(),quality=first<r.equipmentQuality.rareChance?2:(rng()<r.equipmentQuality.fineConditionalChance?1:0);
        const g=gear(tier,Math.floor(rng()*4),0);
        forceGearQuality(g,quality);modeAffixes(g,mode);addGear(g);
      }
      return {name:rule.name,count:qty};
    };
  }

  // The forge member renderer was captured before the affix-quality migration,
  // leaving the detail badge stuck on legacy rarity. Correct only that badge.
  if(typeof forgeView==='function'){
    const auditedForgeViewBase=forgeView;
    forgeView=function(){
      let html=auditedForgeViewBase();
      const h=typeof pageHero==='function'?pageHero('forge'):state;
      const selectedId=typeof teamForgeSelection!=='undefined'?teamForgeSelection.get(h?.job):null;
      const g=h?.bag?.find(x=>x.id===selectedId)||(h?equipment(h)[0]:null)||h?.bag?.[0];
      if(g){
        const boss=g.boss!==undefined?' · BOSS 專屬':'';
        const legacy=`<span class="tag">${RARITY[g.rar]}${boss}</span>`;
        const current=`<span class="tag">${AFFIX_RANK[gearQualityRank(g)]}${boss}</span>`;
        html=html.replace(legacy,current);
      }
      return html;
    };
  }

  // Battle descriptions must report the same configurable group size and pacing
  // that spawnGroup()/tick() actually use.
  if(typeof battleView==='function'){
    const auditedBattleViewBase=battleView;
    battleView=function(){
      let html=auditedBattleViewBase();
      const gs=GAMEPLAY_SETTINGS.combat.groupSize,min=Math.max(1,Math.round(gs.min)),max=Math.max(min,Math.round(gs.max)),group=min===max?String(min):`${min}～${max}`;
      const seconds=Math.max(0,Number(GS('combat.pacing.roundMinimumMs',6000))||0)/1000,sec=Number.isInteger(seconds)?String(seconds):String(+seconds.toFixed(2));
      html=html.replace(/群怪 · \d+～\d+ 隻/g,`群怪 · ${group} 隻`).replace(/開始探索，遭遇\d+～\d+隻敵人。/g,`開始探索，遭遇${group}隻敵人。`).replace(/1倍速每回合至少 \d+(?:\.\d+)? 秒/g,`1倍速每回合至少 ${sec} 秒`);

  }

  function configuredBattleRates(){const raw=GS('combat.pacing.rates',[1,2,4]);return Array.isArray(raw)?raw.map(Number).filter(x=>Number.isFinite(x)&&x>0):[1,2,4];}
  function normalizeBattleRateToSettings(){const rates=configuredBattleRates();if(rates.length&&!rates.includes(battleRate))battleRate=rates[0];}
  normalizeBattleRateToSettings();
  if(typeof applyBalanceConfig==='function'){
    const auditedApplyBalanceConfigBase=applyBalanceConfig;
    applyBalanceConfig=function(...args){const out=auditedApplyBalanceConfigBase(...args);normalizeBattleRateToSettings();return out;};
  }

  // Final-boss completion text should follow configurable level caps as the
  // actual progression code does.
  if(typeof note==='function'){
    const auditedNoteBase=note;
    note=function(text){

        text=`噬日者已倒下！LV${before} 成員解鎖 LV${after}，其他成員達 LV${before} 時解鎖。`;
      }
      return auditedNoteBase(text);
    };
  }

  // Preserve late pending-loot data through validateParty() so manual JSON
  // import does not silently discard it. The actual gear objects are validated
  // after the party state is available by reusing the final validateSave().
  if(typeof validateParty==='function'){
    const auditedValidatePartyBase=validateParty;
    validateParty=function(data){
      const out=auditedValidatePartyBase(data);
      if(data?.pendingGearLoot!==undefined){
        if(!Array.isArray(data.pendingGearLoot))throw Error('待結算裝備資料無效');
        out.pendingGearLoot=validatePendingGearArray(data.pendingGearLoot,out);

      return out;
    };
  }
  function validatePendingGearArray(raw,validatedParty=null){
    if(raw===undefined)return [];
    if(!Array.isArray(raw))throw Error('待結算裝備資料無效');
    const members=validatedParty?.members||[state],hero=validatedParty?members.find(h=>h.job===validatedParty.selected):state;
    const existing=new Set(members.flatMap(h=>(h?.bag||[]).map(g=>g.id))),seen=new Set(),out=[],template=clonePlain(hero);
    for(const item of raw){
      if(!item||typeof item.id!=='string'||existing.has(item.id)||seen.has(item.id))throw Error('待結算裝備 ID 無效');
      seen.add(item.id);
      const probe={...template,map:0,bag:[clonePlain(item)],equipped:[null,null,null,null,null]};
      const valid=validateSave(probe);
      if(!valid?.bag?.[0])throw Error('待結算裝備資料無效');
      out.push(valid.bag[0]);
    }
    return out;
  }
  if(typeof loadParty==='function'){
    const auditedLoadPartyBase=loadParty;
    loadParty=function(data){
      const validated=validateParty(data),queued=validated.pendingGearLoot;
      const copy=clonePlain(data);copy.pendingGearLoot=[];
      const out=auditedLoadPartyBase(copy);
      pendingGearLoot=queued||[];
      return out;
    };
  }
})();



// Update 20: continued audit fixes.
// The party-page renderer wraps advance() in heroMenuAction(), so the older
// button-state patch no longer matched the final markup. Keep the displayed
// requirement and clickability aligned with the actual advance() guard.
(function installContinuedAuditFixes(){
  if(typeof characterView==='function'){
    const continuedAuditCharacterViewBase=characterView;
    characterView=function(){
      let html=continuedAuditCharacterViewBase();
      const h=typeof pageHero==='function'?pageHero('character'):state;
      const a=GAMEPLAY_SETTINGS.progression.advance;

      html=html.replace(/<button class="primary" onclick="heroMenuAction\((\d+),\(\)=>\{advance\(\)\}\)"\s*(?:disabled)?\s*>/,function(full,job){
        return `<button class="primary" onclick="heroMenuAction(${job},()=>{advance()})"${shouldDisable?' disabled':''}>`;
      });
      return html;
    };
  }
})();

// The first save-load pass runs before late gameplay modules are installed. Run
// one final hydration unconditionally so fields introduced by late modules are
// not silently discarded even when the early/core load succeeded.
try{
  const raw=globalThis.__EMBERWILD_BOOT_SAVE_RAW??localStorage.getItem(KEY);
  if(raw){
    const parsed=JSON.parse(raw),fallbackStats=party?.battleStatistics;
    loadParty(parsed);
    if(!parsed.battleStatistics){
      try{
        const statsRaw=typeof BATTLE_STATS_STORAGE_KEY!=='undefined'?localStorage.getItem(BATTLE_STATS_STORAGE_KEY):null;
        if(statsRaw)party.battleStatistics=normalizeBattleStatistics(JSON.parse(statsRaw));
        else if(fallbackStats)party.battleStatistics=normalizeBattleStatistics(fallbackStats);
      }catch(e){if(fallbackStats)party.battleStatistics=normalizeBattleStatistics(fallbackStats);}
    }
    // Early loaders may have normalized the save before late-module fields were
    // restored. Persist the fully hydrated final state so a second immediate
    // reload cannot lose pending loot or other late-module data.
    save();
  }
}catch(e){
  console.warn('最終存檔完整載入失敗',e);
  if(!state){state=null;party=null;toast('存檔未能載入：'+e.message+'；可匯入備份。');}
}
render();

<script id="economy-and-salvage-system">
/* Update 21: sale economy, grouped pending loot and configurable salvage output. */
(function installEconomyAndSalvageSystem(){
  const QUALITY_NAMES=(typeof AFFIX_RANK!=='undefined'?AFFIX_RANK:['普通','精良','稀有','傳說']);
  const DEFAULT_GEAR_SELL=[12,30,75,180];
  const defaultMaterialKeys=()=>{
    const set=new Set(['鍛鐵','粉塵','以太鍛鐵','光輝碎塊','升級卷軸']);
    for(const m of (GAMEPLAY_SETTINGS_DEFAULTS?.monsters?.catalog||[]))if(m?.material)set.add(m.material);
    for(const d of (GAMEPLAY_SETTINGS_DEFAULTS?.drops?.entries||[]))if(d?.type==='material'&&d.key)set.add(d.key);
    return [...set];
  };
  const defaultMaterialPrice=k=>k==='鍛鐵'?2:k==='粉塵'?6:k==='以太鍛鐵'?100:k==='光輝碎塊'?120:k==='升級卷軸'?150:5;
  GAMEPLAY_SETTINGS_DEFAULTS.economy ??={};
  GAMEPLAY_SETTINGS_DEFAULTS.economy.equipmentSellPriceByQuality ??=DEFAULT_GEAR_SELL.slice();
  GAMEPLAY_SETTINGS_DEFAULTS.economy.materialDefaultSellPrice ??=5;
  GAMEPLAY_SETTINGS_DEFAULTS.economy.potionSellPrice ??=10;
  GAMEPLAY_SETTINGS_DEFAULTS.economy.materialPrices ??=defaultMaterialKeys().map(key=>({key,sellPrice:defaultMaterialPrice(key)}));
  GAMEPLAY_SETTINGS_DEFAULTS.equipment.salvage.extraRewards ??=[];

  const economyDynamicArrays=new Set(['monsters.skills','monsters.catalog','drops.entries','economy.materialPrices','equipment.salvage.extraRewards']);
  mergeGameplayShape=function mergeGameplayShapeEconomy(def,src,path=''){
    if(Array.isArray(def)){
      const isSourcesKinds=/^(drops\.entries\.\d+\.(sources|kinds))$/.test(path);
      const dynamic=economyDynamicArrays.has(path)||isSourcesKinds;
      if(dynamic){
        if(!Array.isArray(src))return cloneGameplaySettings(def);
        if(isSourcesKinds||!def.length)return cloneGameplaySettings(src);
        const template=def[0];
        return src.map((v,i)=>mergeGameplayShapeEconomy(def[i]===undefined?template:def[i],v,path+'.'+i));
      }
      return def.map((v,i)=>mergeGameplayShapeEconomy(v,Array.isArray(src)?src[i]:undefined,path?path+'.'+i:String(i)));
    }
    if(def&&typeof def==='object'){
      const out={};
      for(const k of Object.keys(def)){const next=path?path+'.'+k:k;out[k]=mergeGameplayShapeEconomy(def[k],src&&typeof src==='object'?src[k]:undefined,next);}
      return out;
    }
    if(typeof def==='number')return typeof src==='number'&&Number.isFinite(src)?src:def;
    return typeof src===typeof def?src:def;
  };

  const economyValidateGameplayBase=validateGameplaySettings;
  validateGameplaySettings=function(cfg){
    cfg=economyValidateGameplayBase(cfg);
    const e=cfg.economy||{},prices=e.equipmentSellPriceByQuality;
    if(!Array.isArray(prices)||prices.length!==4||prices.some(v=>!Number.isFinite(v)||v<0))throw Error('裝備販售價格必須有普通／精良／稀有／傳說 4 個非負數值');
    if(!Number.isFinite(e.materialDefaultSellPrice)||e.materialDefaultSellPrice<0||!Number.isFinite(e.potionSellPrice)||e.potionSellPrice<0)throw Error('材料／治療藥水販售價格無效');
    if(!Array.isArray(e.materialPrices))throw Error('材料販售價格表無效');
    const materialKeys=new Set();
    for(const [i,row] of e.materialPrices.entries()){
      if(!row||typeof row.key!=='string'||!row.key.trim()||materialKeys.has(row.key)||!Number.isFinite(row.sellPrice)||row.sellPrice<0)throw Error('材料販售價格資料無效：'+i);
      materialKeys.add(row.key);
    }
    const extras=cfg.equipment?.salvage?.extraRewards,types=new Set(['ore','dust','material','potion','item','gem']);
    if(!Array.isArray(extras))throw Error('分解額外產物必須是陣列');
    for(const [i,r] of extras.entries()){
      if(!r||!Number.isInteger(r.quality)||r.quality<0||r.quality>3||!types.has(r.type)||!Number.isInteger(r.quantity)||r.quantity<1||r.quantity>999)throw Error('分解額外產物資料無效：'+i);
      if(r.type==='material'&&(typeof r.key!=='string'||!r.key.trim()))throw Error('分解材料產物需要材料名稱：'+i);
      if(r.type==='item'&&!SHOP.some(x=>x.id===r.key))throw Error('分解產物指定的商店道具不存在：'+i);
      if(r.type==='gem'&&r.key!=='random'&&![0,1,2,'0','1','2'].includes(r.key))throw Error('分解寶石 key 需為 random/0/1/2：'+i);

    return cfg;
  };
  normalizeGameplaySettings=function(input){if(typeof validateMonsterDropDynamicInput==='function')validateMonsterDropDynamicInput({balanceSettings:input});return validateGameplaySettings(mergeGameplayShape(GAMEPLAY_SETTINGS_DEFAULTS,input||{}));};

  const normalizeItemSellPrices=data=>{
    if(Array.isArray(data?.items))for(const item of data.items){if(!Number.isFinite(item.sellPrice)||item.sellPrice<0)item.sellPrice=Math.max(0,Math.round((Number(item.cost)||0)*.25));}
    return data;
  };
  const economyValidateBalanceBase=validateBalanceConfig;
  validateBalanceConfig=function(input){
    const copy=normalizeItemSellPrices(JSON.parse(JSON.stringify(input)));
    const out=economyValidateBalanceBase(copy);
    normalizeItemSellPrices(out);
    for(const item of out.items||[])if(!Number.isFinite(item.sellPrice)||item.sellPrice<0)throw Error('道具賣出價格無效：'+(item.id||'未知'));
    return out;
  };
  const economyApplyBalanceBase=applyBalanceConfig;
  applyBalanceConfig=function(input,{persist=true}={}){
    const copy=normalizeItemSellPrices(JSON.parse(JSON.stringify(input)));
    const out=economyApplyBalanceBase(copy,{persist:false});
    for(const item of SHOP)if(!Number.isFinite(item.sellPrice)||item.sellPrice<0)item.sellPrice=Math.max(0,Math.round((Number(item.cost)||0)*.25));
    if(persist)localStorage.setItem(BALANCE_KEY,JSON.stringify(exportableBalance()));
    if(state)render();
    return out;
  };
  for(const item of SHOP)if(!Number.isFinite(item.sellPrice)||item.sellPrice<0)item.sellPrice=Math.max(0,Math.round((Number(item.cost)||0)*.25));

  // Re-normalize the in-memory settings now that the new economy fields exist.
  try{
    const saved=localStorage.getItem(BALANCE_KEY);
    if(saved){const parsed=JSON.parse(saved);if(parsed?.balanceSettings)GAMEPLAY_SETTINGS=normalizeGameplaySettings(parsed.balanceSettings);if(Array.isArray(parsed?.items)){const byId=new Map(parsed.items.map(x=>[x.id,x]));for(const item of SHOP){const src=byId.get(item.id);if(src&&Number.isFinite(src.sellPrice)&&src.sellPrice>=0)item.sellPrice=src.sellPrice;}}}
    else GAMEPLAY_SETTINGS=normalizeGameplaySettings(GAMEPLAY_SETTINGS);
  }catch(e){console.warn('販售／分解設定載入失敗，使用預設值',e);GAMEPLAY_SETTINGS=normalizeGameplaySettings(GAMEPLAY_SETTINGS);}

  const economyClone=v=>JSON.parse(JSON.stringify(v));
  function economySettings(){return GAMEPLAY_SETTINGS.economy;}
  function equipmentSellPrice(g){const q=Math.max(0,Math.min(3,gearQualityRank(g)));return Math.max(0,Math.round(Number(economySettings().equipmentSellPriceByQuality[q])||0));}
  function materialSellPrice(key){const e=economySettings(),row=(e.materialPrices||[]).find(x=>x.key===key);return Math.max(0,Math.round(Number(row?.sellPrice??e.materialDefaultSellPrice)||0));}
  function itemSellPrice(id){if(id==='__potion__')return Math.max(0,Math.round(Number(economySettings().potionSellPrice)||0));const item=SHOP.find(x=>x.id===id);return Math.max(0,Math.round(Number(item?.sellPrice)||0));}
  globalThis.equipmentSellPrice=equipmentSellPrice;globalThis.materialSellPrice=materialSellPrice;globalThis.itemSellPrice=itemSellPrice;

  function materialCount(key){if(key==='鍛鐵')return state.ore;if(key==='粉塵')return state.dust;return state.materials[key]||0;}
  function setMaterialCount(key,value){value=Math.max(0,Math.floor(value));if(key==='鍛鐵')state.ore=value;else if(key==='粉塵')state.dust=value;else state.materials[key]=value;}
  function economyResourceSnapshot(){return {gold:state.gold,ore:state.ore,dust:state.dust,potions:state.potions,materials:economyClone(state.materials),consumables:economyClone(state.consumables),gems:[...state.gems]};}
  function restoreEconomyResources(s){state.gold=s.gold;state.ore=s.ore;state.dust=s.dust;state.potions=s.potions;for(const k of Object.keys(state.materials))delete state.materials[k];Object.assign(state.materials,s.materials);for(const k of Object.keys(state.consumables))delete state.consumables[k];Object.assign(state.consumables,s.consumables);state.gems.splice(0,state.gems.length,...s.gems);}

  function salvageExtraRules(g){const q=gearQualityRank(g);return (GAMEPLAY_SETTINGS.equipment.salvage.extraRewards||[]).filter(r=>r.quality===q);}
  function grantEconomyReward(type,key,quantity){
    const n=Math.max(0,Math.floor(Number(quantity)||0));if(!n)return;
    if(type==='ore')state.ore+=n;
    else if(type==='dust')state.dust+=n;
    else if(type==='potion')state.potions+=n;
    else if(type==='material')state.materials[key]=(state.materials[key]||0)+n;
    else if(type==='item'){if(SHOP.some(x=>x.id===key))state.consumables[key]=(state.consumables[key]||0)+n;}
    else if(type==='gem'){for(let i=0;i<n;i++){const gi=key==='random'?rand(3):Number(key);if(Number.isInteger(gi)&&gi>=0&&gi<3)state.gems[gi]=(state.gems[gi]||0)+1;}}
  }
  function grantSalvageRewards(g,includeEnhance=true){const r=update12SalvageRewards(g,includeEnhance);state.ore+=r.ore;state.dust+=r.dust;for(const x of salvageExtraRules(g))grantEconomyReward(x.type,x.key,x.quantity);return r;}
  globalThis.grantSalvageRewards=grantSalvageRewards;

  salvage=function(id){
    const g=findGear(id);if(!g||g.locked||gearWearer(g.id)||inlineAffixDrafts.has(affixDraftKey(g)))return;
    const bag=state.bag,snap=economyResourceSnapshot();grantSalvageRewards(g,true);state.bag=state.bag.filter(x=>x.id!==id);pruneGearSelections();
    if(!save()){state.bag=bag;restoreEconomyResources(snap);return;}render();toast('已分解 '+equipmentDisplayName(g));
  };
  confirmMassSalvage=function(){
    if(!massSalvageIds)return;const items=massSalvageTargets(massSalvageIds),ids=new Set(items.map(g=>g.id)),bag=state.bag,snap=economyResourceSnapshot();
    for(const g of items)grantSalvageRewards(g,true);state.bag=state.bag.filter(g=>!ids.has(g.id));
    if(!save()){state.bag=bag;restoreEconomyResources(snap);return;}massSalvageIds=null;pruneGearSelections();closeModal();render();toast('已分解 '+items.length+' 件裝備');
  };
  salvageAll=function(){
    const targets=state.bag.filter(g=>gearQualityRank(g)===0&&(g.plus||0)===0&&!g.affix.length&&g.boss===undefined&&!state.equipped.includes(g.id)&&!g.locked),ids=new Set(targets.map(g=>g.id));for(const g of targets)grantSalvageRewards(g,false);state.bag=state.bag.filter(g=>!ids.has(g.id));pruneGearSelections();save();render();toast(`已分解 ${ids.size} 件未養成普通裝備`);
  };
  // Auto-salvage on a full inventory must use the same configurable output.
  const economyAddGearBase=addGear;
  addGear=function(g){
    if(!(typeof collectingBattleGear!=='undefined'&&collectingBattleGear)&&state.bag.length>=RULES.bagCapacity){g.rar=0;grantSalvageRewards(g,false);note('背包已滿，掉落裝備自動分解。');return;}
    return economyAddGearBase(g);
  };

  function canDisposeBagGear(g){return !!g&&!g.locked&&!gearWearer(g.id)&&!inlineAffixDrafts.has(affixDraftKey(g));}
  function sellGear(id){
    const g=findGear(id);if(!canDisposeBagGear(g))return toast('已穿戴、鎖定或待確認洗鍊的裝備不能販售');
    const price=equipmentSellPrice(g),bag=state.bag,gold=state.gold;state.gold+=price;state.bag=state.bag.filter(x=>x.id!==id);pruneGearSelections();
    if(!save()){state.bag=bag;state.gold=gold;return;}render();toast(`已販售 ${equipmentDisplayName(g)}，獲得 ${price} 金幣`);
  }
  function sellAllGearByQuality(q){
    const items=state.bag.filter(g=>gearQualityRank(g)===q&&canDisposeBagGear(g));if(!items.length)return toast('沒有可販售的'+QUALITY_NAMES[q]+'裝備');
    const ids=new Set(items.map(g=>g.id)),total=items.reduce((n,g)=>n+equipmentSellPrice(g),0);if(!confirm(`確定販售 ${items.length} 件${QUALITY_NAMES[q]}裝備，獲得 ${total} 金幣？\n已穿戴、鎖定與待確認洗鍊裝備不會販售。`))return;
    const bag=state.bag,gold=state.gold;state.bag=state.bag.filter(g=>!ids.has(g.id));state.gold+=total;pruneGearSelections();if(!save()){state.bag=bag;state.gold=gold;return;}render();toast(`已販售 ${items.length} 件裝備，獲得 ${total} 金幣`);
  }
  globalThis.sellGear=sellGear;globalThis.sellAllGearByQuality=sellAllGearByQuality;

  const economyInventoryGearDetailBase=inventoryGearDetail;
  inventoryGearDetail=function(g){
    let html=economyInventoryGearDetailBase(g);if(!g)return html;const disabled=!canDisposeBagGear(g)?' disabled':'';
    return html.replace('</div></section>\n    '+(inlineAffixComparison(g)||''),`<button class="sell-gear-button" onclick="sellGear('${g.id}')"${disabled}>販售 ${equipmentSellPrice(g)} 金幣</button></div></section>\n    ${inlineAffixComparison(g)}`);
  };
  const economyBulkSalvageBase=bulkSalvageControls;
  bulkSalvageControls=function(){return economyBulkSalvageBase()+`<div class="actions bulk-sell-actions">${QUALITY_NAMES.map((name,q)=>`<button onclick="sellAllGearByQuality(${q})">販售所有${name}</button>`).join('')}</div>`;};

  function pendingByQuality(q){return pendingGearLoot.filter(g=>gearQualityRank(g)===q);}
  function claimPendingQuality(q){
    const room=Math.max(0,RULES.bagCapacity-state.bag.length),group=pendingByQuality(q);if(!group.length)return toast('沒有'+QUALITY_NAMES[q]+'待領取裝備');if(!room)return toast('裝備背包已滿');
    const take=group.slice(0,room),ids=new Set(take.map(g=>g.id));state.bag.push(...take);pendingGearLoot=pendingGearLoot.filter(g=>!ids.has(g.id));save();render();toast(`已領取 ${take.length} 件${QUALITY_NAMES[q]}裝備${take.length<group.length?'；背包已滿':''}`);
  }

<script id="world-runtime-followup-fixes">
/* Update 23: compatibility fixes for dynamic maps with small custom monster pools. */
(function installWorldRuntimeFollowupFixes(){
  // The commission board promises three commissions. Custom maps may have only
  // one or two normal monsters, so cycle the available pool instead of silently

      const mi=currentMap===6?5:currentMap,m=MAPS[mi],b=GAMEPLAY_SETTINGS.quests.board,pool=m?.mobs||[];
      if(!pool.length)throw Error('目前地圖沒有可用的普通怪物，無法建立委託');
      s.board.serial++;s.board.next=Date.now()+BOARD_INTERVAL;
      s.board.tasks=Array.from({length:3},(_,i)=>{
        const mob=pool[i%pool.length];
        return {id:uid(),map:mi,mat:mob[2],n:Math.max(1,Math.round(b.taskBase+rand(Math.max(1,Math.round(b.taskRandomRange)))+(regionTier(mi)-1)*b.taskPerTier)),kind:i===2?'gear':'gem',gem:rand(3),slot:rand(4),rar:Math.random()<b.legendaryGearChance?3:2,done:false};
      });
    };
  }

  // Saves are first hydrated before this late dynamic-world module exists. A save

  // hydrate once more after the dynamic map catalog is installed.

    const d=JSON.parse(JSON.stringify(raw));
    const validMap=i=>Number.isInteger(i)&&i>=0&&i<MAPS.length;
    const validBoardTask=q=>q&&validMap(q.map)&&q.map!==6&&MAPS[q.map]?.mobs?.some(m=>m[2]===q.mat);
    const scrubBoard=b=>{if(!b||typeof b!=='object')return;if(Array.isArray(b.tasks)){b.tasks=b.tasks.filter(validBoardTask);if(b.tasks.length!==3)b.next=0;}};
    const scrubGear=g=>{if(!g||typeof g!=='object'||g.region===undefined)return;if(!validMap(g.region)||g.region===6||g.boss===undefined||regionFamily(g.region)!==g.boss||regionTier(g.region)!==g.tier)delete g.region;};

<script id="combat-contribution-meter-system">
/* Persistent active-party contribution meter: damage, healing and shield absorption. */
(()=>{
  const BASE_KEY='emberwild-combat-contribution-v1';
  let cacheKey='',cache=null,selectedMetric='damage';

  function storageKey(){
    const root=party?.members?.[0];
    const id=Number.isFinite(Number(root?.created))?String(root.created):'default';
    return BASE_KEY+':'+id;
  }
  function activeSignature(){
    if(!party?.active)return '';
    return [...party.active].filter(Number.isInteger).sort((a,b)=>a-b).join(',');
  }
  function blankRow(){return {damage:0,healing:0,mitigation:0};}
  function blankState(signature=activeSignature()){
    const out={teamSignature:signature,byJob:{}};
    for(let job=0;job<CLASSES.length;job++)out.byJob[job]=blankRow();
    return out;
  }
  function normalize(raw){
    const signature=typeof raw?.teamSignature==='string'?raw.teamSignature:'';
    const out=blankState(signature),src=raw&&typeof raw==='object'&&raw.byJob&&typeof raw.byJob==='object'?raw.byJob:{};
    for(let job=0;job<CLASSES.length;job++){
      const row=src[job]||src[String(job)]||{},clean=blankRow();
      for(const key of ['damage','healing','mitigation']){
        const n=Number(row[key]);
        clean[key]=Number.isFinite(n)&&n>0?Math.min(1e15,n):0;
      }
      out.byJob[job]=clean;
    }
    return out;
  }
  function writeCache(){
    if(!party||!cache)return;
    try{localStorage.setItem(storageKey(),JSON.stringify(cache));}catch{}
  }
  function ensure(){
    const key=storageKey(),signature=activeSignature();
    if(!cache||cacheKey!==key){
      cacheKey=key;
      try{cache=normalize(JSON.parse(localStorage.getItem(key)||'null'));}catch{cache=blankState(signature);}
    }
    if(cache.teamSignature!==signature){
      cache=blankState(signature);
      writeCache();
    }
    return cache;
  }
  function persist(){
    if(!party)return;
    ensure();
    writeCache();
  }
  globalThis.recordCombatContribution=function(hero,key,amount){
    if(!party||!['damage','healing','mitigation'].includes(key))return;
    const job=typeof hero==='number'?hero:hero?.job,n=Number(amount);
    if(!Number.isInteger(job)||!party.active.includes(job)||!Number.isFinite(n)||n<=0)return;
    const stats=ensure(),row=stats.byJob[job]||(stats.byJob[job]=blankRow());
    row[key]=Math.min(1e15,(Number(row[key])||0)+n);
  };
  globalThis.resetCombatContribution=function(){
    if(!party)return;
    cache=blankState(activeSignature());cacheKey=storageKey();writeCache();save();render();
  };
  globalThis.setCombatContributionMetric=function(metric){
    if(!['damage','healing','mitigation'].includes(metric))return;
    selectedMetric=metric;
    render();
  };
  globalThis.recordRegenContribution=function(target,healed){
    const total=Number(healed);
    if(!party||!target||!party.active.includes(target.job)||!Number.isFinite(total)||total<=0)return;
    const rows=effects.filter(fx=>fx.target===heroKey(target)&&fx.kind==='regen'&&fx.until>partyClock&&Number(fx.value)>0);
    const weight=rows.reduce((sum,fx)=>sum+Number(fx.value),0);
    if(weight<=0)return;
    for(const fx of rows){
      const caster=party.members.find(h=>h.job===fx.source);
      if(caster&&party.active.includes(caster.job))recordCombatContribution(caster,'healing',total*Number(fx.value)/weight);
    }
  };
  globalThis.combatContributionPanel=function(){
    if(!party)return '';
    const stats=ensure(),fmt=n=>Math.round(Number(n)||0).toLocaleString('zh-TW');
    const labels={damage:'傷害',healing:'治療',mitigation:'減傷'};
    const active=party.active.map(job=>party.members.find(h=>h.job===job)).filter(Boolean);
    const values=active.map(h=>({h,value:Number(stats.byJob[h.job]?.[selectedMetric])||0}));
    const max=Math.max(0,...values.map(x=>x.value));
    const bars=values.map(({h,value})=>{
      const width=max>0?Math.max(value>0?2:0,Math.min(100,value/max*100)):0;
      return '<div class="combat-contribution-row">'+
        '<span class="combat-contribution-name" title="'+esc(characterName(h))+'">'+esc(characterName(h))+'</span>'+
        '<div class="combat-contribution-track" aria-label="'+esc(characterName(h))+' '+labels[selectedMetric]+' '+fmt(value)+'"><div class="combat-contribution-fill" style="width:'+width+'%"></div></div>'+
        '<span class="combat-contribution-value">'+fmt(value)+'</span></div>';
    }).join('');
    const tabs=['damage','healing','mitigation'].map(key=>'<button class="'+(selectedMetric===key?'active':'')+'" onclick="setCombatContributionMetric(\''+key+'\')">'+labels[key]+'</button>').join('');
    return '<div class="combat-contribution-meter"><div class="combat-contribution-head"><b>隊伍戰鬥統計</b><button onclick="resetCombatContribution()" title="將目前隊伍的累積統計歸零">重置</button></div>'+
      '<div class="combat-contribution-tabs">'+tabs+'</div>'+
      '<div class="combat-contribution-bars">'+bars+'</div>'+
      '<p class="small combat-contribution-note">僅統計目前出戰成員；更換出戰隊伍會自動重置。減傷只計護盾實際抵擋的傷害。</p></div>';
  };

  if(typeof save==='function'){
    const baseSave=save;
    save=function(show=false){persist();return baseSave(show);};
  }
  if(typeof newGame==='function'){
    const baseNewGame=newGame;
    newGame=function(){cache=null;cacheKey='';selectedMetric='damage';return baseNewGame();};
  }
})();
</script>

  `;

  if(typeof sharedBattleJournal==='function'){
    sharedBattleJournal=function(){

<script id="turn-duration-system">
/* Update 30: combat status durations use battle turns instead of seconds. */
(function installTurnDurationSystem(){
  const TIME_UNITS={supportDuration:'battleRounds',itemDuration:'battleRounds'};
  const SUPPLY_KEYS=['imbue','ward','elementTonic'];
  const roundReferenceMs=cfg=>Math.max(1,Number(cfg?.balanceSettings?.combat?.pacing?.roundMinimumMs ?? (typeof GS==='function'?GS('combat.pacing.roundMinimumMs',6000):6000))||6000);
  const clone=v=>JSON.parse(JSON.stringify(v));
  function turnsFromLegacySeconds(seconds,cfg){return Math.max(1,Math.ceil(Math.max(0,Number(seconds)||0)/(roundReferenceMs(cfg)/1000)));}
  function normalizeTurnConfig(input){
    const out=clone(input||{}),legacyItems=out?.timeUnits?.itemDuration!=='battleRounds';
    if(Array.isArray(out.supportSkills))for(const list of out.supportSkills||[])for(const sk of list||[]){
      if(Number.isFinite(sk.duration))sk.duration=Math.max(0,Math.round(sk.duration));
      if(Number.isFinite(sk.cooldown))sk.cooldown=Math.max(0,Math.round(sk.cooldown));
    }
    if(Array.isArray(out.items))for(const item of out.items){
      if(Number.isFinite(item.duration))item.duration=legacyItems&&item.duration>0?turnsFromLegacySeconds(item.duration,out):Math.max(0,Math.round(item.duration));
    }
    out.timeUnits={...(out.timeUnits||{}),...TIME_UNITS};
    return out;
  }
  function migrateSupplyBuff(buff){
    if(!buff||typeof buff!=='object')return null;
    if(Number.isFinite(buff.remainingTurns)){
      const left=Math.max(0,Math.ceil(buff.remainingTurns));if(left<=0)return null;
      return {...buff,remainingTurns:left,totalTurns:Math.max(left,Math.ceil(Number(buff.totalTurns)||left)),until:0};
    }
    if(Number.isFinite(buff.until)&&buff.until>Date.now()){
      const left=Math.max(1,Math.ceil((buff.until-Date.now())/roundReferenceMs()));
      return {element:buff.element,remainingTurns:left,totalTurns:left,until:0};
    }
    return null;
  }
  function migrateHeroSupplyTurns(h){if(!h)return;for(const key of SUPPLY_KEYS)h[key]=migrateSupplyBuff(h[key]);}
  function migratePartySupplyTurns(){if(party?.members)for(const h of party.members)migrateHeroSupplyTurns(h);else if(state)migrateHeroSupplyTurns(state);}
  function decrementSupplyTurns(){
    if(!party)return;
    for(const h of heroes())for(const key of SUPPLY_KEYS){const b=activeSupply(h,key);if(!b)continue;b.remainingTurns=Math.max(0,Math.ceil(b.remainingTurns)-1);b.until=0;if(b.remainingTurns<=0)h[key]=null;}
  }

  EFFECT_NAMES.regen='每回合回復生命';
  activeSupply=function(h,key){const b=h?.[key];return b&&Number.isFinite(b.remainingTurns)&&b.remainingTurns>0?b:null;};
  useSupply=function(id){const item=SHOP.find(x=>x.id===id);if(!item||(state.consumables[id]||0)<1)return;state.consumables[id]--;const turns=Math.max(1,Math.round(Number(item.duration)||1));state[item.type]={element:item.element,remainingTurns:turns,totalTurns:turns,until:0};save();render();toast('已使用'+item.name);};
  supplyStatus=function(h){return SUPPLY_KEYS.map(key=>{const b=activeSupply(h,key);return b?ELEMENTS[b.element]+{imbue:'附魔',ward:'抗性',elementTonic:'增幅'}[key]+' '+Math.ceil(b.remainingTurns)+' 回合':'';}).filter(Boolean).join(' ／ ');};
  supplyDetail=function(item){const effect=item.type==='imbue'?`普通攻擊轉為${ELEMENTS[item.element]}屬性`:item.type==='ward'?`${ELEMENTS[item.element]}屬性傷害減少 ${Math.round(GS('combat.supply.wardResistance',.25)*10000)/100}%`:item.type==='elementTonic'?`${ELEMENTS[item.element]}屬性傷害增加 ${Math.round(GS('combat.supply.elementTonicDamage',.2)*10000)/100}%`:'依道具效果生效';return `${effect} · ${item.duration?`持續 ${Math.round(item.duration)} 戰鬥回合`:'立即生效'} · 單價 ${item.cost} 金幣`;};

  castSupport=function(h,index){const sk=SUPPORT[h.job][index];let targets=sk.target==='allies'?living().map(heroKey):sk.target==='weakest'?[heroKey([...living()].sort((a,b)=>a.hp/solo.stats(a).hp-b.hp/solo.stats(b).hp)[0])]:sk.target==='enemies'?foes.filter(e=>e.hp>0).map(e=>e.id):[foes.find(e=>e.hp>0)?.id];for(const target of targets.filter(Boolean)){effects=effects.filter(e=>!(e.source===h.job&&e.skill===index&&e.target===target));effects.push({source:h.job,skill:index,target,kind:sk.kind,value:supportAmount(h.job,index),until:partyClock+Math.max(0,Math.round(sk.duration)),name:sk.name});if(sk.kind==='regen'){const ally=party.members.find(a=>heroKey(a)===target);ally.hp=Math.min(solo.stats(ally).hp,ally.hp+solo.stats(ally).hp*supportAmount(h.job,index));}}note(characterName(h)+'施放 '+sk.name+' · '+Math.round(sk.duration)+' 回合');};
  supportSkillDetail=function(job,i,h=state){const sk=SUPPORT[job]?.[i];if(!sk)return '';const level=Math.max(1,h?.supportLevels?.[i]||1),value=+(sk.value*(1+(level-1)*(Number.isFinite(sk.effectPerLevel)?sk.effectPerLevel:GS('skills.support.effectPerExtraLevel',.2)))*100).toFixed(1),cd=supportSkillCooldown(h,i);return `${actionTurnElementLabel(sk.element)} · 目標 ${TARGET_NAMES[sk.target]} · ${EFFECT_NAMES[sk.kind]} ${value}% · 持續 ${Math.round(sk.duration)} 戰鬥回合 · 冷卻 ${cd} 回合 · 需求 LV${sk.level}${i===2?'／二轉':''}`;};

  battleBuffRows=function(){
    const rows=[],row=(who,name,detail,time,clock)=>`<tr><td>${esc(who)}</td><td>${esc(name)}</td><td>${esc(detail)}</td><td class="buff-time">${esc(time)}</td><td>${esc(clock)}</td></tr>`,names={attack:'攻擊提升',power:'技能威力提升',guard:'傷害減免',fracture:'防禦降低',weaken:'攻擊降低',vulnerable:'承受傷害增加',critical:'暴擊率提升',regen:'每回合恢復最大生命'};
    for(const e of effects.filter(e=>e.until>partyClock)){
      const h=party.members.find(h=>heroKey(h)===e.target),foe=foes.find(f=>f.id===e.target);if(!h&&!foe)continue;const sk=SUPPORT[e.source]?.[e.skill],total=Math.max(0,Math.round(sk?.duration??0));
      rows.push(row(h?characterName(h):foe.name,e.name,(names[e.kind]||e.kind)+' '+Number((e.value*100).toFixed(1))+'%',Math.max(0,Math.ceil(e.until-partyClock))+' / '+(total||'—')+' 回合','戰鬥回合'));
    }
    for(const h of party.members){
      const who=characterName(h)+(party.active.includes(h.job)?'':'（候補）');
      for(const key of SUPPLY_KEYS){const b=activeSupply(h,key);if(!b)continue;const labels={imbue:['附魔藥水','普攻改為'+ELEMENTS[b.element]+'屬性'],ward:['抗性藥水',ELEMENTS[b.element]+'傷害減免 '+Math.round(GS('combat.supply.wardResistance',.25)*10000)/100+'%'],elementTonic:['增幅藥水',ELEMENTS[b.element]+'傷害增加 '+Math.round(GS('combat.supply.elementTonicDamage',.2)*10000)/100+'%']};rows.push(row(who,ELEMENTS[b.element]+labels[key][0],labels[key][1],Math.ceil(b.remainingTurns)+' / '+Math.ceil(b.totalTurns||b.remainingTurns)+' 回合','出戰回合'));}
      if(h.shield>0)rows.push(row(who,'護盾','可抵擋所有來源傷害 · 剩餘 '+Math.round(h.shield),'無回合期限','耗盡或戰鬥結束'));
    }
    return rows.join('')||'<tr><td colspan="5" class="no-buffs">目前沒有生效中的 BUFF、DEBUFF 或消耗品效果。</td></tr>';
  };
  showBattleEffects=function(){if(!party)return;const modal=$('modal');modal.innerHTML=`<h2>生效效果與持續回合</h2><p class="small">BUFF／DEBUFF 依戰鬥回合計時；消耗品只在該角色出戰的戰鬥回合扣減。</p><div class="effects-modal-scroll"><table class="effects-modal-table"><thead><tr><th>對象</th><th>效果</th><th>能力變化</th><th>剩餘／總回合</th><th>計時方式</th></tr></thead><tbody id="battle-effect-modal-rows">${battleBuffRows()}</tbody></table></div><button onclick="closeModal()">關閉</button>`;modal.showModal();};

  const pacedRoundTurnDurationBase=pacedRound;
  pacedRound=function*(){const hadCombat=!!party&&foes.some(e=>e.hp>0);yield* pacedRoundTurnDurationBase();if(hadCombat&&party)decrementSupplyTurns();};

  if(typeof battleView==='function'){
    const turnDurationBattleViewBase=battleView;
    battleView=function(){return turnDurationBattleViewBase().replace(/第 (\d+) 秒/g,'第 $1 回合');};
  }
  if(typeof shopView==='function'){
    const turnDurationShopBase=shopView;
    shopView=function(){return turnDurationShopBase().replace(/消耗品按現實時間計時，暫停或關閉遊戲仍會到期。/g,'消耗品效果以戰鬥回合計時；只有角色出戰的戰鬥回合會扣減，暫停或關閉遊戲不會消耗回合。').replace(/持續 (\d+) 秒/g,'持續 $1 回合');};
  }
  if(typeof guideView==='function'){
    const turnDurationGuideBase=guideView;
    guideView=function(){return `<section class="panel"><h2>BUFF／DEBUFF 回合制</h2><p>輔助技能的 BUFF／DEBUFF 持續時間統一使用「戰鬥回合」；回復效果每戰鬥回合觸發一次。消耗品效果同樣使用回合數，只有該角色實際出戰的戰鬥回合會扣減。暫停、關閉頁面與候補狀態都不會消耗消耗品回合。</p><p>技能冷卻仍使用施放者自己的行動回合；護盾沒有回合期限，只在耗盡或戰鬥結束時消失。</p></section>`+turnDurationGuideBase().replace(/消耗品按現實時間計時，暫停或關閉遊戲仍會到期。/g,'消耗品效果按戰鬥回合計時。');};
  }

  if(typeof exportableBalance==='function'){
    const turnDurationExportBase=exportableBalance;
    exportableBalance=function(){const out=turnDurationExportBase();out.timeUnits={...(out.timeUnits||{}),...TIME_UNITS};out.notes=[...(out.notes||[]),'supportSkills[].duration 單位為戰鬥回合；其數值原本實際就是依 partyClock 回合推進，因此舊數值直接保留。','items[].duration 單位為角色出戰的戰鬥回合；舊版現實秒會依 1× 每回合最短時間換算為回合後匯入。'];return out;};
  }
  if(typeof validateBalanceConfig==='function'){
    const turnDurationValidateBase=validateBalanceConfig;
    validateBalanceConfig=function(input){const copy=normalizeTurnConfig(input),out=turnDurationValidateBase(copy);for(const [job,list] of (out.supportSkills||[]).entries())for(const [i,sk] of (list||[]).entries()){if(!Number.isInteger(sk.duration)||sk.duration<0)throw Error(`輔助技能持續回合無效：${job}-${i}`);if(!Number.isInteger(sk.cooldown)||sk.cooldown<0)throw Error(`輔助技能冷卻回合無效：${job}-${i}`);}for(const item of out.items||[])if(!Number.isInteger(item.duration)||item.duration<0)throw Error('道具持續回合無效：'+(item.id||'未知'));out.timeUnits={...(out.timeUnits||{}),...TIME_UNITS};return out;};
  }
  if(typeof balanceReference==='function'){
    const turnDurationReferenceBase=balanceReference;
    balanceReference=function(){const r=turnDurationReferenceBase();r.units??={};r.units.duration='BUFF／DEBUFF 為戰鬥回合；消耗品為角色出戰回合';r.units.cooldown='技能冷卻為施放者自身行動回合';return r;};
  }
  if(typeof applyBalanceConfig==='function'){
    const turnDurationApplyBase=applyBalanceConfig;
    applyBalanceConfig=function(input,{persist=true}={}){const copy=normalizeTurnConfig(input),result=turnDurationApplyBase(copy,{persist:false});if(persist)localStorage.setItem(BALANCE_KEY,JSON.stringify(exportableBalance()));if(state)render();return result;};
  }

  /* Migrate an already loaded old balance/save once. Support duration numbers are
     preserved because the old runtime already advanced them by partyClock rounds. */
  try{
    const raw=localStorage.getItem(BALANCE_KEY);let legacyBalance=null;
    if(raw){try{legacyBalance=JSON.parse(raw);}catch{}}
    if(!raw || legacyBalance?.timeUnits?.itemDuration!=='battleRounds'){
      const ref=legacyBalance||{balanceSettings:GAMEPLAY_SETTINGS};
      for(const item of SHOP)item.duration=turnsFromLegacySeconds(item.duration,ref);
      if(raw)localStorage.setItem(BALANCE_KEY,JSON.stringify(exportableBalance()));
    }
    migratePartySupplyTurns();
    if(party)save();
  }catch(e){console.warn('回合制 BUFF／消耗品遷移失敗',e);}
  if(state)render();
})();
</script>

<script id="healing-potion-system">
/* Update 31: configurable automatic healing potions. Healing potions are buy-only;
   the selected potion is consumed automatically at the start of that hero's own
   basic-action turn when HP is at/below the configured threshold. */
(function installHealingPotionSystem(){
  const HEAL_POTION_TYPE='healPotion';
  const HEAL_POTION_DEFAULTS=[
    {id:'heal_small',type:HEAL_POTION_TYPE,cost:8,sellPrice:2,duration:0,cooldown:2,healFraction:.25,name:'簡易治療藥水',description:'少量恢復生命，價格低廉，適合日常探索。'},
    {id:'heal_standard',type:HEAL_POTION_TYPE,cost:15,sellPrice:4,duration:0,cooldown:3,healFraction:.45,name:'治療藥水',description:'標準遠征治療藥水，在恢復量與成本之間取得平衡。'},
    {id:'heal_greater',type:HEAL_POTION_TYPE,cost:28,sellPrice:7,duration:0,cooldown:4,healFraction:.70,name:'強效治療藥水',description:'一次恢復較多生命，適合高壓戰鬥，但價格與冷卻較高。'},
    {id:'heal_supreme',type:HEAL_POTION_TYPE,cost:50,sellPrice:12,duration:0,cooldown:5,healFraction:1.00,name:'特級治療藥水',description:'可將生命大幅拉回安全線，主要用於危急狀況。'}
  ];
  const clone=v=>JSON.parse(JSON.stringify(v));
  const isHealPotion=item=>item?.type===HEAL_POTION_TYPE;
  const healPotionItems=()=>SHOP.filter(isHealPotion);
  const pct=v=>Math.round(Number(v)*10000)/100;
  const validId=id=>typeof id==='string'&&/^[A-Za-z0-9_-]{1,100}$/.test(id);

  function addDefaultHealPotionsTo(items){
    const out=Array.isArray(items)?items:[];
    if(!out.some(isHealPotion))out.push(...HEAL_POTION_DEFAULTS.map(clone));
    return out;
  }
  addDefaultHealPotionsTo(SHOP);

  if(typeof normalizeDescriptionBalance==='function'){
    const baseNormalize=normalizeDescriptionBalance;
    normalizeDescriptionBalance=function(input){const out=baseNormalize(input);addDefaultHealPotionsTo(out.items);return out;};
  }
  if(typeof validateDescriptionItems==='function'){
    const baseValidate=validateDescriptionItems;
    validateDescriptionItems=function(items){
      if(!Array.isArray(items))throw Error('道具資料無效');
      const fixed=items.filter(x=>!isHealPotion(x));
      baseValidate(fixed);
      const heals=items.filter(isHealPotion),ids=new Set(fixed.map(x=>x.id));
      if(!heals.length)throw Error('至少需要 1 種治療藥水');
      for(const item of heals){
        if(!item||!validId(item.id)||ids.has(item.id)||typeof item.name!=='string'||!item.name.trim()||typeof item.description!=='string')throw Error('治療藥水基本資料無效：'+(item?.id||'未知'));
        ids.add(item.id);
        if(item.element!==undefined&&item.element!==null&&item.element!=='')throw Error('治療藥水不可設定元素：'+item.id);
        if(!Number.isFinite(item.cost)||item.cost<0||!Number.isFinite(item.healFraction)||item.healFraction<=0||item.healFraction>1||!Number.isInteger(item.cooldown)||item.cooldown<0||item.cooldown>99||!Number.isInteger(item.duration??0)||(item.duration??0)!==0)throw Error('治療藥水數值無效：'+item.id);
        if(item.sellPrice!==undefined&&(!Number.isFinite(item.sellPrice)||item.sellPrice<0))throw Error('治療藥水賣價無效：'+item.id);
      }
      return items;
    };
  }
  if(typeof balanceReference==='function'){
    const baseReference=balanceReference;
    balanceReference=function(){const r=baseReference();r.itemTypes={...(r.itemTypes||{}),healPotion:'治療藥水；healFraction=最大生命恢復比例，cooldown=使用後等待的回合數；只能由自動喝藥機制使用。'};return r;};
  }
  if(typeof exportableBalance==='function'){
    const baseExport=exportableBalance;
    exportableBalance=function(){const out=baseExport();out.notes=[...(out.notes||[]),'items 中 type=healPotion 為治療藥水；healFraction 使用 0~1 比例，cooldown 使用回合。治療藥水沒有手動使用按鈕，只會依角色自動喝藥設定觸發。'];return out;};
  }

  function defaultHealPotionId(){return healPotionItems().find(x=>x.id==='heal_standard')?.id||healPotionItems()[0]?.id||'';}
  function healingInventory(){
    if(party?.members?.length){const owner=party.members[0];if(!owner.healingPotions||Array.isArray(owner.healingPotions)||typeof owner.healingPotions!=='object')owner.healingPotions={};return owner.healingPotions;}
    if(state){if(!state.healingPotions||Array.isArray(state.healingPotions)||typeof state.healingPotions!=='object')state.healingPotions={};return state.healingPotions;}
    return {};
  }
  function normalizeHeroHealingSettings(h){
    if(!h)return;
    if(typeof h.autoPotion!=='boolean')h.autoPotion=true;
    if(!Number.isFinite(h.autoPotionThresholdPct))h.autoPotionThresholdPct=Math.round((typeof GS==='function'?GS('combat.autoPotionThreshold',.35):.35)*100);
    h.autoPotionThresholdPct=Math.max(1,Math.min(99,Math.round(h.autoPotionThresholdPct)));
    if(typeof h.autoPotionId!=='string'||!healPotionItems().some(x=>x.id===h.autoPotionId))h.autoPotionId=defaultHealPotionId();
    if(!Number.isInteger(h.healPotionCooldownRemaining)||h.healPotionCooldownRemaining<0)h.healPotionCooldownRemaining=0;
  }
  const baseEnsureSharedItems=typeof ensureSharedItems==='function'?ensureSharedItems:null;
  function ensureHealingPotionState(){
    if(!party?.members?.length){if(state)normalizeHeroHealingSettings(state);return;}
    const owner=party.members[0],inv=healingInventory();
    for(let i=1;i<party.members.length;i++){
      const src=party.members[i].healingPotions;
      if(src&&typeof src==='object'&&!Array.isArray(src)){for(const [id,n] of Object.entries(src))if(Number.isInteger(n)&&n>0)inv[id]=(inv[id]||0)+n;delete party.members[i].healingPotions;}
    }
    if(party.sharedItems&&Number.isInteger(party.sharedItems.potions)&&party.sharedItems.potions>0){inv[defaultHealPotionId()]=(inv[defaultHealPotionId()]||0)+party.sharedItems.potions;party.sharedItems.potions=0;}
    for(const [id,n] of Object.entries(inv))if(!validId(id)||!Number.isInteger(n)||n<0||!healPotionItems().some(x=>x.id===id))delete inv[id];
    for(const h of party.members)normalizeHeroHealingSettings(h);
    owner.healingPotions=inv;
  }
  if(baseEnsureSharedItems){ensureSharedItems=function(){const out=baseEnsureSharedItems();ensureHealingPotionState();return out;};}

  function selectedHealPotion(h){normalizeHeroHealingSettings(h);return healPotionItems().find(x=>x.id===h.autoPotionId)||healPotionItems()[0]||null;}
  function healPotionCount(id){return Math.max(0,Math.floor(Number(healingInventory()[id])||0));}
  function setHealPotionCount(id,n){healingInventory()[id]=Math.max(0,Math.floor(Number(n)||0));}
  function useAutoHealingPotion(h){
    normalizeHeroHealingSettings(h);
    if(h.healPotionCooldownRemaining>0){h.healPotionCooldownRemaining--;return false;}
    if(!h.autoPotion||h.hp<=0)return false;
    const item=selectedHealPotion(h);if(!item||healPotionCount(item.id)<1)return false;
    const v=battleStats(h),threshold=Math.max(1,Math.min(99,h.autoPotionThresholdPct))/100;
    if(h.hp/v.hp>threshold||h.hp>=v.hp)return false;
    setHealPotionCount(item.id,healPotionCount(item.id)-1);
    const before=h.hp,amount=Math.max(1,Math.round(v.hp*item.healFraction));h.hp=Math.min(v.hp,h.hp+amount);
    const actual=Math.max(0,Math.round(h.hp-before));if(actual>0)recordCombatContribution(h,'healing',actual);h.healPotionCooldownRemaining=Math.max(0,Math.round(item.cooldown));
    note(`${characterName(h)}自動使用${item.name} · 恢復 ${actual} 生命（最大生命 ${pct(item.healFraction)}%）· 冷卻 ${item.cooldown} 回合`);
    return true;
  }
  globalThis.useAutoHealingPotion=useAutoHealingPotion;
  globalThis.setHeroAutoPotion=function(job,on){const h=party?.members.find(x=>x.job===job);if(!h)return;h.autoPotion=!!on;save();render();refreshHealingSettingsModal();};
  globalThis.setHeroAutoPotionThreshold=function(job,value){const h=party?.members.find(x=>x.job===job);if(!h)return;const n=Number(value);h.autoPotionThresholdPct=Number.isFinite(n)?Math.max(1,Math.min(99,Math.round(n))):35;save();render();refreshHealingSettingsModal();};
  globalThis.setHeroAutoPotionItem=function(job,id){const h=party?.members.find(x=>x.job===job);if(!h||!healPotionItems().some(x=>x.id===id))return;h.autoPotionId=id;save();render();refreshHealingSettingsModal();};
  globalThis.buyHealingPotion=function(id){const item=healPotionItems().find(x=>x.id===id);if(!item)return;if(state.gold<item.cost)return toast('金幣不足');state.gold-=item.cost;setHealPotionCount(id,healPotionCount(id)+1);save();render();};

  if(typeof tickHeroCooldowns==='function'){
    const baseTickHeroCooldowns=tickHeroCooldowns;
    tickHeroCooldowns=function(h){useAutoHealingPotion(h);return baseTickHeroCooldowns(h);};
  }
  if(typeof resetEncounter==='function'){
    const baseReset=resetEncounter;
    resetEncounter=function(){const out=baseReset();if(party)for(const h of party.members){normalizeHeroHealingSettings(h);h.healPotionCooldownRemaining=0;}return out;};
  }
  if(typeof spawnGroup==='function'){
    const baseSpawn=spawnGroup;
    spawnGroup=function(){const out=baseSpawn();if(party)for(const h of heroes()){normalizeHeroHealingSettings(h);h.healPotionCooldownRemaining=0;}return out;};
  }

  if(typeof supplyDetail==='function'){
    const baseSupplyDetail=supplyDetail;
    supplyDetail=function(item){if(isHealPotion(item))return `恢復最大生命 ${pct(item.healFraction)}% · 自動使用冷卻 ${Math.round(item.cooldown)} 回合 · 單價 ${Math.round(item.cost)} 金幣`;return baseSupplyDetail(item);};

    }).join('');
  }

  globalThis.openHealingSettings=function(refresh=false){
    if(!party)return;
    ensureHealingPotionState();
    const modal=$('modal');
    modal.dataset.view='healing-settings';
    modal.innerHTML=`<h2>自動喝水設定</h2><p class="small">設定各角色的 HP 門檻與使用藥水。介面中的「回合」定義可由探索控制右上角的「？」查看。</p><div class="heal-settings-modal">${healingSettingsRows()}</div><div class="actions"><button class="primary" onclick="closeModal()">完成</button></div>`;
    if(!modal.open)modal.showModal();
  };

  function refreshHealingSettingsModal(){
    const modal=$('modal');
    if(modal?.open&&modal.dataset.view==='healing-settings')openHealingSettings(true);
  }

  function healingControlPanel(){
    if(!party)return '';

      normalizeHeroHealingSettings(h);
