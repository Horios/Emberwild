      const supplyCards=SHOP.filter(x=>!isHealPotion(x)).map(item=>`<article class="card"><h3>${esc(item.name)}</h3><p class="item-flavor"><b>說明：</b>${esc(item.description||item.desc||'')}</p><p class="item-detail small"><b>詳細：</b>${esc(supplyDetail(item))}</p><div class="row"><span>共用 ${h.consumables[item.id]||0} 瓶</span><span>${item.cost} 金幣</span></div><div class="actions">${ownerControls(`<button onclick="buySupply('${item.id}')" ${h.gold<item.cost?'disabled':''}>購買</button><button onclick="useSupply('${item.id}')" ${!h.consumables[item.id]?'disabled':''}>對${esc(characterName(h))}使用</button>`,h.job)}</div></article>`).join('');
      const market=typeof marketCards==='function'?marketCards():'';
      const marketHead=party?.market?`<div class="actions market-refresh"><span>素材商品 · 第 ${party.market.serial} 批</span><button onclick="refreshMarket()">刷新商店 · ${MARKET_REFRESH_COST} 金幣</button></div>`:'';
      return `<div class="actions"><button onclick="showTestCodes()">兌換碼</button></div>`+heading('SUPPLIES / 全隊共用','商店')+pageSelector('shop')+`<section class="panel shared-shop-info"><b>道具設定角色：${esc(characterName(h))} · ${h.gold} 金幣</b>${uiHelp('補給說明','治療藥水購買後進入全隊共用庫存，只能在角色回合開始時依自動治療設定使用；沒有手動喝藥。元素附魔、抗性與增幅藥水仍可手動使用，效果以角色出戰回合計時。')}<p class="supply-countdown" data-job="${h.job}">${supplyStatus(h)||'目前無持續型消耗品效果'}</p></section>${marketHead}<div class="shared-shop-grid">${healCards}${market}${supplyCards}</div>`;
    };
  }

  if(typeof guideView==='function'){
    const baseGuide=guideView;
    guideView=function(){return `<section class="panel"><h2>自動治療藥水</h2><p>每名角色可設定自動喝藥開關、HP 百分比門檻與指定治療藥水。判定只發生在該角色回合開始時；使用治療藥水不會取消該回合原本的攻擊。治療藥水使用後依品項進入回合冷卻，冷卻期間不會再喝。治療藥水不提供手動使用按鈕。</p></section>`+baseGuide();};
  }

  if(typeof save==='function'){
    const baseSave=save;
    save=function(show=false){ensureHealingPotionState();return baseSave(show);};
  }

  // Recover a balance file containing healing potions even if an earlier boot pass
  // rejected its extended item list before this module was installed.
  try{
    ensureHealingPotionState();
    const raw=localStorage.getItem(BALANCE_KEY);
    if(raw){const cfg=JSON.parse(raw);applyBalanceConfig(cfg,{persist:false});}
    ensureHealingPotionState();
    if(state)save();
  }catch(e){console.warn('治療藥水設定載入失敗，使用內建預設值',e);addDefaultHealPotionsTo(SHOP);ensureHealingPotionState();}
  // Expose the healing inventory helpers for later shop / inventory UI modules.
  globalThis.ensureHealingPotionState=ensureHealingPotionState;
  globalThis.healPotionItems=healPotionItems;
  globalThis.isHealPotion=isHealPotion;
  globalThis.healPotionCount=healPotionCount;
  globalThis.setHealPotionCount=setHealPotionCount;
  globalThis.healingInventory=healingInventory;
  if(state)render();
})();
</script>

<script id="shop-inventory-overhaul-system">
/* Update 32: shop catalog configuration, escalating daily refresh cost, and inventory-only manual item use. */
(function installShopInventoryOverhaul(){
  const clone=v=>JSON.parse(JSON.stringify(v));
  const pctText=v=>Math.round((Number(v)||0)*10000)/100;
  const DEFAULT_SHOP_SETTINGS={
    randomOffers:{
      offerCount:6,
      refreshBaseCost:100,
      refreshCostStep:50,
      entries:[
        {id:'ore',enabled:true,type:'ore',key:'',name:'鍛鐵',description:'裝備強化常用素材。',quantityMin:8,quantityMax:20,unitPrice:12,weight:1,quantityScalesWithTier:true,priceScalesWithTier:false},
        {id:'dust',enabled:true,type:'dust',key:'',name:'粉塵',description:'裝備洗鍊與寶石相關用途的基礎素材。',quantityMin:3,quantityMax:8,unitPrice:25,weight:1,quantityScalesWithTier:false,priceScalesWithTier:false},
        {id:'gem',enabled:true,type:'gem',key:'random',name:'隨機技能寶石',description:'隨機出現一種技能寶石。',quantityMin:1,quantityMax:2,unitPrice:180,weight:.7,quantityScalesWithTier:false,priceScalesWithTier:false},
        {id:'region_material',enabled:true,type:'material',key:'region',name:'地區素材',description:'從目前探索區域的怪物素材中隨機挑選。',quantityMin:3,quantityMax:6,unitPrice:60,weight:1.3,quantityScalesWithTier:false,priceScalesWithTier:true}
      ]
    }
  };
  const SHOP_RULE_TYPES=new Set(['ore','dust','gem','material']);
  function normalizeRule(src,i){
    const type=SHOP_RULE_TYPES.has(src?.type)?src.type:'material';
    return {
      id:typeof src?.id==='string'&&src.id.trim()?src.id.trim():'rule_'+i,
      enabled:src?.enabled!==false,
      type,
      key:typeof src?.key==='string'?src.key:(type==='gem'?'random':type==='material'?'region':''),
      name:typeof src?.name==='string'?src.name:'',
      description:typeof src?.description==='string'?src.description:'',
      quantityMin:Number.isFinite(src?.quantityMin)?Math.max(1,Math.floor(src.quantityMin)):1,
      quantityMax:Number.isFinite(src?.quantityMax)?Math.max(1,Math.floor(src.quantityMax)):1,
      unitPrice:Number.isFinite(src?.unitPrice)?Math.max(0,Math.round(src.unitPrice)):1,
      weight:Number.isFinite(src?.weight)&&src.weight>0?src.weight:1,
      quantityScalesWithTier:!!src?.quantityScalesWithTier,
      priceScalesWithTier:!!src?.priceScalesWithTier
    };
  }
  function normalizeShopSettings(src){
    const raw=src?.randomOffers||{},fallback=DEFAULT_SHOP_SETTINGS.randomOffers;
    const entries=Array.isArray(raw.entries)&&raw.entries.length?raw.entries.map(normalizeRule):fallback.entries.map((x,i)=>normalizeRule(x,i));
    for(const r of entries)if(r.quantityMax<r.quantityMin)r.quantityMax=r.quantityMin;
    return {randomOffers:{
      offerCount:Number.isFinite(raw.offerCount)?Math.max(1,Math.min(24,Math.floor(raw.offerCount))):fallback.offerCount,
      refreshBaseCost:Number.isFinite(raw.refreshBaseCost)?Math.max(0,Math.round(raw.refreshBaseCost)):fallback.refreshBaseCost,
      refreshCostStep:Number.isFinite(raw.refreshCostStep)?Math.max(0,Math.round(raw.refreshCostStep)):fallback.refreshCostStep,
      entries
    }};
  }
  function validateShopSettings(x){
    const s=normalizeShopSettings(x),ids=new Set();
    for(const r of s.randomOffers.entries){
      if(!/^[A-Za-z0-9_-]{1,100}$/.test(r.id)||ids.has(r.id))throw Error('商店隨機商品規則 ID 無效或重複：'+r.id);ids.add(r.id);
      if(!SHOP_RULE_TYPES.has(r.type)||r.quantityMin<1||r.quantityMax<r.quantityMin||r.unitPrice<0||r.weight<=0)throw Error('商店隨機商品規則數值無效：'+r.id);
      if(r.type==='gem'&&!['random','0','1','2'].includes(String(r.key)))throw Error('隨機技能寶石 key 僅可為 random / 0 / 1 / 2：'+r.id);
      if(r.type==='material'&&typeof r.key!=='string')throw Error('隨機素材 key 無效：'+r.id);
    }
    return s;
  }
  let SHOP_SETTINGS=normalizeShopSettings();
  globalThis.__EMBERWILD_SHOP_SETTINGS=SHOP_SETTINGS;
  function syncItemShopFlags(items){
    const byId=new Map((items||[]).map(x=>[x.id,x]));
    for(const item of SHOP){const src=byId.get(item.id);item.shopEnabled=src?.shopEnabled===undefined?(item.shopEnabled!==false):src.shopEnabled!==false;}
  }
  for(const item of SHOP)if(typeof item.shopEnabled!=='boolean')item.shopEnabled=true;

  if(typeof validateBalanceConfig==='function'){
    const baseValidate=validateBalanceConfig;
    validateBalanceConfig=function(input){
      const copy=clone(input);copy.shopSettings=validateShopSettings(copy.shopSettings);
      if(Array.isArray(copy.items))for(const item of copy.items)if(item.shopEnabled===undefined)item.shopEnabled=true;else if(typeof item.shopEnabled!=='boolean')throw Error('商店上架設定必須為布林值：'+(item.id||'未知'));
      const out=baseValidate(copy);out.shopSettings=copy.shopSettings;
      if(Array.isArray(out.items)&&Array.isArray(copy.items)){const flags=new Map(copy.items.map(x=>[x.id,x.shopEnabled!==false]));for(const item of out.items)item.shopEnabled=flags.get(item.id)!==false;}
      return out;
    };
  }
  if(typeof applyBalanceConfig==='function'){
    const baseApply=applyBalanceConfig;
    applyBalanceConfig=function(input,{persist=true}={}){
      const copy=clone(input);copy.shopSettings=validateShopSettings(copy.shopSettings);if(Array.isArray(copy.items))for(const item of copy.items)if(item.shopEnabled===undefined)item.shopEnabled=true;
      const out=baseApply(copy,{persist:false});SHOP_SETTINGS=clone(copy.shopSettings);globalThis.__EMBERWILD_SHOP_SETTINGS=SHOP_SETTINGS;syncItemShopFlags(copy.items);
      if(persist)localStorage.setItem(BALANCE_KEY,JSON.stringify(exportableBalance()));if(state)render();return out;
    };
  }
  if(typeof exportableBalance==='function'){
    const baseExport=exportableBalance;
    exportableBalance=function(){const out=baseExport();out.shopSettings=clone(SHOP_SETTINGS);if(Array.isArray(out.items)){const byId=new Map(SHOP.map(x=>[x.id,x]));for(const item of out.items)item.shopEnabled=byId.get(item.id)?.shopEnabled!==false;}out.notes=[...(out.notes||[]),'shopSettings.randomOffers 控制商店頂端隨機商品、刷新起始價格與每次刷新加價。刷新次數依玩家本機日期於每日 0 點重置。','items[].shopEnabled 控制固定消耗品是否在商店上架；description 為商店與背包顯示說明。'];return out;};
  }
  try{const raw=localStorage.getItem(BALANCE_KEY);if(raw){const parsed=JSON.parse(raw);SHOP_SETTINGS=normalizeShopSettings(parsed.shopSettings);globalThis.__EMBERWILD_SHOP_SETTINGS=SHOP_SETTINGS;syncItemShopFlags(parsed.items);}}catch(e){console.warn('商店設定載入失敗，使用內建預設值',e);}

  function localDayKey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
  function syncMarketDay(){if(!party?.market)return false;const today=localDayKey();if(party.market.dayKey!==today){party.market.dayKey=today;party.market.refreshCount=0;return true;}if(!Number.isInteger(party.market.refreshCount)||party.market.refreshCount<0)party.market.refreshCount=0;return false;}
  function currentRefreshCost(){syncMarketDay();const s=SHOP_SETTINGS.randomOffers;return Math.max(0,Math.round(s.refreshBaseCost+s.refreshCostStep*(party?.market?.refreshCount||0)));}

  const validatePartyBase=typeof validateParty==='function'?validateParty:null;

  function itemVisibleInShop(item){return item?.shopEnabled!==false;}

<script id="pending-gear-bottom-compact-system">
/* Move pending equipment settlement below the equipment inventory. Collapsed
   mode intentionally keeps only one quality-count summary line visible. */
let pendingGearPanelCollapsed=true;
function pendingGearQualityCounts(){
  const names=(typeof AFFIX_RANK!=='undefined'&&Array.isArray(AFFIX_RANK))?AFFIX_RANK:['普通','精良','稀有','傳說'];
  return names.map((name,q)=>({name,q,list:(Array.isArray(pendingGearLoot)?pendingGearLoot:[]).filter(g=>gearQualityRank(g)===q)}));
}
function pendingGearBottomView(){
  const rows=pendingGearQualityCounts(),total=rows.reduce((n,r)=>n+r.list.length,0);
  const summary=rows.map(r=>`<span class="pending-gear-summary-count effect-quality-${r.q}">${esc(r.name)} ${r.list.length} 件</span>`).join('');
  const groups=rows.map(r=>{
    const totalSell=r.list.reduce((n,g)=>n+(typeof equipmentSellPrice==='function'?equipmentSellPrice(g):0),0);
    const unit=r.list.length&&typeof equipmentSellPrice==='function'?equipmentSellPrice(r.list[0]):0;
    return `<section class="pending-quality-group effect-quality-${r.q}"><div class="row"><b>${esc(r.name)} ${r.list.length} 件</b><span class="small">${r.list.length?`販售 ${unit}／件`:'—'}</span></div><div class="small">${r.list.slice(0,3).map(g=>esc(equipmentDisplayName(g))).join('、')}${r.list.length>3?'…':''}</div><div class="actions"><button onclick="claimPendingQuality(${r.q})" ${r.list.length?'':'disabled'}>領取</button><button onclick="salvagePendingQuality(${r.q})" ${r.list.length?'':'disabled'}>分解</button><button onclick="sellPendingQuality(${r.q})" ${r.list.length?'':'disabled'}>販售${r.list.length?' '+totalSell+'金':''}</button></div></section>`;
  }).join('');
  return `<details class="panel pending-gear-panel pending-gear-bottom" ${pendingGearPanelCollapsed?'':'open'} ontoggle="pendingGearPanelCollapsed=!this.open"><summary><span class="pending-gear-summary-title">待結算裝備 ${total} 件</span><span class="pending-gear-summary-counts">${summary}</span></summary><div class="pending-gear-expanded"><div class="row"><span class="small">可依品質直接領取、分解或販售；戰鬥掉落在結算前不會改變背包順序。</span><button onclick="claimPendingGearLoot()" ${!total||state.bag.length>=RULES.bagCapacity?'disabled':''}>全部結算並領取</button></div>${groups}</div></details>`;
}

// The legacy pending-loot wrapper prepended this block before the inventory.
// Empty it, then append the new compact block after the equipment inventory.
pendingGearLootView=function(){return '';};
const pendingGearBottomEquipmentBase=equipmentView;
equipmentView=function(){
  const html=pendingGearBottomEquipmentBase();
  return inventoryCategory==='equipment'?html+pendingGearBottomView():html;
};

</script>

<script id="skill-tooltip-autoreroll-system">
(()=>{
  function coreSkillNextCapLevel(skillLevel){
    if(skillLevel>=RULES.skillMax)return null;
    const current=state.lv;
    for(let lv=current+1;lv<=Math.max(current+120,120);lv++){
      if(skillCap({...state,lv})>skillLevel)return lv;
    }
    return null;
  }
  function coreSkillUpgradeReason(i){
    const sk=CLASSES[state.job]?.skills?.[i];if(!sk)return '技能資料不存在。';
    const reasons=[],level=state.skills[i]||0,advanced=skillRequiresAdvanced(sk,i),cap=skillCap();
    if(level>=RULES.skillMax)return `已達技能最高等級 Lv.${RULES.skillMax}。`;
    if(state.lv<sk[2])reasons.push(`需要角色 LV${sk[2]}（目前 LV${state.lv}）`);
    if(advanced&&!state.advanced)reasons.push('需要完成二轉');
    for(const req of skillPrerequisites(sk)){
      const have=skillPrerequisiteLevel(req,state),name=skillPrerequisiteName(state.job,req);
      if(have<req.level)reasons.push(`需要 ${name} Lv.${req.level}（目前 Lv.${have}）`);
    }
    if(level>=cap){const next=coreSkillNextCapLevel(level);reasons.push(next?`目前技能等級上限 Lv.${cap}；角色達 LV${next} 後可再升級`:`目前技能等級上限 Lv.${cap}`);}
    if(state.sp<1){const gain=Math.max(0,Math.round(GS('progression.levelRewards.skillPoints',2)));reasons.push(`需要 1 技能點（目前 ${state.sp}${gain?`；角色升級時獲得 ${gain} 點`:''}）`);}
    return reasons.length?'無法升級：'+reasons.join('；')+'。':'';
  }
  function supportSkillUpgradeReason(i){
    const sk=SUPPORT[state.job]?.[i];if(!sk)return '技能資料不存在。';
    const reasons=[],level=state.supportLevels[i]||0,max=Math.max(1,Math.floor(GS('skills.support.maxLevel',5)));
    if(level>=max)return `已達輔助技能最高等級 Lv.${max}。`;
    if(state.lv<sk.level)reasons.push(`需要角色 LV${sk.level}（目前 LV${state.lv}）`);
    if(i===2&&!state.advanced)reasons.push('需要完成二轉');
    for(const req of skillPrerequisites(sk)){
      const have=skillPrerequisiteLevel(req,state),name=skillPrerequisiteName(state.job,req);
      if(have<req.level)reasons.push(`需要 ${name} Lv.${req.level}（目前 Lv.${have}）`);
    }
    if(state.sp<1){const gain=Math.max(0,Math.round(GS('progression.levelRewards.skillPoints',2)));reasons.push(`需要 1 技能點（目前 ${state.sp}${gain?`；角色升級時獲得 ${gain} 點`:''}）`);}
    return reasons.length?'無法升級：'+reasons.join('；')+'。':'';
  }
  function skillUpgradeButton(html,reason){
    if(!reason)return `<span class="skill-upgrade-tip">${html}</span>`;
    const tip=esc(reason);
    return `<span class="skill-upgrade-tip" tabindex="0" data-tooltip="${tip}" title="${tip}" aria-label="${tip}">${html}</span>`;
  }

  function procEffectDetail(i){
    const sk=CLASSES[state.job].skills[i];
    if(sk[5]==='nextActiveDamage')return '觸發後：下次主動技能傷害 +'+Number((skillPower(i,state)*100).toFixed(1))+'%；使用下一個主動技能後消耗';
    if(sk[5]==='advanceNextRound')return '觸發後：下回合行動順序提前 1 格';
    if(sk[5]==='shieldLowest')return '觸發後：生命比例最低隊友獲得施放者攻擊力 '+Number((skillPower(i,state)*100).toFixed(1))+'% 的純護盾';
    return coreSkillDetail(state.job,i,state);
  }
  function compactCoreSkillRows(kind){
    syncHeroSkillArrays(state);ensureProcSlots(state);
    const slots=kind==='active'?Array.from({length:2},(_,i)=>state.active?.[i]??null):state.procSlots,clearFn=kind==='active'?'clearActiveSkill':'clearProcSkill',slotFn=kind==='active'?'equipSkill':'slotProcSkill';
    return `<div class="actions active-slot-summary">${slots.map((id,i)=>`<span>槽 ${i+1}：${id===null?'未配置':esc(CLASSES[state.job].skills[id]?.[0]||'未知技能')+skillTypeBadges(state.job,id)} <button onclick="${clearFn}(${i})">清空</button></span>`).join('')}</div><div class="skill-list">${CLASSES[state.job].skills.map((sk,i)=>({sk,i})).filter(x=>x.sk[1]===kind).map(({sk,i})=>{
      const advanced=skillRequiresAdvanced(sk,i),prereqs=skillPrerequisites(sk),prereqsMet=skillPrerequisitesMet(sk,state),locked=state.lv<sk[2]||(advanced&&!state.advanced)||!prereqsMet,gem=state.sockets[i]??null,reason=coreSkillUpgradeReason(i),disabled=!!reason,label=locked?'尚未解鎖':state.skills[i]?'升級1點':'學習',upgrade=skillUpgradeButton(`<button onclick="learn(${i})" ${disabled?'disabled':''}>${label}</button>`,reason),meta=kind==='proc'?ensureProcSkillMeta(state.job,i):null,chance=kind==='proc'?'<p>Lv1 基礎 '+Number((meta.procBaseChance*100).toFixed(1))+'% · 每升 1 級 +'+Number((meta.procChancePerLevel*100).toFixed(1))+'% · 目前 '+Number((procChance(i,state)*100).toFixed(1))+'%</p>':'',requirement=prereqs.length?'<p class="small">前置：'+esc(skillPrerequisiteLabel(state.job,sk))+'</p>':'';
      return `<article class="skill-list-row"><div><div class="skill-list-title"><b>${esc(sk[0])}</b><span>Lv.${state.skills[i]}/${RULES.skillMax}</span><span>${kind==='proc'?'普攻觸發':'主動'}</span></div>${skillTypeBadges(state.job,i)}${skillMechanicsDetails(state.job,i)}<p class="skill-flavor"><b>說明：</b>${esc(coreSkillFlavor(state.job,i))||'<span class="small">尚未填寫</span>'}</p><p class="skill-detail"><b>詳細：</b>${esc(kind==='proc'?procEffectDetail(i):coreSkillDetail(state.job,i,state))}</p>${requirement}${chance}</div><div class="skill-list-controls">${upgrade}${[0,1].map(slot=>`<button onclick="${slotFn}(${i},${slot})" ${!state.skills[i]?'disabled':''}>${slots[slot]===i?'已配置槽':'設為槽'} ${slot+1}</button>`).join('')}<label>寶石 <select aria-label="${esc(sk[0])}寶石" onchange="socket(${i},this.value)" ${!state.skills[i]?'disabled':''}><option value="-1" ${gem===null?'selected':''}>不鑲嵌</option>${GEMS.map((g,j)=>`<option value="${j}" ${gem===j?'selected':''} ${state.gems[j]<1&&gem!==j?'disabled':''}>${esc(g.name)} ×${state.gems[j]} · ${esc(g.desc)}</option>`).join('')}</select></label></div></article>`;
    }).join('')}</div>`;
  }
  coreSkillRows=function(){return compactCoreSkillRows('active');};
  globalThis.procSkillRows=function(){return `<div class="skill-page-intro"><h2>普攻觸發技能</h2><p class="small">配置 2 個普攻觸發槽；只有放入槽位的觸發技能會在普通攻擊後判定。</p></div>`+compactCoreSkillRows('proc');};

  supportSkillRows=function(){
    const max=Math.max(1,Math.floor(GS('skills.support.maxLevel',5)));
    return `<div class="actions">${state.supportSlots.map((id,i)=>`<span>槽 ${i+1}：${id===null?'未配置':esc(SUPPORT[state.job][id].name)+skillTypeBadges(state.job,id,'support')} <button onclick="slotSupport(null,${i})">清空</button></span>`).join('')}</div><div class="skill-list">${SUPPORT[state.job].map((sk,i)=>{
      const prereqs=skillPrerequisites(sk),reason=supportSkillUpgradeReason(i),disabled=!!reason,label=state.supportLevels[i]?'升級1點':'學習',requirement=prereqs.length?'<p class="small">前置：'+esc(skillPrerequisiteLabel(state.job,sk))+'</p>':'';
      const upgrade=skillUpgradeButton(`<button onclick="learnSupport(${i})" ${disabled?'disabled':''}>${label}</button>`,reason);
      return `<article class="skill-list-row"><div><div class="skill-list-title"><b>${esc(sk.name)}</b><span>Lv.${state.supportLevels[i]}/${max}</span><span>${ELEMENTS[sk.element]}</span></div>${skillTypeBadges(state.job,i,'support')}${skillMechanicsDetails(state.job,i,'support')}${requirement}<p class="skill-flavor"><b>說明：</b>${esc(sk.description||'')||'<span class="small">尚未填寫</span>'}</p><p class="skill-detail"><b>詳細：</b>${esc(supportSkillDetail(state.job,i,state))}</p></div><div class="skill-list-controls">${upgrade}${[0,1].map(slot=>`<button onclick="slotSupport(${i},${slot})" ${state.supportLevels[i]?'':'disabled'}>${state.supportSlots[slot]===i?'已配置槽':'設為槽'} ${slot+1}</button>`).join('')}</div></article>`;
    }).join('')}</div>`;
  };

  const autoRerollJobs=new Map();
  const autoRerollDelay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  function autoRerollJobKey(id){const g=findGear(id);return g?affixDraftKey(g):'shared:'+id;}
  function autoRerollTitle(meta){
    if(!meta)return '費用已扣除';
    const spent=`共花費 ${meta.gold} 金幣／${meta.ore} 鍛鐵`;
    if(meta.running)return `自動洗鍊第 ${meta.attempts} 次 · 未達${AFFIX_RANK[meta.target]}以上 · 1 秒後繼續 · ${spent}`;
    if(meta.reached)return `自動洗鍊 ${meta.attempts} 次 · 已達${AFFIX_RANK[meta.target]}以上 · ${spent}`;
    if(meta.stopped)return `自動洗鍊 ${meta.attempts} 次 · 已手動停止 · ${spent}`;
    if(meta.saveFailed)return `自動洗鍊 ${meta.attempts} 次 · 儲存失敗，已停止 · ${spent}`;
    return `自動洗鍊 ${meta.attempts} 次 · 資源不足，未達${AFFIX_RANK[meta.target]} · ${spent}`;
  }

  inlineAffixComparison=function(g){
    const key=affixDraftKey(g),draft=inlineAffixDrafts.get(key);if(!draft)return affixLockControls(g);
    const meta=autoRerollMeta.get(key),job=autoRerollJobs.get(key),running=!!job&&!job.stopped;
    const actions=running
      ?`<button class="danger" onclick="stopAutoReroll('${g.id}')">停止自動洗鍊</button><span class="small">目前結果會保留；停止後可選擇採用或保留原詞條。</span>`
      :`<button class="primary" onclick="resolveInlineAffix('${g.id}',true)">採用新詞條</button><button onclick="resolveInlineAffix('${g.id}',false)">保留原詞條</button>`;
    return `<section class="inline-affix-comparison${running?' auto-reroll-running':''}"><h3>洗鍊結果${meta?` <span class="auto-reroll-status">${esc(autoRerollTitle(meta))}</span>`:''}</h3><div class="affix-compare-columns"><div><b>目前詞條</b>${g.affix.map(a=>affixHTML(a,g)).join('')||'<p>無詞條</p>'}</div><div><b>${running?'本次結果':'新詞條'}</b>${draft.map(a=>affixHTML(a,g)).join('')}</div></div><div class="actions">${actions}</div></section>`;
  };

  function stopAutoReroll(id){
    const g=findGear(id);if(!g)return;
    const key=affixDraftKey(g),job=autoRerollJobs.get(key);if(!job)return toast('這件裝備目前沒有自動洗鍊');
    job.stopped=true;autoRerollJobs.delete(key);
    const meta=autoRerollMeta.get(key);if(meta){meta.running=false;meta.stopped=true;}
    render();toast(`已停止自動洗鍊；目前保留第 ${meta?.attempts||0} 次結果`);
  }
  globalThis.stopAutoReroll=stopAutoReroll;

  async function runAutoReroll(job){
    const {id,targetRank,hero,key}=job;
    while(!job.stopped){
      if(!party?.members?.includes(hero)){job.stopped=true;break;}
      const g=withHero(hero,()=>findGear(id));if(!g){job.stopped=true;break;}
      const cost=withHero(hero,()=>rerollCostFor(g));
      if(hero.gold<cost.gold||hero.ore<cost.ore)break;
      const previous={gold:hero.gold,ore:hero.ore,rerolled:g.rerolled,draft:inlineAffixDrafts.get(key),meta:autoRerollMeta.get(key)};
      const draft=withHero(hero,()=>rollAffixes(g));
      job.attempts++;
      job.gold+=cost.gold;job.ore+=cost.ore;
      hero.gold-=cost.gold;hero.ore-=cost.ore;g.rerolled=true;
      inlineAffixDrafts.set(key,draft);
      const reached=draft.some(a=>(a.rank??0)>=targetRank);
      autoRerollMeta.set(key,{attempts:job.attempts,target:targetRank,reached,running:!reached,stopped:false,gold:job.gold,ore:job.ore});
      const saved=withHero(hero,()=>save());
      if(!saved){
        hero.gold=previous.gold;hero.ore=previous.ore;
        if(previous.rerolled===undefined)delete g.rerolled;else g.rerolled=previous.rerolled;
        if(previous.draft===undefined)inlineAffixDrafts.delete(key);else inlineAffixDrafts.set(key,previous.draft);
        if(previous.meta===undefined)autoRerollMeta.delete(key);else autoRerollMeta.set(key,previous.meta);
        job.gold-=cost.gold;job.ore-=cost.ore;job.attempts--;
        autoRerollMeta.set(key,{attempts:job.attempts,target:targetRank,reached:false,running:false,stopped:false,saveFailed:true,gold:job.gold,ore:job.ore});
        autoRerollJobs.delete(key);render();return;
      }
      render();
      if(reached){
        autoRerollJobs.delete(key);
        const meta=autoRerollMeta.get(key);if(meta)meta.running=false;
        render();toast(`自動洗鍊 ${job.attempts} 次，已出現${AFFIX_RANK[targetRank]}以上詞條`);return;
      }
      await autoRerollDelay(1000);
    }
    if(job.stopped)return;
    autoRerollJobs.delete(key);
    const meta=autoRerollMeta.get(key);
    if(meta){meta.running=false;meta.stopped=false;}
    render();toast(job.attempts?`資源不足：已洗鍊 ${job.attempts} 次，尚未出現${AFFIX_RANK[targetRank]}以上詞條`:'金幣或鍛鐵不足');
  }

  autoReroll=function(id,targetRank){
    const g=findGear(id);if(!g)return;targetRank=Number(targetRank);if(![2,3].includes(targetRank))return;
    const key=affixDraftKey(g);if(autoRerollJobs.has(key))return toast('這件裝備正在自動洗鍊');
    if(inlineAffixDrafts.has(key))return toast('請先採用或保留這件裝備的詞條');
    if(g.affixLock!==undefined)return toast('自動洗鍊不支援鎖定詞條，請先取消鎖定');
    const cost=rerollCostFor(g);if(state.gold<cost.gold||state.ore<cost.ore)return toast('金幣或鍛鐵不足');
    const job={id,targetRank,hero:state,key,attempts:0,gold:0,ore:0,stopped:false};
    autoRerollJobs.set(key,job);
    setTimeout(()=>{if(autoRerollJobs.get(key)===job)void runAutoReroll(job);},0);
  };

  const skillRerollResolveBase=resolveInlineAffix;
  resolveInlineAffix=function(id,accept){
    const key=autoRerollJobKey(id);if(autoRerollJobs.has(key))return toast('請先停止自動洗鍊');
    return skillRerollResolveBase(id,accept);
  };
  if(typeof resetSession==='function'){
    const skillRerollResetBase=resetSession;
    resetSession=function(...args){for(const job of autoRerollJobs.values())job.stopped=true;autoRerollJobs.clear();return skillRerollResetBase(...args);};
  }
  if(state)render();
})();
</script>

<script id="forge-list-navigation-system">
(()=>{
  let forgeSortKey='equipped';
  let forgeSortDirection='desc';

  function forgeSortValue(g,key){
    if(key==='equipped')return gearWearer(g.id)?1:0;
    if(key==='tier')return Number(g.tier)||0;
    if(key==='plus')return Number(g.plus)||0;
    if(key==='quality')return gearQualityRank(g);
    if(key==='slot')return Number(g.slot)||0;
    if(key==='job')return g.slot===1?-1:(Number(g.job)||0);
    return 0;
  }
  function forgeSortedGear(){
    const items=[...state.bag];
    items.sort((a,b)=>{
      let diff=0;
      if(forgeSortKey==='name')diff=equipmentDisplayName(a).localeCompare(equipmentDisplayName(b),'zh-Hant');
      else diff=forgeSortValue(a,forgeSortKey)-forgeSortValue(b,forgeSortKey);
      if(diff!==0)return forgeSortDirection==='asc'?diff:-diff;
      const wornDiff=Number(!!gearWearer(b.id))-Number(!!gearWearer(a.id));
      if(wornDiff)return wornDiff;
      const qualityDiff=gearQualityRank(b)-gearQualityRank(a);if(qualityDiff)return qualityDiff;
      const tierDiff=(b.tier||0)-(a.tier||0);if(tierDiff)return tierDiff;
      const plusDiff=(b.plus||0)-(a.plus||0);if(plusDiff)return plusDiff;
      return equipmentDisplayName(a).localeCompare(equipmentDisplayName(b),'zh-Hant');
    });
    return items;
  }
  function forgeSortLabel(){
    return forgeSortDirection==='desc'?'高 → 低':'低 → 高';
  }
  globalThis.setForgeSort=function(key){
    if(!['equipped','tier','plus','quality','slot','job','name'].includes(key))return;
    forgeSortKey=key;render();
  };
  globalThis.toggleForgeSortDirection=function(){forgeSortDirection=forgeSortDirection==='desc'?'asc':'desc';render();};

  function forgeListItem(g,selected){
    const wearer=gearWearer(g.id),quality=gearQualityRank(g);
    const role=gearWearableJobsText(g);
    const meta=[role,CLASS_GEAR[g.job][g.slot],`LV ${gearRequiredLevelByTier(g.tier)}`,wearer?`${characterName(wearer)}已穿戴`:'未穿戴',g.boss!==undefined?'BOSS 專屬':''].filter(Boolean).join(' · ');
    return `<button type="button" class="forge-gear-item ${selected?'selected':''}" onclick="chooseForge('${g.id}')" title="${esc(equipmentDisplayName(g))}"><span class="forge-gear-name">${equipmentNameHTML(g)}</span><span class="forge-gear-quality effect-quality-${quality}">${qualityTag(g)}</span><span class="forge-gear-meta">${esc(meta)}</span></button>`;
  }

  function forgeDetail(g){
    if(!g)return `<div class="empty">背包沒有裝備，請先探索取得裝備。</div>`;
    const wearer=gearWearer(g.id),draft=inlineAffixDrafts.has(affixDraftKey(g)),cost=rerollCostFor(g);
    const role=gearWearableJobsText(g);
    return `<div class="gear-detail-header"><div><span class="tag">${qualityTag(g)}</span><h2>${equipmentNameHTML(g)}</h2><p class="small">${role} · ${CLASS_GEAR[g.job][g.slot]} · LV${gearRequiredLevelByTier(g.tier)}${wearer?' · '+esc(characterName(wearer))+'已穿戴':''}</p></div></div><div class="forge-layout"><article class="forge-preview"><h3>目前能力</h3><p class="equipment-total-summary">${globalThis.equipmentTotalSummaryText(g)}</p>${globalThis.equipmentAttributeDetailsHTML(g)}</article><div class="forge-controls"><section class="forge-action"><h3>強化基礎能力</h3>${g.plus<RULES.enhanceMax?`<p class="green">下一級 +${g.plus+1}：${globalThis.equipmentTotalSummaryText({...g,plus:g.plus+1})}</p><p class="small">費用：${upgradeCostText(g)} · 成功率 100%</p><button class="primary" onclick="enhance('${g.id}')" ${!canEnhance(g)?'disabled':''}>強化至 +${g.plus+1}</button>`:`<p class="gold">已達 +${RULES.enhanceMax} 強化上限。</p>`}</section><section class="forge-action"><h3>洗鍊隨機詞條</h3>${uiHelp('洗鍊說明','每條詞條品質：'+qualityChanceText()+'。重骰時逐次扣款；自動洗鍊會在至少出現一條指定品質以上詞條時停止，每個未達條件的結果停留 1 秒。')}<p>◈ ${cost.gold} 金幣 ＋ ${cost.ore} 鍛鐵／次</p><div class="actions"><button onclick="reroll('${g.id}')" ${draft||state.gold<cost.gold||state.ore<cost.ore?'disabled':''}>洗鍊一次</button><button onclick="autoReroll('${g.id}',2)" ${draft||state.gold<cost.gold||state.ore<cost.ore?'disabled':''}>自動洗到稀有+</button><button onclick="autoReroll('${g.id}',3)" ${draft||state.gold<cost.gold||state.ore<cost.ore?'disabled':''}>自動洗到傳說</button></div></section></div></div>${inlineAffixComparison(g)}`;
  }

  // Backpack no longer performs strengthening or rerolling directly. All such
  // actions preserve the selected gear and move to the dedicated forge page.
  inventoryGearDetail=function(g){
    if(!g)return `<div class="inventory-detail-empty"><b>沒有可顯示的裝備</b><p class="small">調整左側篩選條件後選擇裝備。</p></div>`;
    const wearer=gearWearer(g.id),worn=!!wearer,draft=inlineAffixDrafts.has(affixDraftKey(g)),locked=!!g.locked;
    const wearButtons=eligibleWearers(g).map(h=>`<button class="primary" onclick="previewEquip('${g.id}',${h.job})" ${h.equipped.includes(g.id)?'disabled':''}>${h.equipped.includes(g.id)?esc(characterName(h))+'已穿戴':'給 '+esc(characterName(h))+' 穿戴'}</button>`).join('');
    return `<div class="inventory-detail-pane"><div class="inventory-detail-heading"><div><div class="eyebrow">EQUIPMENT DETAIL / 裝備詳細</div><h2>${equipmentNameHTML(g)}</h2></div><span class="tag">${qualityTag(g)}${locked?' · 已鎖定':''}</span></div><div class="inventory-detail-meta">${gearWearableJobsText(g)} · ${CLASS_GEAR[g.job][g.slot]} · LV ${gearRequiredLevelByTier(g.tier)}${worn?' · 目前由 '+esc(characterName(wearer))+' 穿戴':''}</div><section class="inventory-detail-section"><h3>裝備能力</h3><p class="inventory-detail-stats equipment-total-summary">${globalThis.equipmentTotalSummaryText(g)}</p>${globalThis.equipmentAttributeDetailsHTML(g)}</section><section class="inventory-detail-section"><h3>操作</h3><div class="actions inventory-detail-actions">${wearButtons||'<span class="small">尚無可穿戴角色</span>'}<button onclick="openForge('${g.id}')">強化／洗鍊</button><button onclick="toggleGearLock('${g.id}')">${locked?'解除鎖定':'鎖定'}</button><button class="danger" onclick="salvage('${g.id}')" ${worn||draft||locked?'disabled':''}>分解</button></div>${draft?'<p class="inventory-detail-forge-note">這件裝備有待確認的洗鍊結果，請前往「裝備強化」處理。</p>':''}</section></div>`;
  };

  // Forge is now an account-level workbench: no character tabs, a sortable
  // equipment list on the left, and the selected equipment controls on right.
  forgeView=function(){
    ensureSharedGear();ensureAccountResources();
    const items=forgeSortedGear();
    if(items.length&&!items.some(g=>g.id===forgeSelection))forgeSelection=items[0].id;
    if(!items.length)forgeSelection=null;
    const selected=items.find(g=>g.id===forgeSelection)||null;
    const sortOptions=[['equipped','穿戴狀態'],['tier','裝備階級'],['plus','強化等級'],['quality','詞條品質'],['slot','部位'],['job','職業'],['name','名稱']];
    return heading('FORGE / 裝備強化','強化與洗鍊',`<span class="tag">${items.length} 件裝備</span>`)+`<section class="panel forge-account-shell">${resourceLine()}${uiHelp('強化說明','背包與強化資源皆為帳號共用；此頁直接從左側裝備列表選擇目標，不需要先選角色。強化必定成功，最高 +'+RULES.enhanceMax+'。')}<div class="forge-workbench"><section class="forge-gear-pane"><div class="forge-gear-toolbar"><div class="row"><b>選擇裝備</b><span class="small">${items.length} 件</span></div><div class="row"><label>排序 <select onchange="setForgeSort(this.value)">${sortOptions.map(([value,label])=>`<option value="${value}" ${forgeSortKey===value?'selected':''}>${label}</option>`).join('')}</select></label><button class="forge-sort-direction" onclick="toggleForgeSortDirection()">${forgeSortLabel()}</button></div></div><div class="forge-gear-list">${items.map(g=>forgeListItem(g,g===selected)).join('')||'<p class="inventory-list-empty">背包沒有裝備。</p>'}</div></section><section class="forge-detail-pane">${forgeDetail(selected)}</section></div></section>`;
  };

  if(state)render();
})();
</script>


<script id="support-debuff-mechanics-v2">
/* Debuff mechanics v2:
   followup  = target is hit -> extra caster ATK% elemental damage; applies defense, element matchup and target damage reduction.
   dotAttack = before target acts -> fixed caster ATK% damage; ignores all damage modifiers.
   dotMaxHp  = before target acts -> fixed target max-HP% damage; ignores all damage modifiers.
   damageAmp = target is hit -> that triggering hit is increased by value%.
*/
(()=>{
  const SUPPORT_DEBUFF_KINDS=new Set(['followup','dotAttack','dotMaxHp','damageAmp']);
  const SUPPORT_ELEMENT_KEYS=new Set(['physical','fire','ice','wind','light','shadow']);
  const SUPPORT_COMBAT_DEFAULTS={baseCritRate:0,baseCritDamage:1.5,defensePenetration:0,defenseIgnore:0};

  function normalizeSupportCombatSkill(sk){
    if(!sk||typeof sk!=='object')return sk;
    const baseCritDamage=GS('combat.baseCritDamage',SUPPORT_COMBAT_DEFAULTS.baseCritDamage);
    sk.baseCritRate=Number.isFinite(Number(sk.baseCritRate))?Math.max(0,Math.min(1,Number(sk.baseCritRate))):SUPPORT_COMBAT_DEFAULTS.baseCritRate;
    sk.baseCritDamage=Number.isFinite(Number(sk.baseCritDamage))?Math.max(1,Number(sk.baseCritDamage)):baseCritDamage;
    sk.defensePenetration=Number.isFinite(Number(sk.defensePenetration))?Math.max(0,Number(sk.defensePenetration)):SUPPORT_COMBAT_DEFAULTS.defensePenetration;
    sk.defenseIgnore=Number.isFinite(Number(sk.defenseIgnore))?Math.max(0,Math.min(1,Number(sk.defenseIgnore))):SUPPORT_COMBAT_DEFAULTS.defenseIgnore;
    return sk;
  }

  function normalizeSupportDebuffSkill(sk){
    if(!sk||typeof sk!=='object')return sk;
    // Backward compatibility: old vulnerable was a generic damage-taken multiplier.
    // Elemental Brand is intentionally migrated to the new elemental follow-up model.
    if(sk.kind==='vulnerable')sk.kind=sk.name==='元素灼印'?'followup':'damageAmp';
    if(!SUPPORT_ELEMENT_KEYS.has(sk.element))sk.element=sk.kind==='followup'?'fire':'physical';
    if(sk.kind==='followup'&&sk.element==='physical'&&sk.name==='元素灼印')sk.element='fire';
    normalizeSupportCombatSkill(sk);
    return sk;
  }
  function normalizeAllSupportDebuffs(){for(const list of SUPPORT)for(const sk of list)normalizeSupportDebuffSkill(sk);}
  normalizeAllSupportDebuffs();

  Object.assign(EFFECT_NAMES,{
    followup:'受擊追打',
    dotAttack:'行動前持續傷害（施放者攻擊）',
    dotMaxHp:'行動前持續傷害（最大生命）',
    damageAmp:'受擊傷害增加'
  });

  function supportEffectDescription(sk,valuePct){
    const element=SUPPORT_ELEMENT_KEYS.has(sk.element)?sk.element:'physical';
    if(sk.kind==='followup')return `受擊時追打：施放者攻擊 ${valuePct}% 的${ELEMENTS[element]}屬性傷害（吃防禦、屬性克制與減傷）`;
    if(sk.kind==='dotAttack')return `自身行動前：受到施放者攻擊 ${valuePct}% 的固定傷害（不吃任何增減傷）`;
    if(sk.kind==='dotMaxHp')return `自身行動前：受到自身最大生命 ${valuePct}% 的固定傷害（不吃任何增減傷）`;
    if(sk.kind==='damageAmp')return `受到攻擊時：該次攻擊傷害增加 ${valuePct}%`;
    return `${EFFECT_NAMES[sk.kind]||sk.kind} ${valuePct}%`;
  }

  // Keep support effects self-contained so imported JSON immediately gains the new semantics.
  castSupport=function(h,index){
    const sk=normalizeSupportDebuffSkill(SUPPORT[h.job][index]);
    let targets=sk.target==='allies'?living().map(heroKey):sk.target==='weakest'?[heroKey([...living()].sort((a,b)=>a.hp/solo.stats(a).hp-b.hp/solo.stats(b).hp)[0])]:sk.target==='enemies'?foes.filter(e=>e.hp>0).map(e=>e.id):[foes.find(e=>e.hp>0)?.id];
    for(const target of targets.filter(Boolean)){
      effects=effects.filter(e=>!(e.source===h.job&&e.skill===index&&e.target===target));
      effects.push({source:h.job,skill:index,target,kind:sk.kind,element:sk.element,value:supportAmount(h.job,index),until:partyClock+Math.max(0,Math.round(sk.duration)),name:sk.name});
      if(sk.kind==='regen'){const ally=party.members.find(a=>heroKey(a)===target);if(ally){const before=ally.hp;ally.hp=Math.min(solo.stats(ally).hp,ally.hp+solo.stats(ally).hp*supportAmount(h.job,index));const recovered=Math.max(0,ally.hp-before);if(recovered>0)recordCombatContribution(h,'healing',recovered);}}
    }
    note(characterName(h)+'施放 '+sk.name+' · '+Math.round(sk.duration)+' 回合');
  };

  function followupEffects(targetId){return effects.filter(e=>e.target===targetId&&e.kind==='followup'&&e.until>partyClock);}
  function triggerFollowupDebuffs(target){
    if(!target||target.hp<=0)return 0;
    let total=0;
    for(const fx of followupEffects(target.id)){
      if(target.hp<=0)break;
      const sk=normalizeSupportDebuffSkill(SUPPORT[fx.source]?.[fx.skill]);
      const caster=party?.members?.find(h=>h.job===fx.source);
      if(!sk||!caster)continue;
      const element=SUPPORT_ELEMENT_KEYS.has(sk.element)?sk.element:'physical';
      // Elemental follow-up damage uses the same defense order as normal skills:
      // fracture -> percentage defense ignore -> flat defense penetration.
      // It may crit with the caster's stats plus this support skill's editable baseline,
      // but still does not inherit attacker-side element/race bonuses, lifesteal or damageAmp/vulnerable.
      const v=battleStats(caster),cap=GAMEPLAY_SETTINGS.combat.caps,formula=GAMEPLAY_SETTINGS.combat.damageFormula||{},meta=normalizeSupportCombatSkill(sk);
      const raw=Math.max(1,v.atk*Math.max(0,Number(fx.value)||0)),fracture=Math.min(cap.fracture,effectTotal(target.id,'fracture'));
      const ignore=Math.min(GAME_BALANCE.combat.statCaps.defenseIgnore??.75,Math.max(0,(v.defenseIgnore||0)+meta.defenseIgnore));
      const penetration=Math.min(GAME_BALANCE.combat.statCaps.pierce,Math.max(0,(v.pierce||0)+meta.defensePenetration));
      const afterIgnore=Math.max(0,Math.max(0,Number(target.def)||0)*(1-fracture)*(1-ignore)),effectiveDefense=Math.max(0,afterIgnore-penetration);
      const attackCoefficient=Number.isFinite(formula.attackCoefficient)?formula.attackCoefficient:1,defenseCoefficient=Number.isFinite(formula.defenseCoefficient)?formula.defenseCoefficient:(GAMEPLAY_SETTINGS.combat.defenseEffectiveness??.55),minimumDamage=Math.max(0,Number.isFinite(formula.minimumDamage)?formula.minimumDamage:1);
      let followup=Math.max(minimumDamage,Math.round(raw*attackCoefficient-effectiveDefense*defenseCoefficient));
      const critChance=Math.min(GAME_BALANCE.combat.statCaps.crit,Math.max(0,v.crit+meta.baseCritRate)),crit=Math.random()<critChance,baseCrit=GS('combat.baseCritDamage',1.5),critDamage=Math.max(1,meta.baseCritDamage+(v.critDamage-baseCrit));
      if(crit)followup=Math.round(followup*critDamage);
      followup=Math.max(minimumDamage,Math.round(followup*elementFactor(element,target.element)));
      followup=Math.max(minimumDamage,Math.round(followup*(1-Math.min(cap.guard,effectTotal(target.id,'guard')))));
      const dealt=Math.min(target.hp,followup);
      target.hp=Math.max(0,target.hp-dealt);
      if(dealt>0)recordCombatContribution(caster,'damage',dealt);
      total+=dealt;
      note(`${fx.name}追打 [${ELEMENTS[element]}] → ${target.name} ${dealt} 傷害${crit?'（暴擊）':''}`);
    }
    return total;
  }

  // Final damage resolver: damageAmp increases only the triggering attack.
  // Legacy vulnerable remains accepted as a compatibility alias for old imported configs.
  resolveHit=function(e,amount,h,element,crit){
    const v=battleStats(h),cap=GAMEPLAY_SETTINGS.combat.caps,formula=GAMEPLAY_SETTINGS.combat.damageFormula||{},fracture=Math.min(cap.fracture,effectTotal(e.id,'fracture'));
    const ignore=Math.min(GAME_BALANCE.combat.statCaps.defenseIgnore??.75,Math.max(0,v.defenseIgnore||0)),penetration=Math.min(GAME_BALANCE.combat.statCaps.pierce,Math.max(0,v.pierce||0));
    const afterIgnore=Math.max(0,e.def*(1-fracture)*(1-ignore)),effectiveDefense=Math.max(0,afterIgnore-penetration);
    const attackCoefficient=Number.isFinite(formula.attackCoefficient)?formula.attackCoefficient:1,defenseCoefficient=Number.isFinite(formula.defenseCoefficient)?formula.defenseCoefficient:(GAMEPLAY_SETTINGS.combat.defenseEffectiveness??.55),minimumDamage=Math.max(0,Number.isFinite(formula.minimumDamage)?formula.minimumDamage:1);
    let d=Math.max(minimumDamage,Math.round(amount*attackCoefficient-effectiveDefense*defenseCoefficient));
    if(crit)d=Math.round(d*v.critDamage);
    const tonic=activeSupply(h,'elementTonic'),bonus=(v.elementDamage[element]||0)+(element==='physical'?0:v.elementBonus)+(tonic&&tonic.element===element?GS('combat.supply.elementTonicDamage',.2):0);
    const amp=effectTotal(e.id,'damageAmp')+effectTotal(e.id,'vulnerable');
    d=Math.max(minimumDamage,Math.round(d*elementFactor(element,e.element)*(1+bonus)*(1+(v.raceDamage[e.race]||0))*(1+amp)));
    const actual=Math.min(e.hp,d);
    e.hp=Math.max(0,e.hp-d);
    if(actual>0)recordCombatContribution(h,'damage',actual);
    const beforeLifesteal=h.hp;
    h.hp=Math.min(v.hp,h.hp+actual*v.lifesteal);
    const lifestealHealing=Math.max(0,h.hp-beforeLifesteal);if(lifestealHealing>0)recordCombatContribution(h,'healing',lifestealHealing);
    if(actual>0&&e.hp>0)triggerFollowupDebuffs(e);
    return actual;
  };

  function tickFixedDotBeforeEnemyAction(e){
    if(!e||e.hp<=0)return 0;
    let total=0;
    const dots=effects.filter(fx=>fx.target===e.id&&fx.until>partyClock&&(fx.kind==='dotAttack'||fx.kind==='dotMaxHp'));
    for(const fx of dots){
      if(e.hp<=0)break;
      const caster=party?.members?.find(h=>h.job===fx.source);
      let raw=0;
      if(fx.kind==='dotAttack'){
        if(caster)raw=battleStats(caster).atk*Math.max(0,Number(fx.value)||0);
      }else raw=(Number(e.maxhp)||Number(e.hp)||1)*Math.max(0,Number(fx.value)||0);
      // DOT is deliberately fixed damage: direct HP loss, no defense, resistance, guard, amp, reduction, crit or element factor.
      const dealt=Math.min(e.hp,Math.max(1,Math.round(raw)));
      e.hp=Math.max(0,e.hp-dealt);
      if(dealt>0&&caster)recordCombatContribution(caster,'damage',dealt);
      total+=dealt;
      note(`${fx.name} → ${e.name} ${dealt} 持續傷害`);
    }
    return total;
  }

  const debuffPerformEnemyActionBase=performEnemyAction;
  performEnemyAction=function(e){
    tickFixedDotBeforeEnemyAction(e);
    if(!e||e.hp<=0){note((e?.name||'敵人')+'受到持續傷害倒下，未能行動。');return 'dot';}
    return debuffPerformEnemyActionBase(e);
  };

  supportSkillDetail=function(job,i,h=state){
    const sk=normalizeSupportDebuffSkill(SUPPORT[job]?.[i]);if(!sk)return '';
    const level=Math.max(1,h?.supportLevels?.[i]||1),value=+(sk.value*(1+(level-1)*(Number.isFinite(sk.effectPerLevel)?sk.effectPerLevel:GS('skills.support.effectPerExtraLevel',.2)))*100).toFixed(1),cd=supportSkillCooldown(h,i);
    const elementText=sk.kind==='followup'?`${actionTurnElementLabel(sk.element)} · `:'';
    const combatText=sk.kind==='followup'?` · 基礎暴率 +${Number((sk.baseCritRate*100).toFixed(1))}% · 基礎暴傷 ${Number((sk.baseCritDamage*100).toFixed(1))}% · 防穿 +${Number(sk.defensePenetration.toFixed(2))} · 防無 +${Number((sk.defenseIgnore*100).toFixed(1))}%`:'';
    return `${elementText}目標 ${TARGET_NAMES[sk.target]} · ${supportEffectDescription(sk,value)}${combatText} · 持續 ${Math.round(sk.duration)} 戰鬥回合 · 冷卻 ${cd} 回合 · 需求 LV${sk.level}${i===2?'／二轉':''}`;
  };

  battleBuffRows=function(){
    const rows=[],row=(who,name,detail,time,clock)=>`<tr><td>${esc(who)}</td><td>${esc(name)}</td><td>${esc(detail)}</td><td class="buff-time">${esc(time)}</td><td>${esc(clock)}</td></tr>`;
    const names={attack:'攻擊提升',power:'技能威力提升',guard:'傷害減免',fracture:'防禦降低',weaken:'攻擊降低',vulnerable:'承受傷害增加（舊版）',damageAmp:'受擊傷害增加',critical:'暴擊率提升',regen:'每回合恢復最大生命',followup:'受擊追打',dotAttack:'行動前 DOT（攻擊%）',dotMaxHp:'行動前 DOT（最大生命%）'};
    for(const e of effects.filter(e=>e.until>partyClock)){
      const h=party.members.find(h=>heroKey(h)===e.target),foe=foes.find(f=>f.id===e.target);if(!h&&!foe)continue;const sk=normalizeSupportDebuffSkill(SUPPORT[e.source]?.[e.skill]),total=Math.max(0,Math.round(sk?.duration??0));
      let detail=(names[e.kind]||e.kind)+' '+Number((e.value*100).toFixed(1))+'%';
      if(e.kind==='followup')detail=`受擊時追打 ${Number((e.value*100).toFixed(1))}% 施放者攻擊 · ${ELEMENTS[sk?.element||'physical']}屬性 · 吃防禦／克制／減傷`;
      else if(e.kind==='dotAttack')detail=`自身行動前固定傷害 · ${Number((e.value*100).toFixed(1))}% 施放者攻擊`;
      else if(e.kind==='dotMaxHp')detail=`自身行動前固定傷害 · ${Number((e.value*100).toFixed(1))}% 最大生命`;
      rows.push(row(h?characterName(h):foe.name,e.name,detail,Math.max(0,Math.ceil(e.until-partyClock))+' / '+(total||'—')+' 回合','戰鬥回合'));
    }
    for(const h of party.members){
      const who=characterName(h)+(party.active.includes(h.job)?'':'（候補）');
      for(const key of ['imbue','ward','elementTonic']){const b=activeSupply(h,key);if(!b)continue;const labels={imbue:['附魔藥水','普攻改為'+ELEMENTS[b.element]+'屬性'],ward:['抗性藥水',ELEMENTS[b.element]+'傷害減免 '+Math.round(GS('combat.supply.wardResistance',.25)*10000)/100+'%'],elementTonic:['增幅藥水',ELEMENTS[b.element]+'傷害增加 '+Math.round(GS('combat.supply.elementTonicDamage',.2)*10000)/100+'%']};rows.push(row(who,ELEMENTS[b.element]+labels[key][0],labels[key][1],Math.ceil(b.remainingTurns)+' / '+Math.ceil(b.totalTurns||b.remainingTurns)+' 回合','出戰回合'));}
      if(h.shield>0)rows.push(row(who,'護盾','可抵擋所有來源傷害 · 剩餘 '+Math.round(h.shield),'無回合期限','耗盡或戰鬥結束'));
    }
    return rows.join('')||'<tr><td colspan="5" class="no-buffs">目前沒有生效中的 BUFF、DEBUFF 或消耗品效果。</td></tr>';
  };


  if(typeof validateBalanceConfig==='function'){
    const debuffValidateBalanceBase=validateBalanceConfig;
    validateBalanceConfig=function(input){
      const copy=JSON.parse(JSON.stringify(input));
      const allowedKinds=new Set(['attack','critical','fracture','guard','power','regen','weaken','followup','dotAttack','dotMaxHp','damageAmp','vulnerable']);
      const allowedTargets=new Set(['allies','enemy','enemies','weakest']);
      for(const [job,list] of (copy.supportSkills||[]).entries())for(const [i,sk] of (list||[]).entries()){
        normalizeSupportDebuffSkill(sk);
        if(sk&&!Number.isFinite(sk.effectPerLevel))sk.effectPerLevel=Number(copy.balanceSettings?.skills?.support?.effectPerExtraLevel??.2);
        if(!sk||!allowedKinds.has(sk.kind))throw Error(`輔助技能效果類型無效：${job}-${i}`);
        if(!allowedTargets.has(sk.target))throw Error(`輔助技能目標無效：${job}-${i}`);
        if(!SUPPORT_ELEMENT_KEYS.has(sk.element))throw Error(`輔助技能屬性無效：${job}-${i}`);
        if(!Number.isFinite(sk.value)||sk.value<0)throw Error(`輔助技能效果比例無效：${job}-${i}`);
        if(!Number.isFinite(sk.effectPerLevel)||sk.effectPerLevel<0)throw Error(`輔助技能每級增加倍率無效：${job}-${i}`);
        if(!Number.isInteger(sk.duration)||sk.duration<0||!Number.isInteger(sk.cooldown)||sk.cooldown<0||!Number.isInteger(sk.level)||sk.level<1)throw Error(`輔助技能回合／等級無效：${job}-${i}`);
        if(!Number.isFinite(sk.baseCritRate)||sk.baseCritRate<0||sk.baseCritRate>1||!Number.isFinite(sk.baseCritDamage)||sk.baseCritDamage<1||!Number.isFinite(sk.defensePenetration)||sk.defensePenetration<0||!Number.isFinite(sk.defenseIgnore)||sk.defenseIgnore<0||sk.defenseIgnore>1)throw Error(`輔助技能戰鬥判定無效：${job}-${i}`);
        if(SUPPORT_DEBUFF_KINDS.has(sk.kind)&&!['enemy','enemies'].includes(sk.target))throw Error(`傷害型 DEBUFF 目標必須是 enemy 或 enemies：${job}-${i}`);
      }
      return debuffValidateBalanceBase(copy);
    };
  }

  // Re-normalize support data after every balance import, including old vulnerable JSON.
  if(typeof applyBalanceConfig==='function'){
    const debuffApplyBalanceBase=applyBalanceConfig;
    applyBalanceConfig=function(input,{persist=true}={}){
      const copy=JSON.parse(JSON.stringify(input));
      for(const list of copy.supportSkills||[])for(const sk of list||[])normalizeSupportDebuffSkill(sk);
      const out=debuffApplyBalanceBase(copy,{persist:false});
      normalizeAllSupportDebuffs();
      if(persist)localStorage.setItem(BALANCE_KEY,JSON.stringify(exportableBalance()));
      if(state)render();
      return out;
    };
  }
  if(typeof exportableBalance==='function'){
    const debuffExportBalanceBase=exportableBalance;
    exportableBalance=function(){
      normalizeAllSupportDebuffs();
      const out=debuffExportBalanceBase();
      out.supportSkills=SUPPORT.map((list,job)=>list.map((sk,i)=>({id:`job${job}-support${i}`,...sk})));
      out.notes=[...(out.notes||[]),
        '輔助 DEBUFF 新機制：followup=受擊時以施放者攻擊力%造成可設定屬性的追打，會套用防禦、屬性克制與目標減傷；dotAttack=目標行動前受到施放者攻擊力%的固定傷害；dotMaxHp=目標行動前受到自身最大生命%的固定傷害；damageAmp=受到攻擊時該次傷害增加%。',
        'dotAttack / dotMaxHp 為直接固定傷害，不受防禦、抗性、增傷、減傷、暴擊、屬性克制影響。followup 為獨立追打，會使用角色暴率／暴傷並疊加輔助技能自身 baseCritRate / baseCritDamage / defensePenetration / defenseIgnore；防禦順序為破甲→防禦無視→固定防穿，且不再次套用 damageAmp / vulnerable。'];
      return out;
    };
  }

  // Runtime checks for manual testing from DevTools without exposing mutable internals.
  window.__EMBERWILD_DEBUFF_MECHANICS={kinds:[...SUPPORT_DEBUFF_KINDS],normalize:normalizeAllSupportDebuffs};
  if(state)render();
})();
</script>

<script id="equipment-identity-system-v2">
/* Equipment identity v2.
   Normal gear: prefix + suffix + base + hidden T grade.
   - Raw ATK/HP/DEF comes from the base form and T grade; prefix/suffix never add raw base stats.
   - Prefix/suffix each carry one explicit gameplay effect.
   Boss gear: no prefix/suffix and no random reroll affixes; one boss-exclusive profile supplies exactly three fixed effects.
*/
(()=>{
  const clone=v=>JSON.parse(JSON.stringify(v));
  const POWER_ITEM_TYPE='gearTierReroll';
  const POWER_ITEM_ID='power_tier_reroll';
  const VALID_ELEMENTS=new Set(['physical','fire','ice','wind','light','shadow']);
  const REGULAR_EFFECT_KEYS=new Set(['basicElement','basicAdvanceNextRound','attackPct','crit','critDamage','pierce','defenseIgnore','lifesteal','evasion','elementBonus','allCooldownReduction','dropRateBonus']);
  const BASE_EFFECT_KEYS=new Set([...EQUIPMENT_FIXED_EFFECT_KEYS]);

<script id="journal-resizable-split-fix">
(function(){

  const style=document.createElement('style');
  style.textContent=`

  `;
  document.head.appendChild(style);
  function applyHeight(){
    const journal=document.querySelector('.global-battle-journal');
    if(journal) journal.style.setProperty('--journal-loot-height',globalThis.journalLootHeight+'px');
  }
  globalThis.startJournalResize=function(ev){
    ev.preventDefault();
    const bar=ev.currentTarget, journal=bar.closest('.global-battle-journal'), loot=journal?.querySelector('.journal-loot-compact');
    if(!journal||!loot)return;
    if(!loot.open){ loot.open=true; globalThis.journalLootOpen=true; }
    const startY=ev.clientY, startH=loot.getBoundingClientRect().height;
    bar.classList.add('dragging'); bar.setPointerCapture?.(ev.pointerId);
    const move=e=>{
      const total=journal.getBoundingClientRect().height;
      const head=journal.querySelector('.global-journal-head')?.getBoundingClientRect().height||0;

    bar.addEventListener('pointermove',move);bar.addEventListener('pointerup',up);bar.addEventListener('pointercancel',up);
  };
  const observer=new MutationObserver(applyHeight); observer.observe(document.getElementById('app'),{childList:true,subtree:true});
